canonical_principles:
  maxim: "NVSN connects. NEO Wire communicates. Bitcoin settles. Counterparty tokenizes. World Currency denominates. NEOsync coordinates."
  nvsn_role: distributed software-defined communications fabric
  bitcoin_role: final monetary settlement and selected integrity anchoring
  lightning_role: instant and micropayment settlement where appropriate
  counterparty_role: Bitcoin-native tokenization and asset layer
  world_currency_role: denomination and payment-routing layer
  neo_telegram_role: common logical message envelope
  neo_identity_role: cryptographic identity and endpoint resolution

boundaries:
  - NVSN is not synonymous with NEO Wire.
  - Communications payloads generally remain off-chain; Bitcoin is not the bulk-data carrier.
  - Virtual satellite refers to software-defined orchestration of authorized physical infrastructure, not hardware-free satellite communications.
  - A telephone number may resolve to cryptographic endpoints but is not itself inherently a blockchain address.
  - Counterparty assets do not automatically create legal fiat, securities, commodity, or other regulated rights.
  - Internal NEO policy does not itself create external civil jurisdiction or override public law.
  - Simulation, planned architecture, and deployed production infrastructure must remain separately labeled.
  - Unauthorized RF transmission, interception, third-party system access, or access-control bypass is outside the authorized architecture.

roadmap:
