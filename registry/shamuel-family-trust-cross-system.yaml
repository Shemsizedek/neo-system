internal_social_norms:
  - stewardship_before_consumption
  - source_before_assertion
  - fiduciary_duty_before_convenience
  - privacy_by_default
  - disclose_conflicts
  - avoid_undocumented_commingling
  - record_material_decisions
  - distinguish_roles_and_authorities
  - internal_titles_do_not_replace_documented_legal_authority
  - preserve_intergenerational_continuity_with_auditable_records

boundaries:
  - Executed instruments control trust-specific facts over derivative NEO records.
  - User-described relationships among affiliated trusts remain asserted architecture until governing records are supplied and reviewed.
  - Internal NEO governance does not override applicable public law, tax law, fiduciary duties, court orders, title rules, or regulatory requirements.
  - Educational and analytical outputs are not substitutes for licensed legal, tax, accounting, investment, or fiduciary professionals where required.
