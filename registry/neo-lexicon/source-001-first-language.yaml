integration:
  neo_lingo:
    purpose: Provide plain-language explanations while preserving canonical source terms.
    rule: Do not overwrite Pa Sarun or other authoritative NEO registries.
  neo_cipher:
    allowed:
    - Use approved lexicon terms as semantic labels, mnemonic material, or display encodings.
    - Use script metadata for Yamassee/Nuwaubian presentation.
    forbidden:
    - Do not use book vocabulary, glyph secrecy, numerology, or symbolic values as a substitute for cryptographic entropy.
    - Do not derive production cryptographic keys directly from dictionary words.
  yamassee:
    status: FONT/PRESENTATION LAYER
    rule: Map approved encoded payloads to the Yamassee glyph carrier only after cryptographic protection.
