version: "1.1"
id: gisd-templist-curriculum-144
name: "GISD Templist Curriculum — 144 Degrees"
status: ACTIVE
classification: SOURCE_SUPPLIED_DOCTRINE
source_scope: "Canonical curriculum rules supplied by Dr. Lawiy Zodok Shamu-El in the Temple Degrees and Noological Doctrine working sessions"

preservation_rules:
  - "Preserve Major Lesson names exactly; never rename or modernize them."
  - "Use Templist as the primary learner/initiate term."
  - "Reserve Noonebu for Elite/Elect Noocratic Society and Branch Temple No. 24 contexts."
  - "Do not invent historical grips, passwords, tokens, rituals, quotations, or source claims."
  - "Distinguish historical/manual-derived material from Temple curriculum interpretation and Noological synthesis."
  - "When an exact Test of Study question has been supplied, reproduce it precisely without paraphrase."
  - "External historical, scientific, medical, legal, accreditation, and therapeutic claims require separate verification."

structure:
  total_degrees: 144
  universal_entry_rule: "Every initiate begins at Temple Degree 1 regardless of age or prior education. Assignment sophistication adapts to age and readiness; the degree sequence does not change."
  major_lesson_degree_model: "Major Lessons 1-4 each contain 36 degrees; Major Lessons 5-9 are honorary/elect layers encompassed at 144° and do not replace the 144 numbered degree sequence."
  theme_ranges:
    - range: "1-36"
      theme: Masonic
    - range: "37-72"
      theme: Magi
    - range: "73-108"
      theme: Shriner
    - range: "109-144"
      theme: Mystic
    - range: "144"
      theme: Elite
      note: "Honorary Elect & Elite crown; encompasses Major Lessons 5-9."
  school_bands:
    - range: "1-5"
      school: "True Light Elementary"
    - range: "6-8"
      school: "Nun Middle"
    - range: "9-12"
      school: "Noone High"
    - range: "13-21"
      school: "Nu University"
      note: "Doctrine contribution, research, teacher development, and advanced scholastic portfolio work."
    - eligibility: "9+"
      school: "Nu Omni Academy / Amen Institute"
      note: "Honorary, vocational, trade, scientific, professional, and special-study pathways."
    - range: "22-144"
      school: "Advanced GISS / Temple Degree Portfolio"
      note: "Vocational, scientific, doctrinal, leadership, elderhood, and global service progression."
  element_rule:
    known: "Degrees 1-118 map one-to-one to periodic atomic numbers 1-118."
    etheric: "Degrees 119-144 map to Ether 1-26 as source-defined undiscovered/etheric curriculum elements; treat as doctrine/research framing, not established chemistry."

portfolio_model:
  enabled: true
  multi_assignment_degrees: true
  assignment_modes:
    - essay
    - report
    - excerpt
    - research paper
    - journal
    - blog
    - vlog
    - podcast
    - oral presentation
    - practical demonstration
    - service
    - field assignment
    - object / artifact
    - professional application
  initiation_stone_required: true
  initiation_stone_rule: "Each initiate brings a stone or crystal as part of initiation. Local schools/temple districts may record milestone stones in the portfolio."
  under_14: "May complete learning at home, temple school, school building, shared living/learning quarters, or supervised local environments with age-appropriate complexity."
  age_14_plus: "May complete location-based research, travel, interviews, service, documentation, and content-curation assignments where appropriate."
  purpose: "Create a lifelong Global Village portfolio of scholastic, creative, professional, service, and doctrinal work portable across participating GISS/GISD schools and temple districts."
  funding_model: "Temple Pledge System plus approved Nous Project / GISS global endeavors."

