      - economic development
      - education and records modernization
    decision_roles:
      - administrator
      - chief information officer
      - economic development director
  - id: municipality
    priority: 3
    typical_deal_classes: [sovereign_institutional, institutional_saas]
    asking_range_usd: [1000000, 5000000]
    public_signals:
      - digital services
      - resident service routing
      - internal knowledge modernization
      - procurement modernization
    decision_roles:
      - city manager
      - chief information officer
      - chief innovation officer

