name: Gate 123 Sovereign Asset Depository and Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['architecture/neo-asset-depository-policy.json','server/neo-assets/**','docs/NEO-G123-ASSET-DEPOSITORY-REGISTRY.md','package.json','.github/workflows/gate-123-sovereign-assets.yml']
  pull_request:
    paths: ['architecture/neo-asset-depository-policy.json','server/neo-assets/**','docs/NEO-G123-ASSET-DEPOSITORY-REGISTRY.md','package.json','.github/workflows/gate-123-sovereign-assets.yml']
permissions: {contents: read}
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run neo-assets:test
      - run: node --check server/neo-assets/server.mjs
