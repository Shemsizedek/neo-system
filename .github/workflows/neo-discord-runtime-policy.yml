name: NEO Discord Runtime Policy

on:
  pull_request:
    paths:
      - 'services/neo-discord/**'
      - '.github/workflows/neo-discord-runtime-policy.yml'
  push:
    branches: [main]
    paths:
      - 'services/neo-discord/**'
      - '.github/workflows/neo-discord-runtime-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate runtime policy
        run: node services/neo-discord/deployment/evaluate-policy.mjs
      - name: Run failover policy tests
        run: node services/neo-discord/tests/runtime-policy.test.mjs
      - name: Verify adapter paths exist
        run: |
          test -s services/neo-discord/adapters/cloudflare/worker.js
          test -s services/neo-discord/adapters/node-http/server.js
          test -s services/neo-discord/tests/adapter-parity.mjs
      - name: Verify failover cannot elevate privileges
        run: |
          node - <<'NODE'
          const p=require('./services/neo-discord/deployment/runtime-policy.json')
          if(p.failover.automaticPromotion!==false) process.exit(1)
          if(p.failover.mayChangeAuthorizationPolicy!==false) process.exit(1)
          if(p.failover.mayEnableSensitiveExecution!==false) process.exit(1)
          if(p.failover.mayApproveIntents!==false) process.exit(1)
          NODE
