name: Verify NEO Edge Live UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-neo-edge-live-ui.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      CERT_NAME: neo-edge-managed-cert
      RELATIONS_CERT_NAME: neo-edge-relations-cert
      FINANCE_CERT_NAME: neo-edge-finance-cert
      TELLER_CERT_NAME: neo-edge-teller-cert
      HTTPS_PROXY_NAME: neo-edge-https-proxy
      IP_NAME: neo-edge-global-ip
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Read front-door state
        run: |
          set -euo pipefail
          EDGE_IP="$(gcloud compute addresses describe "$IP_NAME" --global --project="$GCP_PROJECT_ID" --format='value(address)')"
          CERT_STATUS="$(gcloud compute ssl-certificates describe "$CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='value(managed.status)')"
          RELATIONS_CERT_STATUS="$(gcloud compute ssl-certificates describe "$RELATIONS_CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='value(managed.status)')"
          FINANCE_CERT_STATUS="$(gcloud compute ssl-certificates describe "$FINANCE_CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='value(managed.status)')"
          TELLER_CERT_STATUS="$(gcloud compute ssl-certificates describe "$TELLER_CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='value(managed.status)')"
          TELLER_DOMAIN_STATUS="$(gcloud compute ssl-certificates describe "$TELLER_CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='json(managed.domainStatus)' || true)"

          echo "NEO Edge global IPv4: ${EDGE_IP:-missing}"
          echo "Primary certificate: ${CERT_STATUS:-missing}"
          echo "Relations certificate: ${RELATIONS_CERT_STATUS:-missing}"
          echo "Finance certificate: ${FINANCE_CERT_STATUS:-missing}"
          echo "Teller certificate: ${TELLER_CERT_STATUS:-missing}"
          echo "Teller domain status: ${TELLER_DOMAIN_STATUS:-unknown}"

          test -n "$EDGE_IP" || { echo '::error::NEO Edge global IPv4 is missing'; exit 1; }
          test "$CERT_STATUS" = ACTIVE || { echo "::error::$CERT_NAME is $CERT_STATUS, expected ACTIVE"; exit 1; }
          test "$RELATIONS_CERT_STATUS" = ACTIVE || { echo "::error::$RELATIONS_CERT_NAME is $RELATIONS_CERT_STATUS, expected ACTIVE"; exit 1; }
          test "$FINANCE_CERT_STATUS" = ACTIVE || { echo "::error::$FINANCE_CERT_NAME is $FINANCE_CERT_STATUS, expected ACTIVE"; exit 1; }
          test "$TELLER_CERT_STATUS" = ACTIVE || { echo "::error::$TELLER_CERT_NAME is $TELLER_CERT_STATUS, expected ACTIVE. Ensure teller.holytemples.org resolves to $EDGE_IP and the certificate is attached to $HTTPS_PROXY_NAME"; exit 1; }
          echo "NEO_EDGE_GLOBAL_IP=$EDGE_IP" >> "$GITHUB_ENV"

      - name: Verify live HTML surfaces
        run: |
          set -euo pipefail
          hosts=(
            neo.holytemples.org router.holytemples.org algo.holytemples.org prime.holytemples.org
            pay.holytemples.org neobank.holytemples.org hub.holytemples.org counter.holytemples.org
            wire.holytemples.org neogram.holytemples.org neofx.holytemples.org scan.holytemples.org
            school.holytemples.org library.holytemples.org book.holytemples.org neopads.holytemples.org
            neopass.holytemples.org neovision.holytemples.org noogle.holytemples.org omnitrix.holytemples.org
            neodash.holytemples.org nomni.holytemples.org wallet.holytemples.org treasury.holytemples.org
            relations.holytemples.org finance.holytemples.org teller.holytemples.org
          )
          failures=0
          for host in "${hosts[@]}"; do
            headers="$(mktemp)"; body="$(mktemp)"
            code="$(curl --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -sS -D "$headers" -o "$body" -w '%{http_code}' "https://$host/" || true)"
            ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub(/\r/,""); print $2}' "$headers" | tail -1)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            verdict=PASS
            if [[ "$code" != "200" ]] || [[ "$ctype" != text/html* ]] || (( bytes < 300 )); then verdict=FAIL; failures=$((failures+1)); fi
            echo "| $host | $code | ${ctype:-none} | $bytes | $verdict |" >> /tmp/neo-ui-table.md
            rm -f "$headers" "$body"
          done
          test "$failures" -eq 0

      - name: Verify NEO Relations application assets
        run: |
          set -euo pipefail
          for path in /health /api /data/tenants.json /data/status.json /styles.css /app.js; do
            code="$(curl --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 --resolve "relations.holytemples.org:443:${NEO_EDGE_GLOBAL_IP}" -sS -o /tmp/relations-asset -w '%{http_code}' "https://relations.holytemples.org${path}" || true)"
            test "$code" = 200
            test -s /tmp/relations-asset
          done

      - name: Verify NEO Exchange application and market API
        run: |
          set -euo pipefail
          host=neofx.holytemples.org
          curl --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/" -o /tmp/neofx-index.html
          mapfile -t assets < <(grep -oE '/assets/[^"'"'"' ]+\.(js|css)' /tmp/neofx-index.html | sort -u)
          test "${#assets[@]}" -ge 1
          for path in "${assets[@]}"; do
            curl --connect-timeout 10 --max-time 25 --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host${path}" -o /tmp/neofx-asset
            test -s /tmp/neofx-asset
          done
          for path in /health /api /api/neo-exchange/health /api/neo-exchange/markets '/api/neo-exchange/orderbook?base=BTC&quote=XCP&limit=5'; do
            code="$(curl --connect-timeout 10 --max-time 40 --retry 1 --retry-delay 2 --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -sS -o /tmp/neofx-api -w '%{http_code}' "https://$host${path}" || true)"
            test "$code" = 200
            test -s /tmp/neofx-api
          done

      - name: Verify Noogle Finance live market UI
        run: |
          set -euo pipefail
          host=finance.holytemples.org
          for path in / /health /api /api/neo-exchange/health /api/neo-exchange/markets; do
            code="$(curl --connect-timeout 10 --max-time 40 --retry 1 --retry-delay 2 --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -sS -o /tmp/finance-response -w '%{http_code}' "https://$host${path}" || true)"
            test "$code" = 200
            test -s /tmp/finance-response
          done
          curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/" -o /tmp/finance-index.html
          grep -q 'NOOGLE FINANCE' /tmp/finance-index.html
          grep -q '/api/neo-exchange/markets' /tmp/finance-index.html
          ! grep -q 'neo-market-symbols.js\|neo-market-tape.js' /tmp/finance-index.html

      - name: Verify NEO Teller live UI and read-only network API
        run: |
          set -euo pipefail
          host=teller.holytemples.org
          for path in / /health /api /platform-shell.css /platform-shell.js /neo-system/api/platforms/neo-teller.json /api/v1/teller/health /api/v1/teller/network; do
            code="$(curl --connect-timeout 10 --max-time 40 --retry 1 --retry-delay 2 --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -sS -o /tmp/teller-response -w '%{http_code}' "https://$host${path}" || true)"
            echo "teller${path} -> $code" >> "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
            test -s /tmp/teller-response
          done
          curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/" -o /tmp/teller-index.html
          grep -q 'NEO Teller' /tmp/teller-index.html
          curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/api/v1/teller/network" -o /tmp/teller-network.json
          grep -q '"readOnly":true' /tmp/teller-network.json
          grep -q '"sign":false' /tmp/teller-network.json
          grep -q '"broadcast":false' /tmp/teller-network.json
