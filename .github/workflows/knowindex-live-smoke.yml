name: KNOWINDEX Production Read-Only Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/knowindex-live-smoke.mjs'
      - 'data/knowindex/**'
      - '.github/workflows/knowindex-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-noogle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live public Noogle KNOWINDEX snapshot
        run: node scripts/knowindex-live-smoke.mjs
