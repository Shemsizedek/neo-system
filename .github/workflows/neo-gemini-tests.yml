name: NEO Gemini Integration Tests
on:
  pull_request:
    paths:
      - 'deploy/crown-gem-004/**'
      - '.github/workflows/neo-gemini-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gemini-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r deploy/crown-gem-004/requirements.txt
      - name: Validate Python sources
        run: python -m compileall -q deploy/crown-gem-004
      - name: Run isolated Gemini test suite
        run: python -m unittest discover -s deploy/crown-gem-004 -p 'test_*.py' -v
