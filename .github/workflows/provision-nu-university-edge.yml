name: Provision Nu University HTTPS Edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-nu-university-edge.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: nu-university-edge
  cancel-in-progress: false

env:
  SERVICE_NAME: neo-nu-university
  DOMAIN_NAME: university.holytemples.org
  ADDRESS_NAME: neo-nu-university-ip
  NEG_NAME: neo-nu-university-neg
  BACKEND_NAME: neo-nu-university-backend
  URL_MAP_NAME: neo-nu-university-map
  CERT_NAME: neo-nu-university-cert
  HTTPS_PROXY_NAME: neo-nu-university-https-proxy
  HTTPS_RULE_NAME: neo-nu-university-https

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify Cloud Run origin
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$URL"
          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/health")" = 200
          grep -q '"status":"ok"' /tmp/health.json
          echo "Cloud Run origin: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Reserve global IPv4 address
        run: |
          set -euo pipefail
          if ! gcloud compute addresses describe "$ADDRESS_NAME" --project="$GCP_PROJECT_ID" --global >/dev/null 2>&1; then
            gcloud compute addresses create "$ADDRESS_NAME" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --ip-version=IPV4 \
              --network-tier=PREMIUM \
              --quiet
          fi
          EDGE_IP="$(gcloud compute addresses describe "$ADDRESS_NAME" --project="$GCP_PROJECT_ID" --global --format='value(address)')"
          test -n "$EDGE_IP"
          echo "EDGE_IP=$EDGE_IP" >> "$GITHUB_ENV"
          echo "Reserved edge IPv4: $EDGE_IP" >> "$GITHUB_STEP_SUMMARY"

      - name: Create serverless NEG
        run: |
          set -euo pipefail
          if ! gcloud compute network-endpoint-groups describe "$NEG_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null 2>&1; then
            gcloud compute network-endpoint-groups create "$NEG_NAME" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --network-endpoint-type=serverless \
              --cloud-run-service="$SERVICE_NAME" \
              --quiet
          fi

      - name: Create global backend service
        run: |
          set -euo pipefail
          if ! gcloud compute backend-services describe "$BACKEND_NAME" --project="$GCP_PROJECT_ID" --global >/dev/null 2>&1; then
            gcloud compute backend-services create "$BACKEND_NAME" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --load-balancing-scheme=EXTERNAL_MANAGED \
              --protocol=HTTP \
              --quiet
          fi
          if ! gcloud compute backend-services describe "$BACKEND_NAME" --project="$GCP_PROJECT_ID" --global --format=json | jq -e --arg neg "$NEG_NAME" '.backends[]? | .group | endswith("/" + $neg)' >/dev/null; then
            gcloud compute backend-services add-backend "$BACKEND_NAME" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --network-endpoint-group="$NEG_NAME" \
              --network-endpoint-group-region="$GCP_REGION" \
              --quiet
          fi

      - name: Create URL map
        run: |
          set -euo pipefail
          if ! gcloud compute url-maps describe "$URL_MAP_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute url-maps create "$URL_MAP_NAME" \
              --project="$GCP_PROJECT_ID" \
              --default-service="$BACKEND_NAME" \
              --quiet
          fi

      - name: Create Google-managed certificate
        run: |
          set -euo pipefail
          if ! gcloud compute ssl-certificates describe "$CERT_NAME" --project="$GCP_PROJECT_ID" --global >/dev/null 2>&1; then
            gcloud compute ssl-certificates create "$CERT_NAME" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --domains="$DOMAIN_NAME" \
              --quiet
          fi

      - name: Create HTTPS target proxy
        run: |
          set -euo pipefail
          if ! gcloud compute target-https-proxies describe "$HTTPS_PROXY_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute target-https-proxies create "$HTTPS_PROXY_NAME" \
              --project="$GCP_PROJECT_ID" \
              --url-map="$URL_MAP_NAME" \
              --ssl-certificates="$CERT_NAME" \
              --quiet
          fi

      - name: Create global HTTPS forwarding rule
        run: |
          set -euo pipefail
          if ! gcloud compute forwarding-rules describe "$HTTPS_RULE_NAME" --project="$GCP_PROJECT_ID" --global >/dev/null 2>&1; then
            gcloud compute forwarding-rules create "$HTTPS_RULE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --load-balancing-scheme=EXTERNAL_MANAGED \
              --network-tier=PREMIUM \
              --address="$ADDRESS_NAME" \
              --target-https-proxy="$HTTPS_PROXY_NAME" \
              --ports=443 \
              --quiet
          fi

      - name: Report edge state
        run: |
          set -euo pipefail
          CERT_STATUS="$(gcloud compute ssl-certificates describe "$CERT_NAME" --project="$GCP_PROJECT_ID" --global --format='value(managed.status)' || true)"
          echo "### Nu University production edge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Domain: https://$DOMAIN_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static IPv4: $EDGE_IP" >> "$GITHUB_STEP_SUMMARY"
          echo "- Certificate status: ${CERT_STATUS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required DNS: A university.holytemples.org -> $EDGE_IP" >> "$GITHUB_STEP_SUMMARY"
          echo "EDGE_IP=$EDGE_IP"
