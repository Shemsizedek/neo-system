name: NEOscan Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/neoscan/**'
      - 'public/markets/neo-market-tape.js'
      - 'public/neo-prime/markets.html'
      - 'scripts/build-neoscan-statements-snapshots.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/neoscan-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching GitHub Pages statement build
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL='https://shemsizedek.github.io/neo-system/api/neoscan/statements/index.json'
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location "$URL?attempt=$attempt" -o index.json; then
              ACTUAL="$(python -c "import json; print(json.load(open('index.json')).get('commit',''))")"
              if [ "$ACTUAL" = "$EXPECTED_COMMIT" ]; then
                echo "GitHub Pages snapshot is current: $ACTUAL"
                exit 0
              fi
              echo "Waiting for Pages: expected $EXPECTED_COMMIT, currently $ACTUAL"
            fi
            sleep 5
          done
          echo 'Timed out waiting for the GitHub Pages artifact built from this commit.' >&2
          exit 1

      - name: Verify GitHub Pages NEOscan surface
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://shemsizedek.github.io/neo-system/neoscan/'
          HTML="$(curl --fail --silent --show-error --location "$PAGE")"
          grep -q 'NEOscan — Public Explorer' <<<"$HTML"
          grep -q 'market-terminal.js' <<<"$HTML"
          grep -q 'nomni-base-board.js' <<<"$HTML"
          grep -q 'pair-deeplink.js' <<<"$HTML"
          grep -q '../markets/neo-market-tape.js' <<<"$HTML"
          grep -q '<neo-market-tape' <<<"$HTML"
          grep -q 'market-terminal.css' <<<"$HTML"
          grep -q 'NEO Market Terminal' <<<"$HTML"
          grep -q 'data-surface="market"' <<<"$HTML"
          grep -q 'N.O.M.N.I. PRIMARY MARKET' <<<"$HTML"
          grep -q 'Noocratic Open Market Natural Index' <<<"$HTML"
          ! grep -qi '>NEO Ledger<' <<<"$HTML"
          ! grep -qi 'Counterparty' <<<"$HTML"

      - name: Enforce NEO Market Terminal v3
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shemsizedek.github.io/neo-system/neoscan'
          curl --fail --silent --show-error --location "$BASE/treasury-dashboard.js" -o treasury-dashboard.js
          curl --fail --silent --show-error --location "$BASE/nomni-market-policy.js" -o nomni-market-policy.js
          curl --fail --silent --show-error --location "$BASE/market-terminal.js" -o market-terminal.js
          curl --fail --silent --show-error --location "$BASE/nomni-base-board.js" -o nomni-base-board.js
          curl --fail --silent --show-error --location "$BASE/pair-deeplink.js" -o pair-deeplink.js
          curl --fail --silent --show-error --location "$BASE/market-terminal.css" -o market-terminal.css
          grep -q "primaryAsset:'NOMNI'" nomni-market-policy.js
          grep -q "terminalName:'NEO Market Terminal'" nomni-market-policy.js
          grep -q 'XCP — Bitcoin Community Smart-Contract Obligations' nomni-market-policy.js
          grep -q 'data-neoscan-surface="market"' treasury-dashboard.js
          grep -q 'NEO Market Terminal' treasury-dashboard.js
          grep -q "location.hash==='#market'" market-terminal.js
          grep -q 'Market Depth' market-terminal.js
          grep -q 'Recent Completed Trades' market-terminal.js
          grep -q 'NEO Treasury Position' market-terminal.js
          grep -q 'Bitcoin Settlement' market-terminal.js
          grep -q 'Holders' market-terminal.js
          grep -q 'Issuance History' market-terminal.js
          grep -q "const BASE='NOMNI'" nomni-base-board.js
          grep -q "PRIORITY=\['BTC','NEOCASH','XCP'\]" nomni-base-board.js
          grep -q 'BEST BID' nomni-base-board.js
          grep -q 'BEST ASK' nomni-base-board.js
          grep -q 'SPREAD %' nomni-base-board.js
          grep -q 'NOMNI Pair Matrix' nomni-base-board.js
          grep -q 'no synthetic market is created' nomni-base-board.js
          grep -q "get('pair')" pair-deeplink.js
          grep -q '.nomni-base-board' market-terminal.css
          ! grep -qi 'tokenscan' market-terminal.js nomni-base-board.js

      - name: Verify shared NOMNI market tape and NEO Prime market surface
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://shemsizedek.github.io/neo-system'
          curl --fail --silent --show-error --location "$ROOT/markets/neo-market-tape.js" -o neo-market-tape.js
          curl --fail --silent --show-error --location "$ROOT/neo-prime/markets.html" -o prime-markets.html
          grep -q "const BASE='NOMNI'" neo-market-tape.js
          grep -q "PRIORITY=\['BTC','NEOCASH','XCP'\]" neo-market-tape.js
          grep -q 'NOMNI PRIMARY MARKET' neo-market-tape.js
          grep -q 'terminal-root="../neoscan/"' prime-markets.html
          grep -q 'NEO Market Tape' prime-markets.html
          grep -q 'Noocratic Open Market Natural Index' prime-markets.html
          ! grep -qi 'Counterparty' prime-markets.html
          ! grep -qi 'tokenscan' neo-market-tape.js prime-markets.html

      - name: Verify GitHub-native runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_URL='https://shemsizedek.github.io/neo-system/neoscan/runtime-config.js'
          CONFIG="$(curl --fail --silent --show-error --location "$CONFIG_URL")"
          grep -q "statementsSnapshotBase:'../api/neoscan/statements'" <<<"$CONFIG"
          ! grep -q 'neoscan-statements-public.neosystem.workers.dev' <<<"$CONFIG"

      - name: Verify public statement manifest
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shemsizedek.github.io/neo-system/api/neoscan/statements'
          curl --fail --silent --show-error --location "$BASE/index.json" -o index.json
          python - <<'PY'
          import json
          data=json.load(open('index.json'))
          assert data.get('schema') == 'neo.statement.snapshot-index.v1', data
          assert data.get('source') == 'GitHub Actions', data
          assert data.get('readOnly') is True, data
          assert data.get('accountCount', 0) >= 2, data
          PY

      - name: Verify end-to-end treasury statement snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shemsizedek.github.io/neo-system/api/neoscan/statements'
          ADDRESS='18FyntJG9hdXYvanm67mGgbyo1P7adckvg'
          curl --fail --silent --show-error --location "$BASE/$ADDRESS.json" -o statement.json
          python - <<'PY'
          import json
          data=json.load(open('statement.json'))
          statement=data.get('data') or {}
          sources=statement.get('sources') or {}
          assert data.get('ok') is True, data
          assert statement.get('account') == '18FyntJG9hdXYvanm67mGgbyo1P7adckvg', statement
          assert statement.get('consolidatedTotal') is None, statement
          units={row.get('unit'):row.get('amount') for row in sources['counterparty'].get('entries', [])}
          for required in ('NOMNI','NEOCASH','XCP'):
              assert required in units, (required, units)
          PY
