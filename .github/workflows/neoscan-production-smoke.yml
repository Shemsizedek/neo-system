name: NEOscan Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/neoscan/**'
      - 'scripts/build-neoscan-statements-snapshots.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/neoscan-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching GitHub Pages statement build
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL='https://shemsizedek.github.io/neo-system/api/neoscan/statements/index.json'
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location "$URL?attempt=$attempt" -o index.json; then
              ACTUAL="$(python -c "import json; print(json.load(open('index.json')).get('commit',''))")"
              if [ "$ACTUAL" = "$EXPECTED_COMMIT" ]; then
                echo "GitHub Pages snapshot is current: $ACTUAL"
                exit 0
              fi
              echo "Waiting for Pages: expected $EXPECTED_COMMIT, currently $ACTUAL"
            fi
            sleep 5
          done
          echo 'Timed out waiting for the GitHub Pages artifact built from this commit.' >&2
          exit 1

      - name: Verify GitHub Pages NEOscan surface
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://shemsizedek.github.io/neo-system/neoscan/'
          HTML="$(curl --fail --silent --show-error --location "$PAGE")"
          grep -q 'NEOscan — Public Explorer' <<<"$HTML"
          grep -q 'statements-client.js' <<<"$HTML"
          grep -q 'treasury-dashboard.js' <<<"$HTML"
          grep -q 'nomni-market-policy.js' <<<"$HTML"
          grep -q 'data-surface="treasury"' <<<"$HTML"
          grep -q 'N.O.M.N.I. PRIMARY MARKET' <<<"$HTML"
          grep -q 'Noocratic Open Market Natural Index' <<<"$HTML"
          ! grep -qi 'Counterparty' <<<"$HTML"

      - name: Enforce NEOscan-native public identity and treasury drilldowns
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shemsizedek.github.io/neo-system/neoscan'
          curl --fail --silent --show-error --location "$BASE/index.html" -o neoscan-index.html
          curl --fail --silent --show-error --location "$BASE/app.js" -o neoscan-app.js
          curl --fail --silent --show-error --location "$BASE/treasury-dashboard.js" -o treasury-dashboard.js
          curl --fail --silent --show-error --location "$BASE/nomni-market-policy.js" -o nomni-market-policy.js
          cat neoscan-index.html neoscan-app.js treasury-dashboard.js nomni-market-policy.js > neoscan-public.txt
          ! grep -qi 'tokenscan' neoscan-public.txt
          grep -q "primaryAsset:'NOMNI'" nomni-market-policy.js
          grep -q "marketName:'N.O.M.N.I.'" nomni-market-policy.js
          grep -q 'XCP — Bitcoin Community Smart-Contract Obligations' nomni-market-policy.js
          grep -q 'data-neoscan-surface="scan"' treasury-dashboard.js
          grep -q 'data-neoscan-surface="ledger"' treasury-dashboard.js
          grep -q 'Asset profile' treasury-dashboard.js
          grep -q 'NEO Ledger' treasury-dashboard.js

      - name: Verify GitHub-native runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_URL='https://shemsizedek.github.io/neo-system/neoscan/runtime-config.js'
          CONFIG="$(curl --fail --silent --show-error --location "$CONFIG_URL")"
          grep -q "statementsSnapshotBase:'../api/neoscan/statements'" <<<"$CONFIG"
          ! grep -q 'neoscan-statements-public.neosystem.workers.dev' <<<"$CONFIG"

      - name: Verify public statement manifest
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shemsizedek.github.io/neo-system/api/neoscan/statements'
          curl --fail --silent --show-error --location "$BASE/index.json" -o index.json
          python - <<'PY'
          import json
          data=json.load(open('index.json'))
          assert data.get('schema') == 'neo.statement.snapshot-index.v1', data
          assert data.get('source') == 'GitHub Actions', data
          assert data.get('readOnly') is True, data
          assert data.get('accountCount', 0) >= 2, data
          accounts={row.get('account'):row for row in data.get('accounts', [])}
          for address in ('18FyntJG9hdXYvanm67mGgbyo1P7adckvg','1Ky2wRYYrJzqdQJH64F7TR98fqLxJs7LK8'):
              assert address in accounts, (address, accounts)
          PY

      - name: Verify end-to-end treasury statement snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shemsizedek.github.io/neo-system/api/neoscan/statements'
          ADDRESS='18FyntJG9hdXYvanm67mGgbyo1P7adckvg'
          curl --fail --silent --show-error --location "$BASE/$ADDRESS.json" -o statement.json
          python - <<'PY'
          import json
          data=json.load(open('statement.json'))
          assert data.get('ok') is True, data
          assert data.get('source') == 'github-actions-snapshot', data
          assert data.get('requestId'), data
          statement=data.get('data') or {}
          assert statement.get('schema') == 'neo.statement.service.v1', statement
          assert statement.get('statementSchema') == 'neo.statement.v1', statement
          assert statement.get('account') == '18FyntJG9hdXYvanm67mGgbyo1P7adckvg', statement
          sources=statement.get('sources') or {}
          for name in ('bitcoin','counterparty','ces','offline'):
              assert name in sources, (name, sources)
          assert statement.get('consolidatedTotal') is None, statement
          assert sources['offline'].get('status') == 'unavailable', sources['offline']
          units={row.get('unit'):row.get('amount') for row in sources['counterparty'].get('entries', [])}
          for required in ('NOMNI','NEOCASH','XCP'):
              assert required in units, (required, units)
          print(json.dumps({
              'account': statement.get('account'),
              'reconciliationStatus': statement.get('reconciliationStatus'),
              'sourceStatuses': {k:(v or {}).get('status') for k,v in sources.items()},
              'keyNativeBalances': {k:units[k] for k in ('NOMNI','NEOCASH','XCP')}
          }, indent=2))
          PY
