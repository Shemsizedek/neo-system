name: NEOscan Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/neoscan/**'
      - 'cloudflare/neoscan-statements/**'
      - '.github/workflows/neoscan-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages NEOscan surface
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://shemsizedek.github.io/neo-system/neoscan/'
          HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$PAGE")"
          grep -q 'NEOscan — Public Explorer' <<<"$HTML"
          grep -q 'statements-client.js' <<<"$HTML"

      - name: Verify deployed runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_URL='https://shemsizedek.github.io/neo-system/neoscan/runtime-config.js'
          CONFIG="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$CONFIG_URL")"
          grep -q 'https://neoscan-statements.neosystem.workers.dev' <<<"$CONFIG"

      - name: Verify Statements Worker health and readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://neoscan-statements.neosystem.workers.dev'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 -D health.headers "$BASE/health" -o health.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 -D ready.headers "$BASE/ready" -o ready.json
          echo '--- health headers ---'
          cat health.headers
          echo '--- health body preview ---'
          head -c 500 health.json || true
          echo
          echo '--- ready headers ---'
          cat ready.headers
          echo '--- ready body preview ---'
          head -c 500 ready.json || true
          echo
          test -s health.json
          test -s ready.json
          python - <<'PY'
          import json
          for path, expected in [('health.json','live'),('ready.json','ready')]:
              raw=open(path,'rb').read()
              try:
                  data=json.loads(raw)
              except Exception as exc:
                  raise AssertionError(f'{path} is not JSON: {raw[:500]!r}') from exc
              assert data.get('ok') is True, data
              assert data.get('status') == expected, data
          PY

      - name: Verify end-to-end public statement envelope
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://neoscan-statements.neosystem.workers.dev'
          ADDRESS='1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            -H 'Accept: application/json' \
            -H 'Origin: https://shemsizedek.github.io' \
            "$BASE/v1/statements?address=$ADDRESS" \
            -D headers.txt -o statement.json
          test -s statement.json
          python - <<'PY'
          import json
          raw=open('statement.json','rb').read()
          try:
              data=json.loads(raw)
          except Exception as exc:
              raise AssertionError(f'statement response is not JSON: {raw[:500]!r}') from exc
          assert data.get('ok') is True, data
          assert data.get('requestId'), data
          statement=data.get('data') or {}
          assert statement.get('schema') == 'neo.statement.service.v1', statement
          assert statement.get('statementSchema') == 'neo.statement.v1', statement
          sources=statement.get('sources') or {}
          for name in ('bitcoin','counterparty','ces'):
              assert name in sources, (name, sources)
          assert statement.get('consolidatedTotal') is None, statement
          headers=open('headers.txt', encoding='utf-8', errors='ignore').read().lower()
          assert 'access-control-allow-origin: https://shemsizedek.github.io' in headers, headers
          print(json.dumps({
              'schema': statement.get('schema'),
              'statementSchema': statement.get('statementSchema'),
              'reconciliationStatus': statement.get('reconciliationStatus'),
              'sourceStatuses': {k:(v or {}).get('status') for k,v in sources.items() if k in ('bitcoin','counterparty','ces')}
          }, indent=2))
          PY
