name: Deploy NEO Society DNNR Mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-society-dnnr-proxy/**'
      - '.github/workflows/deploy-neo-society-dnnr-proxy.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-society-dnnr-proxy
  cancel-in-progress: false

env:
  SERVICE_NAME: neo-society-dnnr-proxy
  SOCIETY_HOST: society.holytemples.org
  LIFESTYLE_HOST: lifestyle.holytemples.org
  DNNR_UPSTREAM_ORIGIN: https://neo.dnnr.io
  NEG_NAME: neo-society-dnnr-neg
  BACKEND_SERVICE: neo-society-dnnr-backend
  URL_MAP: neo-society-dnnr-map
  SSL_CERT: neo-society-dnnr-cert
  HTTPS_PROXY: neo-society-dnnr-https
  GLOBAL_IP: neo-society-dnnr-ip
  HTTPS_RULE: neo-society-dnnr-https-rule

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 35
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate source and deployment configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          node --check server/neo-society-dnnr-proxy/server.mjs
          test -f server/neo-society-dnnr-proxy/Dockerfile

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Install gcloud beta component
        run: gcloud components install beta --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-society-dnnr-proxy:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f server/neo-society-dnnr-proxy/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-society-dnnr-proxy:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
            --set-env-vars="DNNR_UPSTREAM_ORIGIN=$DNNR_UPSTREAM_ORIGIN,SOCIETY_HOST=$SOCIETY_HOST,LIFESTYLE_HOST=$LIFESTYLE_HOST,LIFESTYLE_ENTRY_PATH=/neo/ambassador-application" \
            --port=8080 \
            --allow-unauthenticated \
            --quiet

      - name: Verify Cloud Run origin
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$URL"
          for host in "$SOCIETY_HOST" "$LIFESTYLE_HOST"; do
            code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/health.json -w '%{http_code}' -H "X-Forwarded-Host: $host" "$URL/health")"
            test "$code" = 200
          done
          echo "NEO_SOCIETY_PROXY_URL=$URL" >> "$GITHUB_ENV"
          echo "NEO Society DNNR proxy origin healthy: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Try native Cloud Run domain mapping
        run: |
          set -uo pipefail
          pending=0
          for domain in "$SOCIETY_HOST" "$LIFESTYLE_HOST"; do
            if gcloud beta run domain-mappings describe --domain="$domain" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null 2>&1; then
              echo "Domain mapping exists: $domain"
              continue
            fi
            if gcloud beta run domain-mappings create --service="$SERVICE_NAME" --domain="$domain" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --quiet; then
              echo "Domain mapping created: $domain"
            else
              pending=$((pending + 1))
              echo "::warning::Native domain mapping pending for $domain; HTTPS load balancer fallback will be provisioned."
            fi
          done
          echo "Native domain mappings pending: $pending" >> "$GITHUB_STEP_SUMMARY"

      - name: Provision HTTPS load balancer fallback
        run: |
          set -euo pipefail

          if ! gcloud compute network-endpoint-groups describe "$NEG_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null 2>&1; then
            gcloud compute network-endpoint-groups create "$NEG_NAME" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --network-endpoint-type=serverless \
              --cloud-run-service="$SERVICE_NAME" \
              --quiet
          fi

          if ! gcloud compute backend-services describe "$BACKEND_SERVICE" --project="$GCP_PROJECT_ID" --global >/dev/null 2>&1; then
            gcloud compute backend-services create "$BACKEND_SERVICE" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --load-balancing-scheme=EXTERNAL_MANAGED \
              --protocol=HTTP \
              --quiet
          fi

          NEG_URL="$(gcloud compute network-endpoint-groups describe "$NEG_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(selfLink)')"
          CURRENT_BACKENDS="$(gcloud compute backend-services describe "$BACKEND_SERVICE" --project="$GCP_PROJECT_ID" --global --format='value(backends.group)' || true)"
          if [[ "$CURRENT_BACKENDS" != *"$NEG_URL"* ]]; then
            gcloud compute backend-services add-backend "$BACKEND_SERVICE" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --network-endpoint-group="$NEG_NAME" \
              --network-endpoint-group-region="$GCP_REGION" \
              --quiet
          fi

          if ! gcloud compute url-maps describe "$URL_MAP" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute url-maps create "$URL_MAP" \
              --project="$GCP_PROJECT_ID" \
              --default-service="$BACKEND_SERVICE" \
              --quiet
          fi

          if ! gcloud compute ssl-certificates describe "$SSL_CERT" --project="$GCP_PROJECT_ID" --global >/dev/null 2>&1; then
            gcloud compute ssl-certificates create "$SSL_CERT" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --domains="$SOCIETY_HOST,$LIFESTYLE_HOST" \
              --quiet
          fi

          if ! gcloud compute target-https-proxies describe "$HTTPS_PROXY" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute target-https-proxies create "$HTTPS_PROXY" \
              --project="$GCP_PROJECT_ID" \
              --url-map="$URL_MAP" \
              --ssl-certificates="$SSL_CERT" \
              --quiet
          fi

          if ! gcloud compute addresses describe "$GLOBAL_IP" --project="$GCP_PROJECT_ID" --global >/dev/null 2>&1; then
            gcloud compute addresses create "$GLOBAL_IP" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --ip-version=IPV4 \
              --network-tier=PREMIUM \
              --quiet
          fi

          LB_IP="$(gcloud compute addresses describe "$GLOBAL_IP" --project="$GCP_PROJECT_ID" --global --format='value(address)')"
          test -n "$LB_IP"

          if ! gcloud compute forwarding-rules describe "$HTTPS_RULE" --project="$GCP_PROJECT_ID" --global >/dev/null 2>&1; then
            gcloud compute forwarding-rules create "$HTTPS_RULE" \
              --project="$GCP_PROJECT_ID" \
              --global \
              --load-balancing-scheme=EXTERNAL_MANAGED \
              --network-tier=PREMIUM \
              --address="$LB_IP" \
              --target-https-proxy="$HTTPS_PROXY" \
              --ports=443 \
              --quiet
          fi

          echo "NEO_SOCIETY_LB_IP=$LB_IP" >> "$GITHUB_ENV"
          echo "### HTTPS load balancer fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "Static IPv4: $LB_IP" >> "$GITHUB_STEP_SUMMARY"
          echo "DNS A records required:" >> "$GITHUB_STEP_SUMMARY"
          echo "- $SOCIETY_HOST -> $LB_IP" >> "$GITHUB_STEP_SUMMARY"
          echo "- $LIFESTYLE_HOST -> $LB_IP" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe DNNR upstream through branded routing
        run: |
          set -uo pipefail
          society_code="$(curl --max-time 25 -sS -o /tmp/society.html -w '%{http_code}' -H "X-Forwarded-Host: $SOCIETY_HOST" "$NEO_SOCIETY_PROXY_URL/" || true)"
          lifestyle_code="$(curl --max-time 25 -sS -o /tmp/lifestyle.html -w '%{http_code}' -H "X-Forwarded-Host: $LIFESTYLE_HOST" "$NEO_SOCIETY_PROXY_URL/" || true)"
          echo "Society upstream probe: $society_code" >> "$GITHUB_STEP_SUMMARY"
          echo "Lifestyle upstream probe: $lifestyle_code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$society_code" != 200 ] || [ "$lifestyle_code" != 200 ]; then
            echo "::warning::DNNR upstream is not returning a clean 200 yet. Deployment remains healthy; investigate DNNR canonical-host/redirect behavior before launch traffic."
          fi
