name: God's Eye validation
on:
  pull_request:
    paths:
      - 'apps/gods-eye/**'
      - 'public/gods-eye/**'
      - 'src/App.tsx'
      - 'data/neo-gas/record-schema.json'
      - '.github/workflows/gods-eye-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test apps/gods-eye/*.test.mjs
      - run: npm run build
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/gods-eye-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/gods-eye-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify built sandbox in mobile and desktop browsers
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/gods-eye-browser/node_modules/playwright/index.mjs" node apps/gods-eye/browser-smoke.mjs
