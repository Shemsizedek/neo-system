name: NEO Energy NES-029 full-stack staging E2E
on:
  pull_request:
    paths:
      - 'neo-energy/NES-023/**'
      - 'neo-energy/NES-027/**'
      - 'neo-energy/NES-029/**'
      - '.github/workflows/neo-energy-nes029-tests.yml'
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: neo_energy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neo_energy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-password
      PGDATABASE: neo_energy_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL dependency
        working-directory: neo-energy/NES-027
        run: npm install --no-save --ignore-scripts --no-audit --no-fund pg@8
      - run: psql -X -v ON_ERROR_STOP=1 -f neo-energy/NES-027/schema.sql
      - run: node --test neo-energy/NES-029/test-e2e.mjs
