name: Noogle Connect MCP
on:
  pull_request:
    paths:
      - 'integrations/noogle-connect/**'
      - 'deploy/noogle-render/**'
      - '.github/workflows/noogle-connect-mcp.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix integrations/noogle-connect/runtime --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix integrations/noogle-connect/runtime
