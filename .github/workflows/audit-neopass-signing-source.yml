name: Audit NEO Pass Signing Source Discovery
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: holytemples-production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Discover signing configuration metadata only
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services list --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/services.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const services=JSON.parse(fs.readFileSync('/tmp/services.json','utf8'));
          for(const s of services){
            const name=s.metadata?.name||'unknown';
            const env=(s.spec?.template?.spec?.containers||[]).flatMap(c=>c.env||[]);
            const matches=env.filter(e=>/^(NEO_PASS_JWT_SECRET|NEOPASS_JWT_SECRET|JWT_SECRET)$/.test(e.name||''));
            if(matches.length)for(const e of matches) console.log('Service:',name,'variable:',e.name,'secretManagerReference:',Boolean(e.valueFrom?.secretKeyRef),'literalValuePresent:',Boolean(e.value));
          }
          console.log('Services inspected:',services.length);
          console.log('No secret values, tokens, or payloads requested or logged');
          JS
          gcloud secrets list --project="$GCP_PROJECT_ID" --format='value(name)' | grep -Ei 'neopass|neo-pass|jwt' | sed 's#^.*/##' || true
          echo "Secret names are leads only; do not bind until signing authority and rotation policy are verified."
