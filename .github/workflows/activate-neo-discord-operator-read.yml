name: Activate NEO Discord Operator Reads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate operator runtime contract
        env:
          NEO_MINER_OPERATOR_URL: ${{ secrets.NEO_MINER_OPERATOR_URL }}
          NEO_MINER_OPERATOR_TOKEN: ${{ secrets.NEO_MINER_OPERATOR_TOKEN }}
          NEO_RELATIONS_OPERATOR_URL: ${{ secrets.NEO_RELATIONS_OPERATOR_URL }}
          NEO_RELATIONS_OPERATOR_TOKEN: ${{ secrets.NEO_RELATIONS_OPERATOR_TOKEN }}
          DISCORD_OPERATOR_USER_IDS: ${{ secrets.DISCORD_OPERATOR_USER_IDS }}
          DISCORD_OPERATOR_ROLE_IDS: ${{ secrets.DISCORD_OPERATOR_ROLE_IDS }}
        run: node services/neo-discord/deployment/operator-read-preflight.mjs

      - name: Install Discord transport dependencies
        working-directory: services/neo-discord/adapters/cloudflare
        run: npm install

      - name: Sync protected operator runtime values
        working-directory: services/neo-discord/adapters/cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEO_MINER_OPERATOR_URL: ${{ secrets.NEO_MINER_OPERATOR_URL }}
          NEO_MINER_OPERATOR_TOKEN: ${{ secrets.NEO_MINER_OPERATOR_TOKEN }}
          NEO_RELATIONS_OPERATOR_URL: ${{ secrets.NEO_RELATIONS_OPERATOR_URL }}
          NEO_RELATIONS_OPERATOR_TOKEN: ${{ secrets.NEO_RELATIONS_OPERATOR_TOKEN }}
          DISCORD_OPERATOR_USER_IDS: ${{ secrets.DISCORD_OPERATOR_USER_IDS }}
          DISCORD_OPERATOR_ROLE_IDS: ${{ secrets.DISCORD_OPERATOR_ROLE_IDS }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="${!name:-}"
            [ -n "$value" ] || return 0
            printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.jsonc >/dev/null
            echo "Synced runtime binding: $name"
          }
          for name in \
            NEO_MINER_OPERATOR_URL \
            NEO_MINER_OPERATOR_TOKEN \
            NEO_RELATIONS_OPERATOR_URL \
            NEO_RELATIONS_OPERATOR_TOKEN \
            DISCORD_OPERATOR_USER_IDS \
            DISCORD_OPERATOR_ROLE_IDS
          do
            put_secret "$name"
          done

      - name: Deploy Discord HTTPS transport with protected bindings
        working-directory: services/neo-discord/adapters/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify Discord transport health
        shell: bash
        run: |
          set -euo pipefail
          url="https://neo-discord-api.neosystem.workers.dev/health"
          body="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$url")"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true || x.service!=="neo-discord" || x.grounded_status!==true) process.exit(1)' "$body"
          echo "NEO Discord operator-read runtime activation completed."
