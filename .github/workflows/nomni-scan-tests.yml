name: NOMNI Scan isolated unit checks
on:
  push:
    branches:
      - nomni-seo-016-verified-counterparty
  pull_request:
    paths:
      - 'apps/neoscan/nomni-*.mjs'
      - '.github/workflows/nomni-scan-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: NOMNI isolated fixture tests
        run: node --test apps/neoscan/nomni-constituent-adapter.test.mjs apps/neoscan/nomni-scan-crawler.test.mjs apps/neoscan/nomni-secure-fetcher.test.mjs apps/neoscan/nomni-counterparty-observation.test.mjs apps/neoscan/nomni-scan-integration.test.mjs apps/neoscan/nomni-crown-evidence.test.mjs apps/neoscan/nomni-crown-registry.test.mjs apps/neoscan/nomni-evidence-journal.test.mjs apps/neoscan/nomni-market-status.test.mjs
