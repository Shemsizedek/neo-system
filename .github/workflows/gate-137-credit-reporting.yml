name: Gate 137 Credit Reporting Gateway
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['architecture/neo-credit-reporting-gateway-policy.json','server/neo-credit-reporting/**','docs/NEO-G137-CREDIT-REPORTING-GATEWAY.md','package.json','.github/workflows/gate-137-credit-reporting.yml']
  pull_request:
    paths: ['architecture/neo-credit-reporting-gateway-policy.json','server/neo-credit-reporting/**','docs/NEO-G137-CREDIT-REPORTING-GATEWAY.md','package.json','.github/workflows/gate-137-credit-reporting.yml']
permissions: {contents: read}
jobs:
  credit-reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run neo-credit-reporting:test
      - run: node --check server/neo-credit-reporting/server.mjs
