name: Build NEO Guardian APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/neo-guardian/**'
      - 'public/guardian/**'
      - '.github/workflows/neo-guardian-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GUARDIAN_KEYSTORE_BASE64: ${{ secrets.GUARDIAN_KEYSTORE_BASE64 }}
      GUARDIAN_STORE_PASSWORD: ${{ secrets.GUARDIAN_STORE_PASSWORD }}
      GUARDIAN_KEY_ALIAS: ${{ secrets.GUARDIAN_KEY_ALIAS }}
      GUARDIAN_KEY_PASSWORD: ${{ secrets.GUARDIAN_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable production-candidate APK
        run: gradle -p apps/neo-guardian --no-daemon assembleDebug

      - name: Prepare stable release signing
        if: env.GUARDIAN_KEYSTORE_BASE64 != ''
        run: |
          echo "$GUARDIAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neo-guardian-release.jks"
          echo "GUARDIAN_KEYSTORE_PATH=$RUNNER_TEMP/neo-guardian-release.jks" >> "$GITHUB_ENV"

      - name: Build stable signed release APK
        if: env.GUARDIAN_KEYSTORE_BASE64 != ''
        run: gradle -p apps/neo-guardian --no-daemon assembleRelease

      - name: Stage APKs and checksums
        run: |
          mkdir -p dist
          cp apps/neo-guardian/app/build/outputs/apk/debug/app-debug.apk dist/NEO-Guardian-v3.0.0-production-candidate.apk
          sha256sum dist/NEO-Guardian-v3.0.0-production-candidate.apk > dist/NEO-Guardian-v3.0.0-production-candidate.sha256
          if [ -f apps/neo-guardian/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/neo-guardian/app/build/outputs/apk/release/app-release.apk dist/NEO-Guardian-v3.0.0-release.apk
            sha256sum dist/NEO-Guardian-v3.0.0-release.apk > dist/NEO-Guardian-v3.0.0-release.sha256
          fi

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEO-Guardian-v3.0.0
          path: dist/*
          retention-days: 30
