name: Build NEO Guardian APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/neo-guardian/**'
      - 'public/guardian/**'
      - '.github/workflows/neo-guardian-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/neo-guardian/**'
      - 'public/guardian/**'
      - '.github/workflows/neo-guardian-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GUARDIAN_KEYSTORE_BASE64: ${{ secrets.GUARDIAN_KEYSTORE_BASE64 }}
      GUARDIAN_STORE_PASSWORD: ${{ secrets.GUARDIAN_STORE_PASSWORD }}
      GUARDIAN_KEY_ALIAS: ${{ secrets.GUARDIAN_KEY_ALIAS }}
      GUARDIAN_KEY_PASSWORD: ${{ secrets.GUARDIAN_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable production-candidate APK
        run: gradle -p apps/neo-guardian --no-daemon assembleDebug

      - name: Prepare optional stable release signing
        if: github.event_name != 'pull_request' && env.GUARDIAN_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set +e
          printf '%s' "$GUARDIAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neo-guardian-release.jks"
          decode_status=$?
          if [ "$decode_status" -eq 0 ] && [ -s "$RUNNER_TEMP/neo-guardian-release.jks" ]; then
            echo "GUARDIAN_KEYSTORE_PATH=$RUNNER_TEMP/neo-guardian-release.jks" >> "$GITHUB_ENV"
            echo "GUARDIAN_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            rm -f "$RUNNER_TEMP/neo-guardian-release.jks"
            echo "GUARDIAN_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Stable signing material could not be prepared. The production-candidate APK will still be published."
          fi
          exit 0

      - name: Build optional stable signed release APK
        id: stable_release
        if: github.event_name != 'pull_request' && env.GUARDIAN_SIGNING_READY == 'true'
        continue-on-error: true
        run: gradle -p apps/neo-guardian --no-daemon assembleRelease

      - name: Report stable signing result
        if: github.event_name != 'pull_request' && env.GUARDIAN_SIGNING_READY == 'true' && steps.stable_release.outcome == 'failure'
        run: echo "::warning::Stable signed release build failed. Production-candidate publication remains valid and independent."

      - name: Stage APKs and checksums
        if: always() && !cancelled()
        run: |
          mkdir -p dist
          test -f apps/neo-guardian/app/build/outputs/apk/debug/app-debug.apk
          cp apps/neo-guardian/app/build/outputs/apk/debug/app-debug.apk dist/NEO-Guardian-v3.4.0-production-candidate.apk
          sha256sum dist/NEO-Guardian-v3.4.0-production-candidate.apk > dist/NEO-Guardian-v3.4.0-production-candidate.sha256
          if [ -f apps/neo-guardian/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/neo-guardian/app/build/outputs/apk/release/app-release.apk dist/NEO-Guardian-v3.4.0-release.apk
            sha256sum dist/NEO-Guardian-v3.4.0-release.apk > dist/NEO-Guardian-v3.4.0-release.sha256
          fi

      - name: Upload production artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: NEO-Guardian-v3.4.0
          path: dist/*
          retention-days: 30
