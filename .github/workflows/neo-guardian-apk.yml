name: Build NEO Guardian APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/neo-guardian/**'
      - '.github/workflows/neo-guardian-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        run: gradle -p apps/neo-guardian --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp apps/neo-guardian/app/build/outputs/apk/debug/app-debug.apk dist/NEO-Guardian-v2.0.0.apk
          sha256sum dist/NEO-Guardian-v2.0.0.apk > dist/NEO-Guardian-v2.0.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEO-Guardian-v2.0.0
          path: dist/*
          retention-days: 30
