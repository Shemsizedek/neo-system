name: World Café public website quality gate
on:
  pull_request:
    paths:
      - 'apps/fwkf-worldcafe/public/**'
      - 'scripts/verify-worldcafe-public-site.mjs'
      - '.github/workflows/fwkf-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public pages, privacy, navigation and knowledge index
        run: node scripts/verify-worldcafe-public-site.mjs apps/fwkf-worldcafe/public
