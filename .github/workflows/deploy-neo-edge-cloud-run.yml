name: Deploy NEO Edge to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-edge/**'
      - 'apps/neo-realty/web/**'
      - 'public/neo-generator/**'
      - 'docs/neo-corpus/**'
      - 'docs/neo-hub/**'
      - 'server/holytemples-adapter/**'
      - 'server/neo-counter-backend/firestore-rest-db.mjs'
      - 'deploy/neo-edge/**'
      - 'cloudbuild.neo-edge.yaml'
      - 'architecture/neo-hosts.json'
      - '.github/workflows/deploy-neo-edge-cloud-run.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-edge-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
      SERVICE_NAME: neo-edge
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          test -f deploy/neo-edge/Dockerfile
          test -f server/neo-edge/server.mjs
          test -f server/neo-edge/production.mjs
          test -f server/neo-edge/wire-app.mjs
          test -f server/neo-counter-backend/firestore-rest-db.mjs
          node --check server/neo-edge/server.mjs
          node --check server/neo-edge/production.mjs
          node --check server/neo-edge/system-home.mjs
          node --test server/neo-edge/system-home.test.mjs
          node --check server/neo-edge/wire-app.mjs

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Install gcloud beta component
        run: gcloud components install beta --quiet

      - name: Resolve NEO AI Gateway origin
        run: |
          set -euo pipefail
          AI_GATEWAY_URL="$(gcloud run services describe neo-ai-gateway --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$AI_GATEWAY_URL"
          echo "AI_GATEWAY_URL=$AI_GATEWAY_URL" >> "$GITHUB_ENV"

      - name: Resolve NEO Realty origin
        run: |
          set -euo pipefail
          REALTY_URL="$(gcloud run services describe neo-realty --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$REALTY_URL"
          echo "NEO_REALTY_ORIGIN=$REALTY_URL" >> "$GITHUB_ENV"

      - name: Resolve NEO Generator origin
        run: |
          set -euo pipefail
          GENERATOR_URL="$(gcloud run services describe neo-generator --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$GENERATOR_URL"
          echo "NEO_GENERATOR_ORIGIN=$GENERATOR_URL" >> "$GITHUB_ENV"

      - name: Build and push NEO edge image
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-edge:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f deploy/neo-edge/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy NEO edge to Cloud Run
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-edge:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
            --set-env-vars="GCP_PROJECT_ID=$GCP_PROJECT_ID,FIRESTORE_DATABASE_ID=(default),NEO_PLATFORM_API_ORIGIN=https://egov.holytemples.org,AI_GATEWAY_URL=$AI_GATEWAY_URL,NEO_REALTY_ORIGIN=$NEO_REALTY_ORIGIN,NEO_GENERATOR_ORIGIN=$NEO_GENERATOR_ORIGIN" \
            --port=8080 \
            --allow-unauthenticated \
            --quiet

      - name: Verify NEO edge Cloud Run origin
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-edge-health.json -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/health")"
          test "$code" = 200
          home_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-system-home.html -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/")"
          test "$home_code" = 200
          grep -q 'Welcome to NEO.' /tmp/neo-system-home.html
          grep -q 'library-form' /tmp/neo-system-home.html
          grep -q 'data-category="Finance"' /tmp/neo-system-home.html
          console_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-system-console.html -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/ui/console")"
          test "$console_code" = 200
          grep -q 'Checking production' /tmp/neo-system-console.html
          wire_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-wire.html -w '%{http_code}' -H 'X-Forwarded-Host: wire.holytemples.org' "$SERVICE_URL/")"
          test "$wire_code" = 200
          grep -q 'NEO Wire' /tmp/neo-wire.html
          office_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-office.html -w '%{http_code}' -H 'X-Forwarded-Host: office.holytemples.org' "$SERVICE_URL/")"
          test "$office_code" = 200
          if grep -q 'NEO Service' /tmp/neo-office.html; then
            echo "::error::office.holytemples.org fell back to generic NEO Service shell"
            exit 1
          fi
          status_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-wire-status.json -w '%{http_code}' -H 'X-Forwarded-Host: wire.holytemples.org' "$SERVICE_URL/api/wire/status")"
          test "$status_code" = 200
          grep -q 'live-production' /tmp/neo-wire-status.json
          ai_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-ai-boundary.json -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/api/ai/providers")"
          test "$ai_code" = 401
          grep -q 'neopass_identity_required' /tmp/neo-ai-boundary.json
          workspace_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-sync-workspace.html -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/neosync/")"
          test "$workspace_code" = 200
          grep -q 'NEOsync Conversation Workspace' /tmp/neo-sync-workspace.html
          asset_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/neo-ai.js -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/assets/neo-ai.js")"
          test "$asset_code" = 200
          grep -q "const VERSION = '1.9.0'" /tmp/neo-ai.js
          grep -q "Knowledge Browser" /tmp/neo-ai.js
          grep -q "Muse → NEO Handoff" /tmp/neo-ai.js
          grep -q "/api/ai/handoffs" /tmp/neo-ai.js
          grep -q "Copy for Muse" /tmp/neo-ai.js
          grep -q "muse-brief" /tmp/neo-ai.js
          grep -q "Muse / NEO Project Transfer" /tmp/neo-ai.js
          grep -q "/api/ai/projects" /tmp/neo-ai.js
          catalog_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/knowledge-catalog.json -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/api/library")"
          test "$catalog_code" = 200
          SEARCH_QUERY="$(node --input-type=module -e 'import fs from "node:fs";const b=JSON.parse(fs.readFileSync("/tmp/knowledge-catalog.json","utf8"));const title=b.records?.[0]?.title;if(!title)throw new Error("public_library_empty");process.stdout.write(encodeURIComponent(title))')"
          knowledge_search_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/knowledge-search.json -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/api/noogle/search?q=$SEARCH_QUERY")"
          test "$knowledge_search_code" = 200
          RECORD_ID="$(node --input-type=module -e 'import fs from "node:fs";const catalog=JSON.parse(fs.readFileSync("/tmp/knowledge-catalog.json","utf8"));const search=JSON.parse(fs.readFileSync("/tmp/knowledge-search.json","utf8"));const id=catalog.records?.[0]?.id;if(!id||!search.records?.some(r=>r.id===id))throw new Error("knowledge_search_catalog_mismatch");process.stdout.write(id)')"
          preview_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /tmp/knowledge-preview.json -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$SERVICE_URL/api/library/$RECORD_ID")"
          test "$preview_code" = 200
          node --input-type=module -e 'import fs from "node:fs";const catalog=JSON.parse(fs.readFileSync("/tmp/knowledge-catalog.json","utf8"));const preview=JSON.parse(fs.readFileSync("/tmp/knowledge-preview.json","utf8"));if(preview.record?.id!==catalog.records?.[0]?.id)throw new Error("knowledge_preview_mismatch");if(preview.oracleClass!=="internal-record-context")throw new Error("oracle_class_missing");'
          echo "NEO_EDGE_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "NEO edge + NEO Wire production origin healthy: $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Bind NEO domains to shared edge
        run: |
          set -uo pipefail
          domains=(
            neo.holytemples.org
            router.holytemples.org
            algo.holytemples.org
            prime.holytemples.org
            pay.holytemples.org
            neobank.holytemples.org
            hub.holytemples.org
            counter.holytemples.org
            wire.holytemples.org
            neogram.holytemples.org
            neofx.holytemples.org
            scan.holytemples.org
            school.holytemples.org
            library.holytemples.org
            book.holytemples.org
            neopads.holytemples.org
            neopass.holytemples.org
            neovision.holytemples.org
            noogle.holytemples.org
            omnitrix.holytemples.org
            neodash.holytemples.org
            nomni.holytemples.org
            wallet.holytemples.org
            treasury.holytemples.org
            nvsn.holytemples.org
            neoteric.holytemples.org
            tabernacle.holytemples.org
            office.holytemples.org
          )
          pending=0
          for domain in "${domains[@]}"; do
            if gcloud beta run domain-mappings describe --domain="$domain" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null 2>&1; then
              echo "Domain mapping exists: $domain"
              continue
            fi
            if gcloud beta run domain-mappings create --service="$SERVICE_NAME" --domain="$domain" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --quiet; then
              echo "Domain mapping created: $domain"
            else
              pending=$((pending + 1))
              echo "::warning::Domain mapping pending for $domain. Cloud Run origin remains healthy; complete Google domain ownership or external load-balancer/DNS cutover to activate this host."
            fi
          done
          echo "NEO edge domain mappings pending: $pending" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public NEO System workspace
        if: ${{ !cancelled() && env.NEO_EDGE_SERVICE_URL != '' }}
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -fsS \
            'https://neo.holytemples.org/' -o /tmp/neo-system-public-home.html
          grep -q 'Welcome to NEO.' /tmp/neo-system-public-home.html
          grep -q 'library-form' /tmp/neo-system-public-home.html
          curl --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -fsS \
            'https://neo.holytemples.org/health' -o /tmp/neo-system-public-health.json
          node --input-type=module -e 'import fs from "node:fs";const health=JSON.parse(fs.readFileSync("/tmp/neo-system-public-health.json","utf8"));if(health.ok!==true)throw new Error("public_gateway_not_healthy");'
          echo "NEO System workspace verified: https://neo.holytemples.org/" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify NEO edge service and mapped public hosts
        run: |
          set -euo pipefail
          test -n "${NEO_EDGE_SERVICE_URL:-}"
          direct_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Host: neo.holytemples.org' "$NEO_EDGE_SERVICE_URL/health")"
          echo "NEO origin health -> $direct_code"
          test "$direct_code" = 200

          leaders_routes=( "/" "/about/" "/world-parliament/" "/leadership/" "/contact/" )
          for route in "${leaders_routes[@]}"; do
            route_file="/tmp/leaders$(echo "$route" | tr '/-' '__').html"
            route_code="$(curl --retry 5 --retry-delay 3 --retry-all-errors -sS -o "$route_file" -w '%{http_code}' -H 'X-Forwarded-Host: leaders.holytemples.org' "$NEO_EDGE_SERVICE_URL$route")"
            echo "leaders.holytemples.org$route -> $route_code"
            test "$route_code" = 200
            grep -Eiq 'World Leaders Forum|World Parliament|Leadership|Contact the Forum|Official Forum for World Leaders' "$route_file" || { echo "::error::Expected forum content missing on $route"; exit 1; }
            if grep -q 'NEO Service' "$route_file"; then
              echo "::error::leaders route $route fell back to generic NEO Service shell"
              exit 1
            fi
          done
          echo "leaders-routes: / /about/ /world-parliament/ /leadership/ /contact/ verified" >> "$GITHUB_STEP_SUMMARY"

          mapped_failures=0
          urls=(
            'https://neo.holytemples.org/health'
            'https://neo.holytemples.org/assets/neo-bridge.js'
            'https://neo.holytemples.org/assets/neo-suite.js'
            'https://neo.holytemples.org/assets/neo-ai.js'
            'https://neo.holytemples.org/neosync/'
            'https://wire.holytemples.org/'
            'https://wire.holytemples.org/api/wire/status'
            'https://router.holytemples.org/health'
            'https://algo.holytemples.org/health'
            'https://pay.holytemples.org/health'
            'https://neobank.holytemples.org/health'
            'https://neobank.holytemples.org/api/v1/community/status'
            'https://noogle.holytemples.org/noogle/search?q=noology'
            'https://nomni.holytemples.org/nomni.json'
            'https://nomni.holytemples.org/api/nomni/value'
            'https://wallet.holytemples.org/api/wallet'
            'https://treasury.holytemples.org/api/treasury'
            'https://nvsn.holytemples.org/health'
            'https://nvsn.holytemples.org/'
            'https://neoteric.holytemples.org/health'
            'https://neoteric.holytemples.org/'
            'https://tabernacle.holytemples.org/health'
            'https://tabernacle.holytemples.org/'
            'https://office.holytemples.org/'
          )
          for url in "${urls[@]}"; do
            host="$(node -e 'console.log(new URL(process.argv[1]).hostname)' "$url")"
            if gcloud beta run domain-mappings describe --domain="$host" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null 2>&1; then
              code="$(curl --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -sS -D /tmp/neo-public-headers -o /tmp/neo-public-response -w '%{http_code}' "$url" || true)"
              echo "$url -> $code"
              echo "$url -> $code" >> "$GITHUB_STEP_SUMMARY"
              if [[ "$url" == 'https://tabernacle.holytemples.org/' ]]; then
                if [[ "$code" != 302 ]] || ! grep -Eiq '^location: https://neotericmethod\.minicart\.com[[:space:]]*$' /tmp/neo-public-headers; then
                  echo "::error::Tabernacle storefront redirect is missing or incorrect"
                  mapped_failures=$((mapped_failures + 1))
                fi
              elif [[ "$code" != 200 ]]; then
                echo "::error::$url returned $code, expected 200"
                mapped_failures=$((mapped_failures + 1))
              elif [[ "$url" == 'https://neobank.holytemples.org/api/v1/community/status' ]]; then
                if ! node --input-type=module -e 'import fs from "node:fs";const status=JSON.parse(fs.readFileSync("/tmp/neo-public-response","utf8"));if(status.database!=="connected")throw new Error("neo_bank_database_unavailable");'; then
                  mapped_failures=$((mapped_failures + 1))
                fi
              fi
            else
              echo "$url -> mapping pending (origin healthy)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          test "$mapped_failures" -eq 0
