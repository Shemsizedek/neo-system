name: Deploy NEO Edge to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-edge/**'
      - 'server/holytemples-adapter/**'
      - 'deploy/neo-edge/**'
      - 'cloudbuild.neo-edge.yaml'
      - 'architecture/neo-hosts.json'
      - '.github/workflows/deploy-neo-edge-cloud-run.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-edge-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
      SERVICE_NAME: neo-edge
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          test -f deploy/neo-edge/Dockerfile
          test -f server/neo-edge/server.mjs

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push NEO edge image
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-edge:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f deploy/neo-edge/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy NEO edge to Cloud Run
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-edge:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
            --port=8080 \
            --allow-unauthenticated \
            --quiet

      - name: Bind NEO domains to shared edge
        run: |
          set -euo pipefail
          domains=(
            neo.holytemples.org
            router.holytemples.org
            algo.holytemples.org
            prime.holytemples.org
            pay.holytemples.org
            neobank.holytemples.org
            hub.holytemples.org
            counter.holytemples.org
            wire.holytemples.org
            neogram.holytemples.org
            neofx.holytemples.org
            scan.holytemples.org
            school.holytemples.org
            library.holytemples.org
            book.holytemples.org
            neopads.holytemples.org
            neopass.holytemples.org
            neovision.holytemples.org
            noogle.holytemples.org
            omnitrix.holytemples.org
            neodash.holytemples.org
            nomni.holytemples.org
            wallet.holytemples.org
            treasury.holytemples.org
          )
          for domain in "${domains[@]}"; do
            if gcloud beta run domain-mappings describe --domain="$domain" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              echo "Domain mapping exists: $domain"
            else
              gcloud beta run domain-mappings create --service="$SERVICE_NAME" --domain="$domain" --project="$GCP_PROJECT_ID" --quiet
            fi
          done

      - name: Verify NEO edge service and public hosts
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          echo "NEO edge Cloud Run URL: $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: neo.holytemples.org' "$SERVICE_URL/health")" = 200
          for url in \
            'https://neo.holytemples.org/health' \
            'https://router.holytemples.org/health' \
            'https://algo.holytemples.org/health' \
            'https://pay.holytemples.org/health' \
            'https://neobank.holytemples.org/health' \
            'https://noogle.holytemples.org/noogle/search?q=noology' \
            'https://nomni.holytemples.org/nomni.json' \
            'https://wallet.holytemples.org/api/wallet' \
            'https://treasury.holytemples.org/api/treasury'; do
            code="$(curl --retry 8 --retry-delay 10 --retry-all-errors -sS -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "$url -> $code" >> "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
          done
