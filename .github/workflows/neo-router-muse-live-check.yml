name: NEO Router Muse Live Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  muse-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_MUSE_MODEL: muse-spark-1.3
      META_MODEL_BASE_URL: https://api.meta.ai/v1
      NEO_ROUTER_PROVIDER_TIMEOUT_MS: '30000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Meta Model API secret is configured
        shell: bash
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "MODEL_API_KEY GitHub Actions secret is not configured."
            exit 2
          fi

      - name: Run credential-safe Muse readiness probe
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: npm run router:muse:check
