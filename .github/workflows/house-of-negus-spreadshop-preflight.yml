name: House of Negus Spreadshop Live Preflight
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "scripts/spreadshop-preflight.mjs"
      - "scripts/spreadshop-sync-v2.mjs"
      - "scripts/spreadshop-reconcile.mjs"
      - ".github/workflows/house-of-negus-spreadshop-preflight.yml"
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      SPREADSHOP_SHOP_ID: ${{ vars.SPREADSHOP_SHOP_ID }}
      SPREADSHOP_API_KEY: ${{ secrets.SPREADSHOP_API_KEY }}
      SPREADSHOP_PLATFORM: ${{ vars.SPREADSHOP_PLATFORM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check configuration
        id: preflight
        continue-on-error: true
        run: node scripts/spreadshop-preflight.mjs
      - name: Sync live inventory
        if: steps.preflight.outcome == 'success'
        run: node scripts/spreadshop-sync-v2.mjs
      - name: Reconcile baseline products
        if: steps.preflight.outcome == 'success'
        run: node scripts/spreadshop-reconcile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: house-of-negus-spreadshop-preflight
          path: merch/house-of-negus/state/
          if-no-files-found: ignore
      - name: Mark configuration blocked
        if: steps.preflight.outcome != 'success'
        run: |
          echo "Spreadshop connection is not configured yet." >&2
          exit 1
