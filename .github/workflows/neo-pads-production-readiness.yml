name: NEO Pads Production Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/neo-pads
    env:
      DATABASE_URL: ${{ secrets.NEO_PADS_DATABASE_URL }}
      NEO_PADS_WEB_ORIGIN: ${{ vars.NEO_PADS_WEB_ORIGIN }}
      NEOPASS_API_URL: ${{ secrets.NEOPASS_API_URL }}
      NEO_COUNTER_API_URL: ${{ secrets.NEO_COUNTER_API_URL }}
      NEO_COUNTER_WEBHOOK_SECRET: ${{ secrets.NEO_COUNTER_WEBHOOK_SECRET }}
      WALLET_SIGNATURE_VERIFY_URL: ${{ secrets.WALLET_SIGNATURE_VERIFY_URL }}
      NEO_PADS_OPS_TOKEN: ${{ secrets.NEO_PADS_OPS_TOKEN }}
      NEO_COUNTER_PAYOUT_STATUS_URL: ${{ secrets.NEO_COUNTER_PAYOUT_STATUS_URL }}
      NEO_COUNTER_PAYOUT_API_KEY: ${{ secrets.NEO_COUNTER_PAYOUT_API_KEY }}
      NEO_PADS_REQUIRE_CHAIN_CONFIRMATION: "true"
      NEO_PADS_CHAIN_CONFIRMATION_URL: ${{ secrets.NEO_PADS_CHAIN_CONFIRMATION_URL }}
      NEO_PADS_CHAIN_CONFIRMATION_API_KEY: ${{ secrets.NEO_PADS_CHAIN_CONFIRMATION_API_KEY }}
      NEO_PADS_PAYOUT_EXECUTION_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/neo-pads/package.json
      - name: Verify required production configuration exists
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL NEO_PADS_WEB_ORIGIN NEOPASS_API_URL NEO_COUNTER_API_URL NEO_COUNTER_WEBHOOK_SECRET WALLET_SIGNATURE_VERIFY_URL NEO_PADS_OPS_TOKEN NEO_COUNTER_PAYOUT_STATUS_URL NEO_COUNTER_PAYOUT_API_KEY NEO_PADS_CHAIN_CONFIRMATION_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing required production configuration: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - run: npm install
      - run: npm run typecheck
      - name: Run read-only production readiness verification
        run: npm run production:readiness
