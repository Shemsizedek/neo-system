name: Deploy NEO Social Gateway to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-router/social-gateway-server.mjs'
      - 'server/neo-router/social-gateway-server.test.mjs'
      - 'server/neo-router/social-oauth.mjs'
      - 'server/neo-router/social-oauth.test.mjs'
      - 'server/neo-router/Dockerfile.social-gateway'
      - '.github/workflows/deploy-social-gateway-cloud-run.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-social-gateway-cloud-run
  cancel-in-progress: false

env:
  SERVICE_NAME: neo-social-gateway
  DOMAIN_NAME: gateway.holytemples.org
  LINKEDIN_REDIRECT_URI: https://gateway.holytemples.org/connect/linkedin/callback
  TIKTOK_REDIRECT_URI: https://gateway.holytemples.org/connect/tiktok/callback
  LINKEDIN_CLIENT_ID_SECRET_NAME: neo-social-gateway-linkedin-client-id
  LINKEDIN_CLIENT_SECRET_NAME: neo-social-gateway-linkedin-client-secret
  TIKTOK_CLIENT_KEY_SECRET_NAME: neo-social-gateway-tiktok-client-key
  TIKTOK_CLIENT_SECRET_NAME: neo-social-gateway-tiktok-client-secret
  X_BEARER_TOKEN_SECRET_NAME: neo-social-gateway-x-bearer-token
  X_OAUTH1_AUTHORIZATION_SECRET_NAME: neo-social-gateway-x-oauth1-authorization

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate core GCP deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY; do
            test -n "${!name:-}" || { echo "::error::Missing core deployment setting $name"; exit 1; }
          done

      - name: Report provider configuration
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_OAUTH1_AUTHORIZATION: ${{ secrets.X_OAUTH1_AUTHORIZATION }}
        shell: bash
        run: |
          set -euo pipefail
          pair_state() {
            local label="$1" a="$2" b="$3"
            if [[ -n "$a" && -n "$b" ]]; then
              echo "$label: configured" >> "$GITHUB_STEP_SUMMARY"
            elif [[ -z "$a" && -z "$b" ]]; then
              echo "$label: unavailable (credentials not configured); gateway deployment continues" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$label credentials are incomplete; provider disabled for this deployment"
              echo "$label: unavailable (incomplete credential pair)" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          echo "### Social provider preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "Facebook: existing authenticated organic provider" >> "$GITHUB_STEP_SUMMARY"
          pair_state "LinkedIn" "$LINKEDIN_CLIENT_ID" "$LINKEDIN_CLIENT_SECRET"
          pair_state "TikTok" "$TIKTOK_CLIENT_KEY" "$TIKTOK_CLIENT_SECRET"
          pair_state "X" "$X_BEARER_TOKEN" "$X_OAUTH1_AUTHORIZATION"
          echo "Instagram: unavailable (adapter not configured)" >> "$GITHUB_STEP_SUMMARY"
          echo "YouTube Community: browser/UI-assisted" >> "$GITHUB_STEP_SUMMARY"

      - name: Test social gateway
        run: node --test server/neo-router/social-gateway-server.test.mjs server/neo-router/social-oauth.test.mjs

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Sync configured provider secrets to Google Secret Manager
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_OAUTH1_AUTHORIZATION: ${{ secrets.X_OAUTH1_AUTHORIZATION }}
        shell: bash
        run: |
          set -euo pipefail
          sync_secret() {
            local secret="$1" value="$2"
            gcloud secrets describe "$secret" --project="$GCP_PROJECT_ID" >/dev/null 2>&1 || \
              gcloud secrets create "$secret" --project="$GCP_PROJECT_ID" --replication-policy="automatic"
            printf '%s' "$value" | gcloud secrets versions add "$secret" --project="$GCP_PROJECT_ID" --data-file=-
            gcloud secrets add-iam-policy-binding "$secret" \
              --project="$GCP_PROJECT_ID" \
              --member="serviceAccount:$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
              --role="roles/secretmanager.secretAccessor" \
              --condition=None --quiet >/dev/null
          }
          if [[ -n "$LINKEDIN_CLIENT_ID" && -n "$LINKEDIN_CLIENT_SECRET" ]]; then
            sync_secret "$LINKEDIN_CLIENT_ID_SECRET_NAME" "$LINKEDIN_CLIENT_ID"
            sync_secret "$LINKEDIN_CLIENT_SECRET_NAME" "$LINKEDIN_CLIENT_SECRET"
          fi
          if [[ -n "$TIKTOK_CLIENT_KEY" && -n "$TIKTOK_CLIENT_SECRET" ]]; then
            sync_secret "$TIKTOK_CLIENT_KEY_SECRET_NAME" "$TIKTOK_CLIENT_KEY"
            sync_secret "$TIKTOK_CLIENT_SECRET_NAME" "$TIKTOK_CLIENT_SECRET"
          fi
          if [[ -n "$X_BEARER_TOKEN" && -n "$X_OAUTH1_AUTHORIZATION" ]]; then
            sync_secret "$X_BEARER_TOKEN_SECRET_NAME" "$X_BEARER_TOKEN"
            sync_secret "$X_OAUTH1_AUTHORIZATION_SECRET_NAME" "$X_OAUTH1_AUTHORIZATION"
          fi

      - name: Build and push social gateway image
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-social-gateway:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f server/neo-router/Dockerfile.social-gateway -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-social-gateway:${{ github.sha }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_OAUTH1_AUTHORIZATION: ${{ secrets.X_OAUTH1_AUTHORIZATION }}
        shell: bash
        run: |
          set -euo pipefail
          secret_bindings=()
          if [[ -n "$LINKEDIN_CLIENT_ID" && -n "$LINKEDIN_CLIENT_SECRET" ]]; then
            secret_bindings+=("LINKEDIN_CLIENT_ID=$LINKEDIN_CLIENT_ID_SECRET_NAME:latest" "LINKEDIN_CLIENT_SECRET=$LINKEDIN_CLIENT_SECRET_NAME:latest")
          fi
          if [[ -n "$TIKTOK_CLIENT_KEY" && -n "$TIKTOK_CLIENT_SECRET" ]]; then
            secret_bindings+=("TIKTOK_CLIENT_KEY=$TIKTOK_CLIENT_KEY_SECRET_NAME:latest" "TIKTOK_CLIENT_SECRET=$TIKTOK_CLIENT_SECRET_NAME:latest")
          fi
          if [[ -n "$X_BEARER_TOKEN" && -n "$X_OAUTH1_AUTHORIZATION" ]]; then
            secret_bindings+=("X_BEARER_TOKEN=$X_BEARER_TOKEN_SECRET_NAME:latest" "X_OAUTH1_AUTHORIZATION=$X_OAUTH1_AUTHORIZATION_SECRET_NAME:latest")
          fi
          args=(
            run deploy "$SERVICE_NAME"
            --project="$GCP_PROJECT_ID"
            --region="$GCP_REGION"
            --image="$IMAGE"
            --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT"
            --set-env-vars="LINKEDIN_REDIRECT_URI=$LINKEDIN_REDIRECT_URI,TIKTOK_REDIRECT_URI=$TIKTOK_REDIRECT_URI,NEO_SOCIAL_OMNITRIX_ENABLED=false,FACEBOOK_PROVIDER=existing-organic"
            --allow-unauthenticated
            --quiet
          )
          if (( ${#secret_bindings[@]} )); then
            IFS=,; joined="${secret_bindings[*]}"; unset IFS
            args+=(--set-secrets="$joined")
          fi
          gcloud "${args[@]}"

      - name: Verify generated Cloud Run URL
        id: service
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$URL"
          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/health")" = 200
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### NEO Social Gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud Run service: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/health.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create or inspect gateway.holytemples.org domain mapping
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED="$(gcloud domains list-user-verified --format='value(id)' 2>/dev/null || true)"
          if ! printf '%s\n' "$VERIFIED" | grep -Fxq 'holytemples.org'; then
            echo "### Domain mapping pending ownership verification" >> "$GITHUB_STEP_SUMMARY"
            echo "Verify holytemples.org in Google Search Console, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gcloud beta run domain-mappings describe --domain="$DOMAIN_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null 2>&1; then
            gcloud beta run domain-mappings create --service="$SERVICE_NAME" --domain="$DOMAIN_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --quiet
          fi
          echo "### DNS records for $DOMAIN_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          gcloud beta run domain-mappings describe --domain="$DOMAIN_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='yaml(status.resourceRecords)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "LinkedIn callback: $LINKEDIN_REDIRECT_URI" >> "$GITHUB_STEP_SUMMARY"
          echo "TikTok callback: $TIKTOK_REDIRECT_URI" >> "$GITHUB_STEP_SUMMARY"
