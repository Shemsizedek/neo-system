name: Deploy NEO Infrastructure Autopilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/neo-autopilot/**','architecture/neo-infrastructure-autopilot-policy.json','.github/workflows/deploy-neo-infrastructure-autopilot.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: neo-infrastructure-autopilot
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
      SERVICE_NAME: neo-infrastructure-autopilot
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run neo-autopilot:test
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build image
        env: {IMAGE: "${{ env.GCP_ARTIFACT_REGISTRY }}/neo-infrastructure-autopilot:${{ github.sha }}"}
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile.autopilot <<'EOF'
          FROM node:24-alpine
          WORKDIR /app
          COPY server/neo-autopilot ./server/neo-autopilot
          COPY server/neo-router ./server/neo-router
          ENV NODE_ENV=production PORT=8080
          USER node
          EXPOSE 8080
          CMD ["node","server/neo-autopilot/server.mjs"]
          EOF
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f /tmp/Dockerfile.autopilot -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy control plane
        env: {IMAGE: "${{ env.GCP_ARTIFACT_REGISTRY }}/neo-infrastructure-autopilot:${{ github.sha }}"}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --image="$IMAGE" --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" --port=8080 --allow-unauthenticated --set-secrets="NEO_AUTOPILOT_OPERATOR_TOKEN=neo-autopilot-operator-token:latest" --quiet
      - name: Verify posture
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          curl --retry 5 --retry-delay 3 -fsS "$SERVICE_URL/health"
          curl --retry 5 --retry-delay 3 -fsS "$SERVICE_URL/v1/estate/autopilot" >/tmp/autopilot.json
