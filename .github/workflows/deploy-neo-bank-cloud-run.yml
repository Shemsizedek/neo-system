name: Deploy NEO Bank to Cloud Run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/neo-bank/**','deploy/neo-bank/**','.github/workflows/deploy-neo-bank-cloud-run.yml','architecture/neo-hosts.json']
permissions:
  contents: read
  id-token: write
concurrency:
  group: neo-bank-cloud-run
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
      SERVICE_NAME: neo-bank
      DOMAIN: neobank.holytemples.org
      BANK_NEG_NAME: neo-bank-neg
      BANK_BACKEND_NAME: neo-bank-backend
      URL_MAP_NAME: neo-edge-url-map
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Test NEO Bank
        run: node --test server/neo-bank/*.test.mjs
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Install gcloud beta component
        run: gcloud components install beta --quiet
      - name: Build and push image
        env: {IMAGE: "${{ env.GCP_ARTIFACT_REGISTRY }}/neo-bank:${{ github.sha }}"}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f deploy/neo-bank/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy service
        env: {IMAGE: "${{ env.GCP_ARTIFACT_REGISTRY }}/neo-bank:${{ github.sha }}"}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --image="$IMAGE" --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" --port=8080 --allow-unauthenticated --set-env-vars="GCP_PROJECT_ID=$GCP_PROJECT_ID,NEO_BANK_FIRESTORE_DATABASE=${{ vars.NEO_BANK_FIRESTORE_DATABASE || '(default)' }}" --quiet
      - name: Verify Cloud Run origin
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test "$(curl --retry 5 --retry-delay 5 -sS -o /dev/null -w '%{http_code}' "$SERVICE_URL/health")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$SERVICE_URL/api/v1/nomni/valuation")" = 200
          echo "NEO_BANK_SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
      - name: Route domain through NEO HTTPS load balancer
        run: |
          set -euo pipefail
          if ! gcloud compute network-endpoint-groups describe "$BANK_NEG_NAME" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute network-endpoint-groups create "$BANK_NEG_NAME" --region="$GCP_REGION" --network-endpoint-type=serverless --cloud-run-service="$SERVICE_NAME" --project="$GCP_PROJECT_ID" --quiet
          fi
          if ! gcloud compute backend-services describe "$BANK_BACKEND_NAME" --global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute backend-services create "$BANK_BACKEND_NAME" --global --load-balancing-scheme=EXTERNAL_MANAGED --project="$GCP_PROJECT_ID" --quiet
          fi
          if ! gcloud compute backend-services describe "$BANK_BACKEND_NAME" --global --project="$GCP_PROJECT_ID" --format='json(backends)' | grep -q "$BANK_NEG_NAME"; then
            gcloud compute backend-services add-backend "$BANK_BACKEND_NAME" --global --network-endpoint-group="$BANK_NEG_NAME" --network-endpoint-group-region="$GCP_REGION" --project="$GCP_PROJECT_ID" --quiet
          fi
          gcloud compute url-maps describe "$URL_MAP_NAME" --project="$GCP_PROJECT_ID" >/dev/null
          if ! gcloud compute url-maps describe "$URL_MAP_NAME" --project="$GCP_PROJECT_ID" --format='json(hostRules,pathMatchers)' | grep -q 'neo-bank-matcher'; then
            gcloud compute url-maps add-path-matcher "$URL_MAP_NAME" --path-matcher-name=neo-bank-matcher --default-service="$BANK_BACKEND_NAME" --new-hosts="$DOMAIN" --project="$GCP_PROJECT_ID" --quiet
          fi
      - name: Verify production domain
        run: |
          set -euo pipefail
          test -n "${NEO_BANK_SERVICE_URL:-}"
          test "$(curl --retry 12 --retry-delay 10 --retry-all-errors -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/health")" = 200
          test "$(curl --retry 12 --retry-delay 10 --retry-all-errors -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/api/v1/community/status")" = 200
          test "$(curl --retry 12 --retry-delay 10 --retry-all-errors -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/api/v1/nomni/valuation")" = 200
          echo "NEO Bank origin: $NEO_BANK_SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Bank production: https://$DOMAIN/" >> "$GITHUB_STEP_SUMMARY"
