name: House of Negus Google Merchant Feed
on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *"
permissions:
  contents: read

jobs:
  build-feed:
    runs-on: ubuntu-latest
    env:
      SPREADSHOP_SHOP_ID: ${{ vars.SPREADSHOP_SHOP_ID }}
      SPREADSHOP_API_KEY: ${{ secrets.SPREADSHOP_API_KEY }}
      SPREADSHOP_PLATFORM: ${{ vars.SPREADSHOP_PLATFORM }}
      SPREADSHOP_STORE_URL: ${{ vars.SPREADSHOP_STORE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sync live Spreadshop sellables
        run: node scripts/spreadshop-sync-v2.mjs
      - name: Build Google Merchant feed
        run: node scripts/spreadshop-google-merchant-feed.mjs
      - name: Validate feed adapter
        run: node --test scripts/spreadshop-google-merchant-feed.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: house-of-negus-google-merchant-feed
          path: |
            merch/house-of-negus/generated/google-merchant.xml
            merch/house-of-negus/generated/google-merchant-report.json
          if-no-files-found: error
