name: Deploy NEO Relations Runtime

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run PostgreSQL migrations before production deploy'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/neo-relations/runtime
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_RELATIONS_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate deployment secrets
        run: |
          test -n "$VERCEL_TOKEN" || (echo 'VERCEL_TOKEN missing' && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo 'VERCEL_ORG_ID missing' && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo 'VERCEL_RELATIONS_PROJECT_ID missing' && exit 1)
      - name: Install dependencies
        run: npm install
      - name: Run runtime tests
        run: npm test
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Run migrations
        if: ${{ inputs.run_migrations }}
        env:
          DATABASE_URL: ${{ secrets.RELATIONS_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || (echo 'RELATIONS_DATABASE_URL missing' && exit 1)
          npm run migrate
      - name: Build production runtime
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production runtime
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify health
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error "$DEPLOY_URL/health" | tee /tmp/relations-health.json
          grep -q '"executionWorker":false' /tmp/relations-health.json
