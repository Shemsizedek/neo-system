name: OFFICE-007 Prepare Wildcard TLS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/office-007-prepare-wildcard-tls.yml'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      DNS_AUTH_NAME: neo-edge-holytemples-dns-auth
      CERT_NAME: neo-edge-holytemples-wildcard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Ensure Certificate Manager resources
        shell: bash
        run: |
          set -euo pipefail
          gcloud services enable certificatemanager.googleapis.com --project="$GCP_PROJECT_ID" --quiet
          if ! gcloud certificate-manager dns-authorizations describe "$DNS_AUTH_NAME" --location=global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud certificate-manager dns-authorizations create "$DNS_AUTH_NAME" --domain=holytemples.org --location=global --project="$GCP_PROJECT_ID"
          fi
          echo "DNS_AUTH_RECORD:"
          gcloud certificate-manager dns-authorizations describe "$DNS_AUTH_NAME" --location=global --project="$GCP_PROJECT_ID" --format='yaml(dnsResourceRecord)'
          if ! gcloud certificate-manager certificates describe "$CERT_NAME" --location=global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud certificate-manager certificates create "$CERT_NAME" --domains='*.holytemples.org' --dns-authorizations="$DNS_AUTH_NAME" --location=global --project="$GCP_PROJECT_ID"
          fi
          echo "CERT_STATE=$(gcloud certificate-manager certificates describe "$CERT_NAME" --location=global --project="$GCP_PROJECT_ID" --format='value(managed.state)' || true)"
