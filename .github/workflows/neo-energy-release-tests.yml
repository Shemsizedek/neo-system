name: NEO Energy release gate tests
on:
  pull_request:
    paths:
      - 'neo-energy/NES-018/**'
      - '.github/workflows/neo-energy-release-tests.yml'
  workflow_dispatch:
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s neo-energy/NES-018 -p 'test_*.py' -v
