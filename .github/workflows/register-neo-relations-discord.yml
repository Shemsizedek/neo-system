name: Register NEO Relations Discord Command

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/neo-discord/commands/relations.json'
      - '.github/workflows/register-neo-relations-discord.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Register or update /relations
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = process.env.DISCORD_APPLICATION_ID;
          const token = process.env.DISCORD_BOT_TOKEN;
          if (!app || !token) throw new Error('DISCORD_APPLICATION_ID and DISCORD_BOT_TOKEN are required');
          const command = JSON.parse(fs.readFileSync('services/neo-discord/commands/relations.json','utf8'));
          const base = `https://discord.com/api/v10/applications/${app}/commands`;
          const headers = {authorization:`Bot ${token}`,'content-type':'application/json'};
          (async()=>{
            const listRes = await fetch(base,{headers});
            if(!listRes.ok) throw new Error(`Discord list commands failed ${listRes.status}: ${await listRes.text()}`);
            const commands = await listRes.json();
            const existing = commands.find(x=>x.name===command.name);
            const url = existing ? `${base}/${existing.id}` : base;
            const method = existing ? 'PATCH' : 'POST';
            const res = await fetch(url,{method,headers,body:JSON.stringify(command)});
            if(!res.ok) throw new Error(`Discord ${method} failed ${res.status}: ${await res.text()}`);
            const saved = await res.json();
            console.log(`Registered /${saved.name} command id ${saved.id}`);
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
