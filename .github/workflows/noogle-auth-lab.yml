name: Noogle Authentication Laboratory
on:
  pull_request:
    paths:
      - 'services/noogle-auth-lab/**'
      - 'docs/connect/**'
      - 'tests/noogle-connect/**'
      - '.github/workflows/noogle-auth-lab.yml'
  push:
    paths:
      - 'services/noogle-auth-lab/**'
      - 'docs/connect/**'
      - 'tests/noogle-connect/**'
      - '.github/workflows/noogle-auth-lab.yml'
permissions:
  contents: read
jobs:
  auth-lab-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebAuthn verifier test dependency
        run: python -m pip install 'webauthn>=2,<3'
      - name: Verify fail-closed authentication laboratory
        working-directory: services/noogle-auth-lab
        run: python -m unittest discover -v -p 'test_*.py'

  browser-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser adapter syntax
        run: node --check docs/connect/passkeys.js
      - name: Verify fail-closed browser enrollment
        run: node tests/noogle-connect/passkeys.test.cjs
      - name: Verify NEO Pass identity bridge and enrollment authorization
        run: node --test services/noogle-auth-lab/identity-bridge.test.mjs services/noogle-auth-lab/enrollment-authorization.test.mjs services/noogle-auth-lab/guardian-gateway.test.mjs
