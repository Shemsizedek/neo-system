name: NEO Pads Postgres Integration

on:
  pull_request:
    paths:
      - "apps/neo-pads/**"
      - ".github/workflows/neo-pads-postgres-integration.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neo_pads
          POSTGRES_PASSWORD: neo_pads
          POSTGRES_DB: neo_pads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neo_pads -d neo_pads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/neo-pads

    env:
      DATABASE_URL: postgres://neo_pads:neo_pads@127.0.0.1:5432/neo_pads

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/neo-pads/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run test:postgres
