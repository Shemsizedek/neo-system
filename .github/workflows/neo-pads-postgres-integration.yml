name: NEO Pads Postgres Integration

on:
  pull_request:
    paths:
      - "apps/neo-pads/**"
      - ".github/workflows/neo-pads-postgres-integration.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neo_pads
          POSTGRES_PASSWORD: neo_pads
          POSTGRES_DB: neo_pads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neo_pads -d neo_pads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/neo-pads

    env:
      DATABASE_URL: postgres://neo_pads:neo_pads@127.0.0.1:5432/neo_pads
      NEO_PADS_WEB_ORIGIN: https://example.github.io
      NEOPASS_API_URL: https://neopass.example.test
      NEO_COUNTER_API_URL: https://counter.example.test
      NEO_COUNTER_CHECKOUT_URL: https://counter.example.test/checkout
      NEO_PADS_CHECKOUT_RETURN_URL: https://example.github.io/neo-system/apps/neo-pads/checkout-return
      NEO_PADS_CHECKOUT_CANCEL_URL: https://example.github.io/neo-system/apps/neo-pads/checkout-cancel
      NEO_COUNTER_WEBHOOK_SECRET: test-webhook-secret
      WALLET_SIGNATURE_VERIFY_URL: https://wallet.example.test/verify
      NEO_PADS_OPS_TOKEN: test-ops-token
      NEO_PADS_ADMIN_TOKEN: test-admin-token
      NEO_COUNTER_PAYOUT_STATUS_URL: https://counter.example.test/payouts/{payoutId}
      NEO_COUNTER_PAYOUT_API_KEY: test-payout-api-key
      NEO_PADS_REQUIRE_CHAIN_CONFIRMATION: "true"
      NEO_PADS_CHAIN_CONFIRMATION_URL: https://chain.example.test/confirm
      NEO_PADS_PAYOUT_EXECUTION_ENABLED: "false"
      NEO_PADS_WALLET_VERIFICATION_TTL_SECONDS: "86400"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/neo-pads/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:adapter-contracts
      - run: npm run db:migrate
      - run: npm run test:postgres
      - run: npm run test:payouts
      - run: npm run test:payout-reconciliation
      - run: npm run production:readiness
      - name: Start NEO Pads API
        run: npm start > /tmp/neo-pads.log 2>&1 & echo $! > /tmp/neo-pads.pid
      - name: Wait for readiness
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8788/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/neo-pads.log
          exit 1
      - run: npm run smoke
      - run: npm run test:http-security
