name: Verify NEO Generator Shared Front Door

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-edge/product-static.mjs'
      - 'public/neo-generator/**'
      - '.github/workflows/verify-neo-generator-shared-path.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify NEO Generator live path
        run: |
          set -euo pipefail
          base='https://neo.holytemples.org/generator'
          code="$(curl -sS -o /tmp/redirect -w '%{http_code}' "$base")"
          test "$code" = 308
          for path in / /health /api /api/health /api/ready /api/products /api/contracts /api/capacity /api/hashpower-quotes /api/sources /platform-shell.css /platform-shell.js; do
            code="$(curl --connect-timeout 10 --max-time 30 --retry 4 --retry-delay 5 -sS -o /tmp/generator-response -w '%{http_code}' "$base$path" || true)"
            echo "$base$path -> $code" >> "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
            test -s /tmp/generator-response
          done
          curl -fsS "$base/" -o /tmp/generator-index.html
          grep -q 'NEO Generator' /tmp/generator-index.html
          grep -q 'Mining Contract / Compute Orchestration' /tmp/generator-index.html
          grep -q 'authenticated backend execution' /tmp/generator-index.html
          curl -fsS "$base/api/ready" -o /tmp/generator-ready.json
          grep -q '"ok":true' /tmp/generator-ready.json
          grep -q '"mode":"PUBLIC_READ_ONLY"' /tmp/generator-ready.json
          curl -fsS "$base/api/capacity" -o /tmp/generator-capacity.json
          grep -q '"available":false' /tmp/generator-capacity.json
          grep -q '"totalHashrateTh":null' /tmp/generator-capacity.json
          curl -fsS "$base/api/hashpower-quotes" -o /tmp/generator-quotes.json
          grep -q '"available":false' /tmp/generator-quotes.json
          curl -fsS "$base/api" -o /tmp/generator-api.json
          grep -q '"purchasesEnabled":false' /tmp/generator-api.json
          grep -q '"settlementEnabled":false' /tmp/generator-api.json
