name: NEO VPN GCP

on:
  pull_request:
    paths:
      - 'services/neo-vpn/infra/gcp/**'
      - '.github/workflows/neo-vpn-gcp.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/neo-vpn/infra/gcp

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.0'

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'apply' && 'neo-vpn-production' || 'neo-vpn-plan' }}
    concurrency:
      group: neo-vpn-gcp-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: services/neo-vpn/infra/gcp

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce trusted main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Authenticated Google Cloud plan/apply is permitted only from refs/heads/main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Validate required GitHub variables
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT GCP_TF_STATE_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name repository/environment variable is not configured"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Google Cloud activation preflight
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: bash preflight.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.0'

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init with remote state
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}"
          -backend-config="prefix=neo-vpn/node-001"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
          TF_VAR_zone: ${{ vars.GCP_ZONE || 'us-central1-a' }}
          TF_VAR_gateway_subnet_cidr: ${{ vars.GCP_NEO_VPN_SUBNET || '10.145.1.0/24' }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' && github.ref == 'refs/heads/main' }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
          TF_VAR_zone: ${{ vars.GCP_ZONE || 'us-central1-a' }}
          TF_VAR_gateway_subnet_cidr: ${{ vars.GCP_NEO_VPN_SUBNET || '10.145.1.0/24' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Print Node 001 deployment outputs
        if: ${{ inputs.action == 'apply' && github.ref == 'refs/heads/main' }}
        run: |
          echo "Node 001 public IP: $(terraform output -raw neo_vpn_node_001_public_ip)"
          echo "NEO VPN VPC: $(terraform output -raw neo_vpn_network_name)"
          echo "Node 001 runtime identity: $(terraform output -raw neo_vpn_node_001_service_account)"
