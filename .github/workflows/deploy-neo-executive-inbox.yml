name: Deploy NEOsync Executive Inbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/neo-executive-inbox/**'
      - '.github/workflows/deploy-neo-executive-inbox.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/neo-executive-inbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
