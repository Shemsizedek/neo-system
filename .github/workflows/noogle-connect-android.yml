name: Noogle Connect Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/noogle-connect-mobile/**'
      - '.github/workflows/noogle-connect-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/noogle-connect-mobile/**'
permissions:
  contents: read
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/noogle-connect-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build companion debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noogle-connect-mobile-debug-apk
          path: apps/noogle-connect-mobile/app/build/outputs/apk/debug/*.apk
          retention-days: 14
