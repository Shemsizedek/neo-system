name: Deploy NEO System to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Noogle native index snapshot
        run: npm run crawl:noogle

      - name: Refresh Noogle source health
        run: node scripts/noogle-source-refresh.mjs

      - name: Build NEO System
        env:
          VITE_NEOPAY_API_BASE: ${{ vars.NEOPAY_API_BASE }}
          VITE_NEOPAY_COUNTERPARTY_API: ${{ vars.NEOPAY_COUNTERPARTY_API }}
          VITE_NEOPAY_BITCOIN_API: ${{ vars.NEOPAY_BITCOIN_API }}
        run: npm run build

      - name: Build Pages platform API snapshots
        run: node scripts/build-pages-platform-api.mjs

      - name: Publish NEOpay application route
        run: |
          mkdir -p dist/neopay
          cp dist/index.html dist/neopay/index.html
          test -f dist/neopay/index.html

      - name: Publish Noogle live interface
        run: |
          test -f apps/noogle/web/index.html
          test -f apps/noogle/web/app.js
          test -f apps/noogle/web/styles.css
          test -f apps/noogle/web/health.js
          test -f apps/noogle/web/status.html
          test -f apps/noogle/web/submit.html
          mkdir -p dist/noogle dist/api/noogle
          cp -R apps/noogle/web/. dist/noogle/
          cp apps/noogle/index/generated/source-health.json dist/api/noogle/source-health.json
          cp apps/noogle/index/sources.json dist/api/noogle/sources.json
          test -f dist/noogle/index.html
          test -f dist/noogle/app.js
          test -f dist/noogle/styles.css
          test -f dist/noogle/health.js
          test -f dist/noogle/status.html
          test -f dist/noogle/submit.html
          test -f dist/api/noogle/index.json
          test -f dist/api/noogle/crawl-report.json
          test -f dist/api/noogle/knowledge-graph.json
          test -f dist/api/noogle/claim-graph.json
          test -f dist/api/noogle/source-health.json
          test -f dist/api/noogle/sources.json

      - name: Publish Omnitrix browser
        run: |
          test -f apps/omnitrix/web/index.html
          test -f apps/omnitrix/web/app.js
          test -f apps/omnitrix/web/styles.css
          test -f apps/omnitrix/web/miner-bridge.js
          mkdir -p dist/omnitrix
          cp -R apps/omnitrix/web/. dist/omnitrix/
          test -f dist/omnitrix/index.html
          test -f dist/omnitrix/app.js

      - name: Verify Pages artifact root
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Verify NEO JARVIS artifact
        run: test -f dist/neo-jarvis/index.html

      - name: Verify NEO PACER artifact
        run: test -f dist/neo-pacer/index.html

      - name: Verify expanded NEO platform routes and APIs
        run: |
          for platform in neopay neo-teller neo-books neo-prime neo-exchange neo-generator neo-miner; do
            test -f "dist/$platform/index.html"
            test -f "dist/api/platforms/$platform.json"
          done
          test -f dist/api/platforms/index.json

      - name: Build NEO Counter
        working-directory: apps/neo-counter
        env:
          VITE_NEO_COUNTER_SYNC_ENDPOINT: ${{ vars.NEO_COUNTER_SYNC_ENDPOINT }}
        run: |
          npm install
          npm run build

      - name: Publish NEO Counter routes
        run: |
          test -f apps/neo-counter/dist/index.html
          mkdir -p dist/neo-counter dist/apps/neo-counter
          cp -R apps/neo-counter/dist/. dist/neo-counter/
          cp -R apps/neo-counter/dist/. dist/apps/neo-counter/
          test -f dist/neo-counter/index.html
          test -f dist/apps/neo-counter/index.html

      - name: Add NEO TV Hub to Pages artifact
        run: |
          test -f docs/neo-tv/index.html
          mkdir -p dist/neo-tv
          cp -R docs/neo-tv/. dist/neo-tv/
          test -f dist/neo-tv/index.html

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Pages build summary
        run: |
          echo "Root build: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Noogle: /noogle/" >> "$GITHUB_STEP_SUMMARY"
          echo "Omnitrix: /omnitrix/" >> "$GITHUB_STEP_SUMMARY"
          echo "Noogle status: /noogle/status.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Noogle submissions: /noogle/submit.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Noogle native index: /api/noogle/index.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Noogle crawl report: /api/noogle/crawl-report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Noogle knowledge graph: /api/noogle/knowledge-graph.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Noogle claim graph: /api/noogle/claim-graph.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Noogle source health: /api/noogle/source-health.json" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO JARVIS: /neo-jarvis/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO PACER: /neo-pacer/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Counter: /neo-counter/ + /apps/neo-counter/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO TV: /neo-tv/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEOpay application: /neopay/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Teller: /neo-teller/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Books: /neo-books/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Prime: /neo-prime/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Exchange: /neo-exchange/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Generator: /neo-generator/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Miner: /neo-miner/" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages API registry: /api/platforms/index.json" >> "$GITHUB_STEP_SUMMARY"
          echo "SPA fallback: /404.html" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
