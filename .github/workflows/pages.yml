name: Deploy NEO System to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NEO System
        env:
          VITE_NEOPAY_API_BASE: ${{ vars.NEOPAY_API_BASE }}
        run: npm run build

      - name: Verify Pages artifact root
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Verify NEO JARVIS artifact
        run: test -f dist/neo-jarvis/index.html

      - name: Verify NEO PACER artifact
        run: test -f dist/neo-pacer/index.html

      - name: Build NEO Counter
        working-directory: apps/neo-counter
        env:
          VITE_NEO_COUNTER_SYNC_ENDPOINT: ${{ vars.NEO_COUNTER_SYNC_ENDPOINT }}
        run: |
          npm install
          npm run build

      - name: Publish NEO Counter routes
        run: |
          test -f apps/neo-counter/dist/index.html
          mkdir -p dist/neo-counter dist/apps/neo-counter
          cp -R apps/neo-counter/dist/. dist/neo-counter/
          cp -R apps/neo-counter/dist/. dist/apps/neo-counter/
          test -f dist/neo-counter/index.html
          test -f dist/apps/neo-counter/index.html

      - name: Add NEO TV Hub to Pages artifact
        run: |
          test -f docs/neo-tv/index.html
          mkdir -p dist/neo-tv
          cp -R docs/neo-tv/. dist/neo-tv/
          test -f dist/neo-tv/index.html

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Pages build summary
        run: |
          echo "Root build: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO JARVIS: /neo-jarvis/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO PACER: /neo-pacer/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Counter: /neo-counter/ + /apps/neo-counter/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO TV: /neo-tv/" >> "$GITHUB_STEP_SUMMARY"
          echo "SPA fallback: /404.html" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
