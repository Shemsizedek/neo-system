name: Deploy NEO System to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NEO System
        run: npm run build

      - name: Verify NEO JARVIS artifact
        run: test -f dist/neo-jarvis/index.html

      - name: Build NEO Counter
        working-directory: apps/neo-counter
        run: |
          npm install
          npm run build

      - name: Add NEO Counter to Pages artifact
        run: |
          mkdir -p dist/apps/neo-counter
          cp -R apps/neo-counter/dist/. dist/apps/neo-counter/
          test -f dist/apps/neo-counter/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
