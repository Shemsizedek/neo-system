name: Deploy NEO System to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Noogle native index snapshot
        run: npm run crawl:noogle
      - name: Refresh Noogle source health
        run: node scripts/noogle-source-refresh.mjs
      - name: Build NEO System
        env:
          VITE_NEOPAY_API_BASE: ${{ vars.NEOPAY_API_BASE || 'https://neopay-api.neosystem.workers.dev' }}
          VITE_NEOPAY_COUNTERPARTY_API: ${{ vars.NEOPAY_COUNTERPARTY_API }}
          VITE_NEOPAY_BITCOIN_API: ${{ vars.NEOPAY_BITCOIN_API }}
          VITE_NEO_GOVERNMENT_URL: ${{ vars.NEO_GOVERNMENT_URL || 'https://neo-government.neosystem.workers.dev' }}
        run: npm run build
      - name: Build Pages platform API snapshots
        run: node scripts/build-pages-platform-api.mjs
      - name: Build NEO Enterprise public directory
        run: npm run pages:enterprise
      - name: Publish NEOpay application route
        run: |
          mkdir -p dist/neopay
          cp dist/index.html dist/neopay/index.html
          test -f dist/neopay/index.html
      - name: Publish Noogle live interface
        run: |
          test -f apps/noogle/web/index.html
          mkdir -p dist/noogle dist/api/noogle
          cp -R apps/noogle/web/. dist/noogle/
          cp apps/noogle/index/generated/source-health.json dist/api/noogle/source-health.json
          cp apps/noogle/index/sources.json dist/api/noogle/sources.json
      - name: Publish Omnitrix browser
        run: |
          test -f apps/omnitrix/web/index.html
          mkdir -p dist/omnitrix
          cp -R apps/omnitrix/web/. dist/omnitrix/
      - name: Publish NEOscan explorer
        run: |
          test -f apps/neoscan/web/index.html
          mkdir -p dist/neoscan
          cp -R apps/neoscan/web/. dist/neoscan/
      - name: Publish NEO Telegram and GitHub backend snapshots
        run: |
          test -f docs/neo-telegram/index.html
          test -f data/neo-telegram/status.json
          test -f data/neo-telegram/protocol.json
          mkdir -p dist/neo-telegram dist/api/neo-telegram
          cp -R docs/neo-telegram/. dist/neo-telegram/
          cp data/neo-telegram/status.json dist/api/neo-telegram/status.json
          cp data/neo-telegram/protocol.json dist/api/neo-telegram/protocol.json
          printf '{"commit":"%s","generated_at":"%s","source":"GitHub Actions"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/api/neo-telegram/build.json
      - name: Verify Pages artifact root
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/neo-jarvis/index.html
          test -f dist/neo-pacer/index.html
          test -f dist/neo-telegram/index.html
          test -f dist/api/neo-telegram/status.json
          test -f dist/api/neo-telegram/protocol.json
          test -f dist/api/neo-telegram/build.json
      - name: Verify expanded NEO platform routes and APIs
        run: |
          for platform in neopay neo-teller neo-books neo-prime neo-exchange neo-generator neo-miner; do
            test -f "dist/$platform/index.html"
            test -f "dist/api/platforms/$platform.json"
          done
          test -f dist/api/platforms/index.json
      - name: Build NEO Counter
        working-directory: apps/neo-counter
        env:
          VITE_NEO_COUNTER_SYNC_ENDPOINT: ${{ vars.NEO_COUNTER_SYNC_ENDPOINT }}
        run: |
          npm install
          npm run build
      - name: Publish NEO Counter routes
        run: |
          test -f apps/neo-counter/dist/index.html
          mkdir -p dist/neo-counter dist/apps/neo-counter
          cp -R apps/neo-counter/dist/. dist/neo-counter/
          cp -R apps/neo-counter/dist/. dist/apps/neo-counter/
      - name: Add NEO TV Hub to Pages artifact
        run: |
          test -f docs/neo-tv/index.html
          mkdir -p dist/neo-tv
          cp -R docs/neo-tv/. dist/neo-tv/
      - name: Publish public NEO surfaces
        run: |
          routes="neo-hub neo-oracle neo-lingo neo-algo neo-corpus neo-enterprise public-workspace"
          for route in $routes; do
            test -d "docs/$route"
            mkdir -p "dist/$route"
            cp -R "docs/$route/." "dist/$route/"
          done
          for route in neo-hub neo-oracle neo-lingo neo-algo neo-corpus neo-enterprise; do
            test -f "dist/$route/index.html"
          done
          test -f dist/neo-enterprise/admin/index.html
          test ! -e dist/neo-government
          test ! -e dist/government-workspace
      - name: Verify NEO Enterprise publication boundary
        run: |
          test -f dist/api/enterprise/index.json
          test -f dist/api/enterprise/organizations.json
          test -f dist/api/enterprise/roles.json
          test ! -e dist/api/enterprise/memberships.json
          ! grep -R "github:Shemsizedek" dist/api/enterprise dist/neo-enterprise
          ! grep -R "PRIVATE_CONTROL_PLANE" dist/api/enterprise dist/neo-enterprise
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - name: Pages build summary
        run: |
          echo "Public NEO Hub: /neo-hub/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Telegram: /neo-telegram/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Telegram static API: /api/neo-telegram/" >> "$GITHUB_STEP_SUMMARY"
          echo "NEO Enterprise: /neo-enterprise/" >> "$GITHUB_STEP_SUMMARY"
          echo "Enterprise executive console: /neo-enterprise/admin/" >> "$GITHUB_STEP_SUMMARY"
          echo "Enterprise public API: /api/enterprise/" >> "$GITHUB_STEP_SUMMARY"
          echo "Private memberships and government workspace data: excluded from GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
