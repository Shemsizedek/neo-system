name: Provision NEO Edge Global Load Balancer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-neo-edge-load-balancer.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-edge-global-load-balancer
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      SERVICE_NAME: neo-edge
      NEG_NAME: neo-edge-neg
      BACKEND_NAME: neo-edge-backend
      URL_MAP_NAME: neo-edge-url-map
      CERT_NAME: neo-edge-managed-cert
      CERT_MAP_NAME: neo-edge-certificate-map
      CERT_MAP_ENTRY_NAME: neo-edge-wildcard-entry
      CERT_MANAGER_CERT_NAME: neo-edge-holytemples-wildcard
      DNS_AUTH_NAME: neo-edge-holytemples-dns-auth
      RELATIONS_CERT_NAME: neo-edge-relations-cert
      FINANCE_CERT_NAME: neo-edge-finance-cert
      TELLER_CERT_NAME: neo-edge-teller-cert
      HTTPS_PROXY_NAME: neo-edge-https-proxy
      HTTP_PROXY_NAME: neo-edge-http-proxy
      HTTPS_RULE_NAME: neo-edge-https-rule
      HTTP_RULE_NAME: neo-edge-http-rule
      IP_NAME: neo-edge-global-ip
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Ensure required APIs
        run: |
          set -euo pipefail
          gcloud services enable compute.googleapis.com run.googleapis.com --project="$GCP_PROJECT_ID" --quiet

      - name: Verify load-balancer IAM
        run: |
          set -euo pipefail
          member="serviceAccount:${GCP_CLOUD_RUN_SERVICE_ACCOUNT}"
          if ! gcloud projects get-iam-policy "$GCP_PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.role:roles/compute.loadBalancerAdmin AND bindings.members:${member}" \
            --format='value(bindings.role)' | grep -qx 'roles/compute.loadBalancerAdmin'; then
            echo "::error::The GitHub deployment service account does not have roles/compute.loadBalancerAdmin. Grant that role outside this workflow using an IAM administrator, then rerun. The deployment identity must not self-grant project IAM."
            exit 1
          fi

      - name: Reserve global IPv4 address
        run: |
          set -euo pipefail
          if ! gcloud compute addresses describe "$IP_NAME" --global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute addresses create "$IP_NAME" --global --ip-version=IPV4 --project="$GCP_PROJECT_ID" --quiet
          fi
          EDGE_IP="$(gcloud compute addresses describe "$IP_NAME" --global --project="$GCP_PROJECT_ID" --format='value(address)')"
          test -n "$EDGE_IP"
          echo "NEO_EDGE_GLOBAL_IP=$EDGE_IP" >> "$GITHUB_ENV"
          echo "NEO Edge global IPv4: $EDGE_IP" >> "$GITHUB_STEP_SUMMARY"

      - name: Create serverless NEG
        run: |
          set -euo pipefail
          if ! gcloud compute network-endpoint-groups describe "$NEG_NAME" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute network-endpoint-groups create "$NEG_NAME" \
              --region="$GCP_REGION" \
              --network-endpoint-type=serverless \
              --cloud-run-service="$SERVICE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi

      - name: Create global backend service
        run: |
          set -euo pipefail
          if ! gcloud compute backend-services describe "$BACKEND_NAME" --global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute backend-services create "$BACKEND_NAME" \
              --global \
              --load-balancing-scheme=EXTERNAL_MANAGED \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi
          if ! gcloud compute backend-services describe "$BACKEND_NAME" --global --project="$GCP_PROJECT_ID" --format='json(backends)' | grep -q "$NEG_NAME"; then
            gcloud compute backend-services add-backend "$BACKEND_NAME" \
              --global \
              --network-endpoint-group="$NEG_NAME" \
              --network-endpoint-group-region="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi

      - name: Create URL map
        run: |
          set -euo pipefail
          if ! gcloud compute url-maps describe "$URL_MAP_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute url-maps create "$URL_MAP_NAME" \
              --default-service="$BACKEND_NAME" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi

      - name: Grant Certificate Manager editor to deployment identity
        run: |
          set -euo pipefail
          DEPLOY_PRINCIPAL="serviceAccount:${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}"
          gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
            --member="$DEPLOY_PRINCIPAL" \
            --role='roles/certificatemanager.editor' \
            --condition=None \
            --quiet

      - name: Prepare Certificate Manager wildcard TLS
        run: |
          set -euo pipefail
          gcloud services enable certificatemanager.googleapis.com --project="$GCP_PROJECT_ID" --quiet

          if ! gcloud certificate-manager dns-authorizations describe "$DNS_AUTH_NAME" --location=global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud certificate-manager dns-authorizations create "$DNS_AUTH_NAME" \
              --domain=holytemples.org --location=global --project="$GCP_PROJECT_ID"
          fi

          echo '### Certificate Manager DNS authorization' >> "$GITHUB_STEP_SUMMARY"
          gcloud certificate-manager dns-authorizations describe "$DNS_AUTH_NAME" \
            --location=global --project="$GCP_PROJECT_ID" \
            --format='yaml(dnsResourceRecord)' >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::DNS authorization must be published at the authoritative DNS provider before wildcard certificate provisioning can complete."

          if ! gcloud certificate-manager certificates describe "$CERT_MANAGER_CERT_NAME" --location=global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud certificate-manager certificates create "$CERT_MANAGER_CERT_NAME" \
              --domains='*.holytemples.org' \
              --dns-authorizations="$DNS_AUTH_NAME" \
              --location=global --project="$GCP_PROJECT_ID"
          fi

          CERT_STATE="$(gcloud certificate-manager certificates describe "$CERT_MANAGER_CERT_NAME" --location=global --project="$GCP_PROJECT_ID" --format='value(managed.state)')"
          echo "Certificate Manager wildcard state: $CERT_STATE"
          if [ "$CERT_STATE" != "ACTIVE" ]; then
            echo "::notice::Wildcard certificate is not ACTIVE yet. Existing Compute Engine certificates and HTTPS proxy remain unchanged."
            exit 0
          fi

          if ! gcloud certificate-manager maps describe "$CERT_MAP_NAME" --location=global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud certificate-manager maps create "$CERT_MAP_NAME" --location=global --project="$GCP_PROJECT_ID"
          fi
          if ! gcloud certificate-manager maps entries describe "$CERT_MAP_ENTRY_NAME" --map="$CERT_MAP_NAME" --location=global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud certificate-manager maps entries create "$CERT_MAP_ENTRY_NAME" \
              --map="$CERT_MAP_NAME" \
              --hostname='*.holytemples.org' \
              --certificates="$CERT_MANAGER_CERT_NAME" \
              --location=global --project="$GCP_PROJECT_ID"
          fi

          echo "::notice::Wildcard certificate is ACTIVE; attaching Certificate Manager map to the existing HTTPS proxy."
          gcloud compute target-https-proxies update "$HTTPS_PROXY_NAME" \
            --certificate-map="$CERT_MAP_NAME" \
            --project="$GCP_PROJECT_ID" --quiet

      - name: Create or update HTTPS proxy and forwarding rule
        run: |
          set -euo pipefail
          if ! gcloud compute target-https-proxies describe "$HTTPS_PROXY_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute target-https-proxies create "$HTTPS_PROXY_NAME" \
              --url-map="$URL_MAP_NAME" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          else
            gcloud compute target-https-proxies update "$HTTPS_PROXY_NAME" \
              --ssl-certificates="$CERTS" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi
          if ! gcloud compute forwarding-rules describe "$HTTPS_RULE_NAME" --global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute forwarding-rules create "$HTTPS_RULE_NAME" \
              --global \
              --load-balancing-scheme=EXTERNAL_MANAGED \
              --address="$IP_NAME" \
              --target-https-proxy="$HTTPS_PROXY_NAME" \
              --ports=443 \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi

      - name: Create HTTP proxy and forwarding rule
        run: |
          set -euo pipefail
          if ! gcloud compute target-http-proxies describe "$HTTP_PROXY_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute target-http-proxies create "$HTTP_PROXY_NAME" --url-map="$URL_MAP_NAME" --project="$GCP_PROJECT_ID" --quiet
          fi
          if ! gcloud compute forwarding-rules describe "$HTTP_RULE_NAME" --global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute forwarding-rules create "$HTTP_RULE_NAME" \
              --global \
              --load-balancing-scheme=EXTERNAL_MANAGED \
              --address="$IP_NAME" \
              --target-http-proxy="$HTTP_PROXY_NAME" \
              --ports=80 \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi

      - name: Report DNS cutover targets
        run: |
          set -euo pipefail
          test -n "${NEO_EDGE_GLOBAL_IP:-}"
          {
            echo '### NEO Edge DNS cutover target'
            echo
            echo "Shared edge IPv4: **${NEO_EDGE_GLOBAL_IP}**"
            echo '- NVSN TLS is served by the Certificate Manager wildcard map once its managed certificate is ACTIVE.'
            echo '- `relations.holytemples.org` uses its dedicated managed certificate.'
            echo '- `finance.holytemples.org` uses its dedicated managed certificate.'
            echo '- `teller.holytemples.org` should resolve to the same IPv4 for its dedicated managed certificate to activate.'
          } >> "$GITHUB_STEP_SUMMARY"
