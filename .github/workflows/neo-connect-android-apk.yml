name: NEO Connect Android APK
on:
  pull_request:
    paths:
      - 'apps/neo-connect-android/**'
      - '.github/workflows/neo-connect-android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/neo-connect-android/**'
      - '.github/workflows/neo-connect-android-apk.yml'
  workflow_dispatch:
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/neo-connect-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK was generated
        run: test -s app/build/outputs/apk/debug/app-debug.apk && sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: neo-connect-android-debug-apk
          path: apps/neo-connect-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
