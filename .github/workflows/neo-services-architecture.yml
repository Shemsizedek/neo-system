name: NEO Services Architecture Standard

on:
  pull_request:
    paths:
      - 'architecture/**'
      - 'services/neo-discord/**'
      - 'apps/**'
      - 'docs/**'
      - '.github/workflows/*pages.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/*cloudflare.yml'
      - '.github/workflows/deploy-neo-discord.yml'
      - '.github/workflows/neo-services-architecture.yml'
  push:
    branches: [main]
    paths:
      - 'architecture/**'
      - 'services/neo-discord/**'
      - 'apps/**'
      - 'docs/**'
      - '.github/workflows/*pages.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/*cloudflare.yml'
      - '.github/workflows/deploy-neo-discord.yml'
      - '.github/workflows/neo-services-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-three-plane-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate canonical NEO Services architecture
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const p=JSON.parse(fs.readFileSync('architecture/neo-services-platform.json','utf8'))
          if(p.scope!=='all-neo-services') throw new Error('architecture scope must cover all NEO Services')
          if(p.planes.frontend.primary!=='github-pages') throw new Error('GitHub Pages must be the frontend plane')
          if(p.planes.backend.primary!=='github') throw new Error('GitHub must be the backend plane')
          if(p.planes.serverApi.primary!=='discord') throw new Error('Discord must be the server/API plane')
          if(p.planes.serverApi.transport.mayOwnNeoBusinessLogic!==false) throw new Error('transport bridges may not own NEO business logic')
          if(p.planes.serverApi.transport.mayBecomeNeoBackend!==false) throw new Error('transport bridges may not become the NEO backend')
          NODE
      - name: Validate NEO Services app inventory
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const i=require('./architecture/neo-services-normalization.json')
          const dirs=fs.readdirSync('apps',{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort()
          const recorded=i.apps.map(x=>x.id).sort()
          if(JSON.stringify(dirs)!==JSON.stringify(recorded)) {
            console.error('NEO Services inventory drift detected', {dirs,recorded})
            process.exit(1)
          }
          if(i.planes.backend!=='github'||i.planes.frontend!=='github-pages'||i.planes.serverApi!=='discord') process.exit(1)
          if(i.rules.standaloneCloudflareServiceBackend!==false) process.exit(1)
          if(i.rules.standaloneVercelServiceBackend!==false) process.exit(1)
          if(i.rules.singleGitHubPagesDeploymentOwner!==true) process.exit(1)
          NODE
      - name: Validate canonical Pages route registry
        run: |
          node - <<'NODE'
          const i=require('./architecture/neo-services-normalization.json')
          const r=require('./architecture/neo-pages-routes.json')
          if(i.pages.deploymentOwner!=='.github/workflows/pages.yml') throw new Error('pages.yml must own Pages deployment')
          if(r.deploymentOwner!==i.pages.deploymentOwner) throw new Error('Pages owner mismatch')
          if(r.rules.singleArtifact!==true||r.rules.singleDeployWorkflow!==true||r.rules.serviceWorkflowsValidationOnly!==true) throw new Error('Pages registry policy invalid')
          const paths=r.routes.map(x=>x.path)
          if(new Set(paths).size!==paths.length) throw new Error('duplicate Pages route detected')
          if(!paths.includes('/neo-relations/')) throw new Error('NEO Relations route not registered')
          if(!paths.includes('/neo-pacer/')) throw new Error('NEO-PACER route not registered')
          NODE
      - name: Enforce single Pages deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          owner='.github/workflows/pages.yml'
          policy='.github/workflows/neo-services-architecture.yml'
          test -s "$owner"
          grep -q 'actions/upload-pages-artifact@' "$owner"
          grep -q 'actions/deploy-pages@' "$owner"
          while IFS= read -r f; do
            [ "$f" = "$owner" ] && continue
            [ "$f" = "$policy" ] && continue
            if grep -Eq 'actions/(upload-pages-artifact|deploy-pages)@|pages:[[:space:]]*write' "$f"; then
              echo "Unauthorized GitHub Pages deployment authority: $f" >&2
              exit 1
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print)
      - name: Validate Discord transport policy follows platform standard
        run: |
          node services/neo-discord/deployment/evaluate-policy.mjs
          node services/neo-discord/tests/runtime-policy.test.mjs
      - name: Guard GitHub Pages from privileged secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'DISCORD_BOT_TOKEN|DISCORD_PUBLIC_KEY|GITHUB_API_TOKEN|OPENAI_API_KEY|CLOUDFLARE_API_TOKEN|PRIVATE_KEY' apps/*/site 2>/dev/null; then
            echo 'Privileged secret reference found in a GitHub Pages site tree.' >&2
            exit 1
          fi
      - name: Reject standalone Cloudflare service deploy authority
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/workflows/*cloudflare.yml; do
            [ -e "$f" ] || continue
            if grep -Eq 'wrangler[^[:space:]]*([[:space:]]+|@latest[[:space:]]+)deploy|cloudflare/wrangler-action|CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|workers\.dev' "$f"; then
              echo "Standalone Cloudflare NEO service deployment prohibited: $f" >&2
              exit 1
            fi
          done
      - name: Verify Discord bridge is transport-only
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/deploy-neo-discord.yml
          grep -q 'services/neo-discord/adapters/cloudflare' .github/workflows/deploy-neo-discord.yml
          node - <<'NODE'
          const i=require('./architecture/neo-services-normalization.json')
          const bridge=i.allowedTransportBridges.find(x=>x.workflow==='.github/workflows/deploy-neo-discord.yml')
          if(!bridge||bridge.role!=='thin-discord-https-bridge') process.exit(1)
          if(bridge.mayOwnNeoBusinessLogic!==false||bridge.mayBecomeNeoBackend!==false) process.exit(1)
          NODE
      - name: Guard transport adapters from NEO business ownership
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./services/neo-discord/deployment/runtime-policy.json')
          for (const [name,b] of Object.entries(p.transportBridges)) {
            if (typeof b==='object' && b.ownsBusinessLogic!==false) throw new Error(`${name} claims NEO business logic`)
          }
          NODE
