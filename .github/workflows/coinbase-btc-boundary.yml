name: NEO Coinbase BTC-only boundary
on:
  pull_request:
    paths:
      - 'integrations/coinbase/**'
      - '.github/workflows/coinbase-btc-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test integrations/coinbase/boundary.test.mjs
