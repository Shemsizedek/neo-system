name: NeoCast 002 Original Pilot Safety and Offline HLS

on:
  pull_request:
    paths:
      - 'services/neocast/**'
      - 'docs/neocast/**'
      - '.github/workflows/neocast-002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-pilot-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate pilot source syntax
        run: |
          node --check services/neocast/original-pilot.mjs
          node --check services/neocast/discovery.mjs
      - name: Unit policy validation and capacity model
        run: node --test services/neocast/tests/*.test.mjs
      - name: Record fail-closed pilot status
        run: |
          node services/neocast/original-pilot.mjs > /tmp/neocast-002-preflight.json
          node -e "const p=require('/tmp/neocast-002-preflight.json');if(p.pilotId!=='world-temple-education-001'||!p.policyConsistent||p.preflightStatus!=='DRAFT_ACCEPTED'||p.publicBroadcastAuthorized||p.actualOnNetworkAcceptanceVerified||p.operationalProofChecked||p.expectedPublicListener||!p.contentAndRightsGaps?.length)process.exit(1)"
      - name: Ensure free/open-source FFmpeg is available on ephemeral CI runner
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
      - name: Offline synthetic HLS encoding smoke
        run: bash services/neocast/scripts/local-hls-smoke.sh
      - name: Production boundary
        run: echo "No actual NEO-owned stream, content recording, ingest, CDN, public URL, budget, DNS, host or paid account is activated."
