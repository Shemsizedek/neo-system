name: NEO Bots Tests

on:
  pull_request:
    paths:
      - 'server/neo-bots/**'
      - 'package.json'
      - '.github/workflows/neo-bots-tests.yml'
  push:
    branches:
      - main
      - feat/neo-bots-runtime
    paths:
      - 'server/neo-bots/**'
      - 'package.json'
      - '.github/workflows/neo-bots-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 NEO Bots suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run NEO Bots tests
        run: npm run neo-bots:test
