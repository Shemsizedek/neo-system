name: Deploy NEO Prime Runtime to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-prime/**'
      - 'server/neo-router/**'
      - 'core/neo-algo/**'
      - '.github/workflows/deploy-neo-prime-cloud-run.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-prime-cloud-run
  cancel-in-progress: false

env:
  SERVICE_NAME: neo-prime-runtime

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
      NEO_PRIME_OPERATOR_TOKEN: ${{ secrets.NEO_PRIME_OPERATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate GCP deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done

      - name: Test NEO Prime runtime
        run: node --test server/neo-prime/*.test.mjs server/neo-router/providers.test.mjs server/neo-router/vertex-provider.test.mjs

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Use preconfigured Vertex AI project access
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment CI is intentionally non-admin."
          echo "Vertex AI API enablement and roles/aiplatform.user are treated as project-level prerequisites."

      - name: Sync optional Prime secrets to Secret Manager
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          mappings=(
            'OPENAI_API_KEY:neo-prime-openai-api-key'
            'GEMINI_API_KEY:neo-prime-gemini-api-key'
            'ANTHROPIC_API_KEY:neo-prime-anthropic-api-key'
            'XAI_API_KEY:neo-prime-xai-api-key'
            'LLAMA_API_KEY:neo-prime-llama-api-key'
            'NEO_PRIME_OPERATOR_TOKEN:neo-prime-operator-token'
          )
          secret_args=()
          for mapping in "${mappings[@]}"; do
            env_name="${mapping%%:*}"; secret_name="${mapping#*:}"; value="${!env_name:-}"
            [[ -n "$value" ]] || continue
            gcloud secrets describe "$secret_name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1 || gcloud secrets create "$secret_name" --project="$GCP_PROJECT_ID" --replication-policy=automatic
            printf '%s' "$value" | gcloud secrets versions add "$secret_name" --project="$GCP_PROJECT_ID" --data-file=-
            gcloud secrets add-iam-policy-binding "$secret_name" --project="$GCP_PROJECT_ID" --member="serviceAccount:$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" --role='roles/secretmanager.secretAccessor' --condition=None --quiet >/dev/null
            secret_args+=("$env_name=$secret_name:latest")
          done
          (IFS=,; echo "set_secrets=${secret_args[*]}" >> "$GITHUB_OUTPUT")

      - name: Build and push Prime runtime image
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-prime-runtime:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f server/neo-prime/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-prime-runtime:${{ github.sha }}
          SET_SECRETS: ${{ steps.secrets.outputs.set_secrets }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            gcloud run deploy "$SERVICE_NAME"
            --project="$GCP_PROJECT_ID"
            --region="$GCP_REGION"
            --image="$IMAGE"
            --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT"
            --set-env-vars="NEO_PRIME_ALLOWED_ORIGINS=https://shemsizedek.github.io,GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,GOOGLE_CLOUD_LOCATION=$GCP_REGION,VERTEX_GEMINI_MODEL=gemini-2.5-flash"
            --allow-unauthenticated
            --quiet
          )
          [[ -z "$SET_SECRETS" ]] || args+=(--set-secrets="$SET_SECRETS")
          "${args[@]}"

      - name: Verify production runtime and Vertex execution
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$URL"

          health_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/healthz")"
          test "$health_code" = 200
          grep -q '"gemini"' /tmp/health.json

          prime_code="$(curl -sS -o /tmp/prime.json -w '%{http_code}' \
            -X POST "$URL/api/prime" \
            -H 'content-type: application/json' \
            --data '{"missionId":"deploy-smoke","objective":"Reply with a short confirmation that NEO Prime reasoning is online.","capability":"frontend","requestedAction":"analyze","preferredProviders":["gemini"],"maxTokens":64}')"
          test "$prime_code" = 200
          grep -q '"status":"completed"' /tmp/prime.json
          grep -q '"route":"gemini"' /tmp/prime.json

          echo "### NEO Prime Runtime LIVE" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime: $URL/api/prime" >> "$GITHUB_STEP_SUMMARY"
          echo "Health:" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/health.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Vertex smoke test:" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/prime.json >> "$GITHUB_STEP_SUMMARY"
