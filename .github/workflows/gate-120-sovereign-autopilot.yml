name: Gate 120 Sovereign Infrastructure Autopilot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['architecture/neo-infrastructure-autopilot-policy.json','server/neo-autopilot/**','package.json','.github/workflows/gate-120-sovereign-autopilot.yml']
permissions: {contents: read}
jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run neo-autopilot:test
      - run: node --check server/neo-autopilot/server.mjs
