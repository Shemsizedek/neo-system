name: Audit Noogle NEO Pass Runtime Binding
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: holytemples-production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect runtime secret references (no secret values)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe neo-edge --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/edge.json
          if gcloud run services describe neo-platform-api --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/platform.json 2>/dev/null && test -s /tmp/platform.json; then
            echo 'Platform service describe: available'
          else
            rm -f /tmp/platform.json
            echo 'Platform service describe: unavailable or not found'
          fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const edge=JSON.parse(fs.readFileSync('/tmp/edge.json','utf8'));
          const containers=edge.spec?.template?.spec?.containers||[];
          const env=containers.flatMap(c=>c.env||[]);
          const match=env.find(x=>x.name==='NEO_PASS_JWT_SECRET');
          const ref=match?.valueFrom?.secretKeyRef;
          console.log('NEO Edge NEO_PASS_JWT_SECRET bound:',Boolean(ref));
          console.log('NEO Edge reference uses Secret Manager:',Boolean(ref?.name));
          console.log('NEO Edge raw literal secret configuration:',Boolean(match?.value));
          console.log('NEO Edge latest ready revision:',edge.status?.latestReadyRevisionName||'unknown');
          if(fs.existsSync('/tmp/platform.json') && fs.statSync('/tmp/platform.json').size > 0) {
            const platform=JSON.parse(fs.readFileSync('/tmp/platform.json','utf8'));
            const platformEnv=(platform.spec?.template?.spec?.containers||[]).flatMap(c=>c.env||[]);
            console.log('Platform NEO_PASS_JWT_SECRET bound:',platformEnv.some(x=>x.name==='NEO_PASS_JWT_SECRET'&&Boolean(x.valueFrom?.secretKeyRef)));
          } else {
            console.log('Platform service configuration: not accessible or not found');
          }
          console.log('No credential values were requested or printed; no resources changed');
          JS
          code="$(curl -sS --max-time 12 -o /tmp/noogle-session-response -w '%{http_code}' -H 'Accept: application/json' 'https://noogle.holytemples.org/connect/session' || true)"
          echo "Public Noogle anonymous session HTTP status: $code"
          if [ "$code" = 000 ]; then echo "::error::Anonymous endpoint request failed; cannot certify"; exit 1; fi
          if [ "$code" = 200 ]; then echo "::error::Anonymous session endpoint unexpectedly returned 200"; exit 1; fi
