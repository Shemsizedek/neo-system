name: House of Negus Service Account Site Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/house-of-negus-site-verification.yml"
      - "scripts/google-siteverify-merchant-claim.mjs"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-claim:
    runs-on: ubuntu-latest
    environment: holytemples-production
    env:
      GOOGLE_SITEVERIFY_DOMAIN: "holytemples.org"
      GOOGLE_MERCHANT_ACCOUNT_ID: "5429352076"
      GOOGLE_MERCHANT_HOMEPAGE_URI: "https://shop.holytemples.org"
      GOOGLE_MERCHANT_APPLY: "CONFIRM_VERIFY_SERVICE_ACCOUNT_AND_CLAIM_SHOP"
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        id: verify-auth
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/siteverification
            https://www.googleapis.com/auth/content
      - uses: google-github-actions/setup-gcloud@v3
      - name: Enable Site Verification API
        run: gcloud services enable siteverification.googleapis.com --project="$GCP_PROJECT_ID" --quiet
      - name: Verify service-account ownership and claim Merchant homepage
        env:
          GOOGLE_SITEVERIFY_ACCESS_TOKEN: ${{ steps.verify-auth.outputs.access_token }}
        run: node scripts/google-siteverify-merchant-claim.mjs
