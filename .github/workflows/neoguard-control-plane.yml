name: NEO Guardian Control Plane CI

on:
  pull_request:
    paths:
      - 'server/neoguard-control-plane/**'
      - '.github/workflows/neoguard-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'server/neoguard-control-plane/**'
      - '.github/workflows/neoguard-control-plane.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test server/neoguard-control-plane/*.test.mjs
      - run: docker build -f server/neoguard-control-plane/Dockerfile -t neoguard-control-plane:${{ github.sha }} .
