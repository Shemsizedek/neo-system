name: Deploy NEO Relations to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/neo-relations/site/**'
      - '.github/workflows/deploy-neo-relations-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neo-relations-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/neo-relations/site
      - name: Deploy NEO Relations
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Discord control plane
        if: ${{ success() && secrets.DISCORD_RELATIONS_WEBHOOK_URL != '' }}
        env:
          DISCORD_RELATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_RELATIONS_WEBHOOK_URL }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({"content": f"NEO Relations deployed to GitHub Pages: {os.environ['PAGE_URL']}"}))
          PY
          )
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$DISCORD_RELATIONS_WEBHOOK_URL"
