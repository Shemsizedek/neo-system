name: NEO Relations Pages Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/neo-relations/site/**'
      - '.github/workflows/deploy-neo-relations-pages.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NEO Relations static bundle
        run: |
          test -f apps/neo-relations/site/index.html
          test -f apps/neo-relations/site/styles.css
          test -f apps/neo-relations/site/app.js
          echo "NEO Relations validated. Canonical deployment is owned by pages.yml at /neo-relations/." >> "$GITHUB_STEP_SUMMARY"
