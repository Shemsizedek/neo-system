name: NEO Router Gemini Live Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_MODEL: gemini-3.7-flash
      NEO_ROUTER_PROVIDER_TIMEOUT_MS: '30000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Gemini secret is configured
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY GitHub Actions secret is not configured."
            exit 2
          fi

      - name: Run credential-safe Gemini readiness probe
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: npm run router:gemini:check
