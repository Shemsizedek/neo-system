name: Gate 131 Institutional Risk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['architecture/neo-institutional-risk-policy.json','server/neo-risk/**','docs/NEO-G131-INSTITUTIONAL-RISK.md','package.json','.github/workflows/gate-131-institutional-risk.yml']
  pull_request:
    paths: ['architecture/neo-institutional-risk-policy.json','server/neo-risk/**','docs/NEO-G131-INSTITUTIONAL-RISK.md','package.json','.github/workflows/gate-131-institutional-risk.yml']
permissions: {contents: read}
jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run neo-risk:test
      - run: node --check server/neo-risk/server.mjs
