name: NEOscan Statements Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/neoscan-statements/**'
      - 'apps/neoscan/server/**'
      - 'apps/neoscan/adapters/ces/**'
      - '.github/workflows/neoscan-statements-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/neoscan-statements
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy NEOscan Statements Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
