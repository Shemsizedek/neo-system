name: Counterparty mainnet read-only readiness
on:
  pull_request:
    paths:
      - 'src/explorer/counterpartyHealthAdapter.ts'
      - 'src/explorer/CounterpartyHealthPanel.tsx'
      - 'src/explorer/NeoExplorer.tsx'
      - 'tests/counterpartyHealthAdapter.test.mjs'
      - '.github/workflows/counterparty-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/counterpartyHealthAdapter.test.mjs
      - run: npm ci
      - run: npm run build
  live-readonly-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail --silent --show-error --max-time 15 \
            --retry 2 --retry-delay 2 \
            https://api.counterparty.io:4000/v2/ \
            -H 'Accept: application/json' \
            -o counterparty-health.json
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("counterparty-health.json","utf8"));if(!p.result || p.result.network!=="mainnet")process.exit(1);console.log("Counterparty mainnet response shape received")'
