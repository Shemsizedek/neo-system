name: NEO Energy NES-030 dashboard boundary tests
on:
  pull_request:
    paths:
      - 'neo-energy/NES-030/**'
      - '.github/workflows/neo-energy-nes030-tests.yml'
  workflow_dispatch:
jobs:
  dashboard-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test neo-energy/NES-030/test-dashboard-client.mjs
