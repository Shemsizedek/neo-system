name: Verify World Court DNS Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-world-court-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOMAIN: court.holytemples.org
  TARGET_IP: 35.253.233.133

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public DNS readiness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null

          echo "Expected production record: $DOMAIN -> $TARGET_IP"
          echo '=== authoritative delegation ==='
          dig +short NS holytemples.org || true
          dig +short SOA holytemples.org || true
          echo '=== current court record ==='
          ANSWERS="$(dig +short A "$DOMAIN" | sort -u || true)"
          printf '%s\n' "${ANSWERS:-unresolved}"

          if grep -qx "$TARGET_IP" <<<"$ANSWERS"; then
            echo "World Court DNS is ready: $DOMAIN -> $TARGET_IP"
            echo "WORLD_COURT_DNS_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::World Court DNS is not yet pointed at $TARGET_IP. No provider-specific DNS mutation was attempted."
            echo "WORLD_COURT_DNS_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Publish DNS readiness
        run: |
          {
            echo '## World Court DNS readiness'
            echo "- Host: $DOMAIN"
            echo "- Target IPv4: $TARGET_IP"
            echo "- Ready: $WORLD_COURT_DNS_READY"
            echo '- DNS mutation: disabled in GitHub until the authoritative provider is explicitly integrated.'
          } >> "$GITHUB_STEP_SUMMARY"
