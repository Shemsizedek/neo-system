name: Cut Over World Court DNS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-world-court-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOT_DOMAIN: holytemples.org
  DOMAIN: court.holytemples.org
  TARGET_IP: 35.253.233.133

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Update authoritative DNS
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          cf() {
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$@"
          }

          ZONE_JSON="$(cf "https://api.cloudflare.com/client/v4/zones?name=$ROOT_DOMAIN&status=active")"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONE_JSON")"
          if [[ -z "$ZONE_ID" ]]; then
            echo "::error::Unable to resolve active Cloudflare zone for $ROOT_DOMAIN"
            jq -c '{success,errors}' <<<"$ZONE_JSON" || true
            exit 1
          fi

          RECORDS_JSON="$(cf "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$DOMAIN&per_page=100")"
          mapfile -t RECORD_IDS < <(jq -r '.result[].id' <<<"$RECORDS_JSON")
          PAYLOAD="$(jq -nc --arg name "$DOMAIN" --arg content "$TARGET_IP" '{type:"A",name:$name,content:$content,ttl:300,proxied:false}')"

          if (( ${#RECORD_IDS[@]} == 0 )); then
            RESULT="$(cf -X POST --data "$PAYLOAD" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")"
          else
            RESULT="$(cf -X PUT --data "$PAYLOAD" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/${RECORD_IDS[0]}")"
            if (( ${#RECORD_IDS[@]} > 1 )); then
              for record_id in "${RECORD_IDS[@]:1}"; do
                cf -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$record_id" >/dev/null
              done
            fi
          fi

          [[ "$(jq -r '.success' <<<"$RESULT")" == "true" ]] || { jq -c '{success,errors}' <<<"$RESULT"; exit 1; }
          echo "Authoritative DNS set: $DOMAIN -> $TARGET_IP"

      - name: Verify public DNS convergence
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ANSWERS="$(getent ahostsv4 "$DOMAIN" | awk '{print $1}' | sort -u || true)"
            echo "Attempt $i: ${ANSWERS:-unresolved}"
            if grep -qx "$TARGET_IP" <<<"$ANSWERS"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public DNS did not converge to $TARGET_IP within five minutes"
          exit 1
