name: Omnitrix APK
# Production APK build + GitHub Release distribution

on:
  push:
    branches: [main]
    paths:
      - 'apps/omnitrix-android/**'
      - 'apps/noogle/web/**'
      - '.github/workflows/omnitrix-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p apps/omnitrix-android :app:assembleDebug --stacktrace
      - name: Prepare consumer APK
        run: |
          mkdir -p release
          cp apps/omnitrix-android/app/build/outputs/apk/debug/app-debug.apk release/Omnitrix.apk
          sha256sum release/Omnitrix.apk > release/Omnitrix.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Omnitrix
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete omnitrix-latest --cleanup-tag --yes || true
          gh release create omnitrix-latest \
            release/Omnitrix.apk \
            release/Omnitrix.apk.sha256 \
            --title "Omnitrix Latest" \
            --notes "Production Omnitrix Android APK. Built automatically from ${GITHUB_SHA}."
