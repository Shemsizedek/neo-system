name: Omnitrix APK
# Production APK build + stable public download publishing

on:
  push:
    branches: [main]
    paths:
      - 'apps/omnitrix-android/**'
      - 'apps/noogle/web/**'
      - '.github/workflows/omnitrix-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p apps/omnitrix-android :app:assembleDebug --stacktrace
      - name: Prepare consumer APK
        run: |
          mkdir -p release
          cp apps/omnitrix-android/app/build/outputs/apk/debug/app-debug.apk release/Omnitrix.apk
          sha256sum release/Omnitrix.apk > release/Omnitrix.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Omnitrix
          path: release/*
          if-no-files-found: error
      - name: Publish stable public APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf publish
          mkdir publish
          cp release/Omnitrix.apk publish/Omnitrix.apk
          cp release/Omnitrix.apk.sha256 publish/Omnitrix.apk.sha256
          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Omnitrix.apk Omnitrix.apk.sha256
          git commit -m "publish Omnitrix APK from ${GITHUB_SHA}"
          git branch -M omnitrix-downloads
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin omnitrix-downloads
