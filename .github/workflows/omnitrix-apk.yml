name: Omnitrix APK
# v3.7.0 NEO account E2EE + trusted device recovery gate

on:
  push:
    branches: [main]
    paths:
      - 'apps/omnitrix-android/**'
      - 'apps/noogle/web/**'
      - '.github/workflows/omnitrix-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p apps/omnitrix-android :app:assembleDebug --stacktrace
      - name: Prepare consumer APK
        run: |
          mkdir -p release
          cp apps/omnitrix-android/app/build/outputs/apk/debug/app-debug.apk release/Omnitrix-Suit-v3.7.0.apk
          sha256sum release/Omnitrix-Suit-v3.7.0.apk > release/Omnitrix-Suit-v3.7.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Omnitrix-Suit-APK-v3.7.0
          path: release/*
          if-no-files-found: error
