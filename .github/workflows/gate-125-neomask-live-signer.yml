name: Gate 125 NeoMask Live Signer and Guardian
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['architecture/neomask-live-signer-guardian-policy.json','server/neomask-signer/**','apps/neomask-extension/signer-bridge.js','packages/neomask-sdk/security.js','docs/NEO-G125-LIVE-SIGNER-GUARDIAN.md','package.json','.github/workflows/gate-125-neomask-live-signer.yml']
  pull_request:
    paths: ['architecture/neomask-live-signer-guardian-policy.json','server/neomask-signer/**','apps/neomask-extension/signer-bridge.js','packages/neomask-sdk/security.js','docs/NEO-G125-LIVE-SIGNER-GUARDIAN.md','package.json','.github/workflows/gate-125-neomask-live-signer.yml']
permissions: {contents: read}
jobs:
  signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run neomask-signer:test
      - run: |
          node --check server/neomask-signer/server.mjs
          node --check apps/neomask-extension/signer-bridge.js
          node --check packages/neomask-sdk/security.js
