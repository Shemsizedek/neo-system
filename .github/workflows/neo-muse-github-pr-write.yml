name: NEO Muse GitHub PR Writer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  muse-propose:
    # The owner must explicitly request a write task on a regular issue.
    # Never run on comments from outside contributors or on pull requests.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'Shemsizedek' &&
      startsWith(github.event.comment.body, '/oc ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require configured Meta Model API secret
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "MODEL_API_KEY repository secret is not configured."
            exit 2
          fi

      - name: Run owner-gated Meta Muse PR agent
        uses: anomalyco/opencode/github@latest
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: model_api/muse-spark-1.3
          agent: neo-muse-writer
          use_github_token: true
