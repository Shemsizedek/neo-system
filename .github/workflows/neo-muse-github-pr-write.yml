name: NEO Muse GitHub PR Writer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  muse-propose:
    # Only the repository owner can deliberately invoke this from a regular issue.
    # For this token-authenticated mode id-token: write is unnecessary.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'Shemsizedek' &&
      startsWith(github.event.comment.body, '/oc ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # In use_github_token mode, Git operations may use this job-scoped token.
          persist-credentials: true

      - name: Configure bot git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Require configured Meta Model API secret
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "MODEL_API_KEY repository secret is not configured."
            exit 2
          fi

      - name: Verify main-branch write protections before granting Muse execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/neo-muse-branch-guard.mjs

      - name: Run owner-gated Meta Muse PR agent
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: model_api/muse-spark-1.3
          agent: neo-muse-writer
          use_github_token: true
