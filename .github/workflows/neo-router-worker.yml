name: NEO Router Worker v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/neo-router-worker.mjs'
      - 'server/neo-router/**'
      - 'data/router/**'
      - '.github/workflows/neo-router-worker.yml'
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: write

concurrency:
  group: neo-router-worker-v4
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    env:
      NEO_ROUTER_STORAGE: github
      NEO_ROUTER_STATE_FILE: data/router/state.json
      NEO_ROUTER_WORKER_ID: github-actions-worker-v4
      NEO_ROUTER_WORKER_CONCURRENCY: "2"
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEO_ROUTER_STATE_KEY: ${{ secrets.NEO_ROUTER_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Execute governed mission tick
        run: npm run router:worker
      - name: Persist GitHub router state
        run: |
          if git diff --quiet -- data/router/state.json; then
            echo "Router state unchanged."
            exit 0
          fi
          git config user.name "neo-router-bot"
          git config user.email "neo-router-bot@users.noreply.github.com"
          git add data/router/state.json
          git commit -m "chore(router): persist GitHub worker state [skip ci]"
          git push origin HEAD:main
