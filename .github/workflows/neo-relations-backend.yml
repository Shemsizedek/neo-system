name: NEO Relations GitHub Backend

on:
  pull_request:
    paths:
      - 'apps/neo-relations/**'
      - 'cloudflare/neo-discord/commands/relations.json'
      - 'cloudflare/neo-discord/src/relations.js'
      - '.github/workflows/neo-relations-backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/neo-relations/**'
      - 'cloudflare/neo-discord/commands/relations.json'
      - 'cloudflare/neo-discord/src/relations.js'
      - '.github/workflows/neo-relations-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate canonical Relations backend assets
        run: |
          test -s apps/neo-relations/contracts/control-plane.json
          test -s apps/neo-relations/openapi.yaml
          test -s apps/neo-relations/tenants/neo-prime.json
          test -s apps/neo-relations/tenants/neopay.json
          test -s apps/neo-relations/site/data/status.json
          test -s cloudflare/neo-discord/commands/relations.json
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('apps/neo-relations/contracts/control-plane.json','utf8')); if(c.frontend.primary!=='github-pages'||c.backend.sourceOfTruth!=='github'||c.apiPlane.primary!=='discord'||c.security.executionWorker!==false) process.exit(1)"
      - name: Verify GitHub Pages contains no privileged runtime secrets
        run: |
          ! grep -R -E 'DATABASE_URL|RELATIONS_JWT_SECRET|DISCORD_BOT_TOKEN|GITHUB_API_TOKEN|VERCEL_TOKEN' apps/neo-relations/site || (echo 'Privileged secret reference found in Pages assets' && exit 1)
      - name: Validate Discord command manifest
        run: node -e "JSON.parse(require('fs').readFileSync('cloudflare/neo-discord/commands/relations.json','utf8'))"

  backend-summary:
    runs-on: ubuntu-latest
    needs: validate-control-plane
    steps:
      - uses: actions/checkout@v4
      - name: Publish backend architecture summary
        run: |
          mkdir -p /tmp/neo-relations-backend
          cp apps/neo-relations/contracts/control-plane.json /tmp/neo-relations-backend/control-plane.json
          cp apps/neo-relations/site/data/status.json /tmp/neo-relations-backend/status.json
      - uses: actions/upload-artifact@v4
        with:
          name: neo-relations-backend-snapshot
          path: /tmp/neo-relations-backend
          retention-days: 14
