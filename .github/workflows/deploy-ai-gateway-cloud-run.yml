name: Deploy NEO AI Gateway to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-ai-gateway-cloud-run
  cancel-in-progress: false

env:
  SERVICE_NAME: neo-ai-gateway
  MODEL_API_KEY_SECRET_NAME: neo-ai-gateway-model-api-key
  META_MUSE_MODEL: muse-spark-1.3
  META_MODEL_BASE_URL: https://api.meta.ai/v1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate deployment configuration
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY MODEL_API_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done

      - name: Test NEO AI gateway and router
        run: node --test server/neo-router/ai-gateway-server.test.mjs server/neo-router/router.test.mjs server/neo-router/providers.test.mjs

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Sync Muse credential to Google Secret Manager
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets describe "$MODEL_API_KEY_SECRET_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1 || \
            gcloud secrets create "$MODEL_API_KEY_SECRET_NAME" --project="$GCP_PROJECT_ID" --replication-policy="automatic"
          printf '%s' "$MODEL_API_KEY" | gcloud secrets versions add "$MODEL_API_KEY_SECRET_NAME" --project="$GCP_PROJECT_ID" --data-file=-

      - name: Grant runtime service account secret access
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets add-iam-policy-binding "$MODEL_API_KEY_SECRET_NAME" \
            --project="$GCP_PROJECT_ID" \
            --member="serviceAccount:$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
            --role="roles/secretmanager.secretAccessor" \
            --condition=None \
            --quiet 2>/dev/null || true

      - name: Build and push AI gateway image
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-ai-gateway:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f server/neo-router/Dockerfile.ai-gateway -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-ai-gateway:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
            --set-env-vars="META_MUSE_MODEL=$META_MUSE_MODEL,META_MODEL_BASE_URL=$META_MODEL_BASE_URL" \
            --set-secrets="MODEL_API_KEY=$MODEL_API_KEY_SECRET_NAME:latest" \
            --allow-unauthenticated \
            --quiet

      - name: Verify Cloud Run health and Muse configuration
        id: service
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$URL"
          CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/health")"
          test "$CODE" = 200
          grep -q '"meta-muse"' /tmp/health.json
          grep -q '"configured":true' /tmp/health.json
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### NEO AI Gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud Run service: $URL" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/health.json >> "$GITHUB_STEP_SUMMARY"
