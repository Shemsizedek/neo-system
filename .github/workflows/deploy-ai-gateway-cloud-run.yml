name: Deploy NEO AI Gateway to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/muse-neo-005.activate'

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-ai-gateway-cloud-run
  cancel-in-progress: false

env:
  SERVICE_NAME: neo-ai-gateway
  MODEL_API_KEY_SECRET_NAME: neo-ai-gateway-model-api-key
  NEOPASS_SECRET_NAME: neo-pass-jwt-secret
  META_MUSE_MODEL: muse-spark-1.3
  META_MUSE_REASONING_EFFORT: low
  META_MODEL_BASE_URL: https://api.meta.ai/v1
  NEO_ROUTER_PROVIDER_TIMEOUT_MS: '60000'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
      NEO_PASS_JWT_ISSUER: ${{ vars.NEO_PASS_JWT_ISSUER }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate deployment configuration
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY MODEL_API_KEY NEO_PASS_JWT_SECRET; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done

      - name: Test NEO AI gateway and router
        run: node --test server/neo-router/ai-gateway-server.test.mjs server/neo-router/router.test.mjs server/neo-router/providers.test.mjs server/neo-router/conversation-store.test.mjs server/neo-router/provider-telemetry-store.test.mjs server/neo-router/knowledge-context.test.mjs server/neo-router/muse-handoff.test.mjs server/neo-router/muse-brief.test.mjs server/neo-router/muse-project-store.test.mjs

      - name: Verify live Meta Muse credential before deploy
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: npm run router:muse:check

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate pre-provisioned Neopass secret
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets describe "$NEOPASS_SECRET_NAME" --project="$GCP_PROJECT_ID" >/dev/null || {
            echo "::error::Secret $NEOPASS_SECRET_NAME is not provisioned."
            exit 1
          }

      - name: Sync Muse credential to Google Secret Manager
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets describe "$MODEL_API_KEY_SECRET_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1 || \
            gcloud secrets create "$MODEL_API_KEY_SECRET_NAME" --project="$GCP_PROJECT_ID" --replication-policy="automatic"
          printf '%s' "$MODEL_API_KEY" | gcloud secrets versions add "$MODEL_API_KEY_SECRET_NAME" --project="$GCP_PROJECT_ID" --data-file=-

      - name: Grant runtime service account secret access
        shell: bash
        run: |
          set -euo pipefail
          for secret in "$MODEL_API_KEY_SECRET_NAME" "$NEOPASS_SECRET_NAME"; do
            gcloud secrets add-iam-policy-binding "$secret" \
              --project="$GCP_PROJECT_ID" \
              --member="serviceAccount:$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
              --role="roles/secretmanager.secretAccessor" \
              --condition=None \
              --quiet 2>/dev/null || true
          done

      - name: Build and push AI gateway image
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-ai-gateway:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f server/neo-router/Dockerfile.ai-gateway -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-ai-gateway:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ENV_VARS="META_MUSE_MODEL=$META_MUSE_MODEL,META_MUSE_REASONING_EFFORT=$META_MUSE_REASONING_EFFORT,META_MODEL_BASE_URL=$META_MODEL_BASE_URL,NEO_ROUTER_PROVIDER_TIMEOUT_MS=$NEO_ROUTER_PROVIDER_TIMEOUT_MS,GCP_PROJECT_ID=$GCP_PROJECT_ID,FIRESTORE_DATABASE_ID=(default)"
          if [ -n "${NEO_PASS_JWT_ISSUER:-}" ]; then ENV_VARS="$ENV_VARS,NEO_PASS_JWT_ISSUER=$NEO_PASS_JWT_ISSUER"; fi
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
            --set-env-vars="$ENV_VARS" \
            --set-secrets="MODEL_API_KEY=$MODEL_API_KEY_SECRET_NAME:latest,NEO_PASS_JWT_SECRET=$NEOPASS_SECRET_NAME:latest" \
            --allow-unauthenticated \
            --quiet

      - name: Verify Cloud Run health and Muse configuration
        id: service
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$URL"
          CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/health")"
          test "$CODE" = 200
          grep -q '"meta-muse"' /tmp/health.json
          grep -q '"configured":true' /tmp/health.json
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### NEO AI Gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud Run service: $URL" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/health.json >> "$GITHUB_STEP_SUMMARY"

      - name: Run first authenticated NEO personalization mission
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEO_PASS_JWT_SECRET:-}" || { echo "::error::Missing NEO_PASS_JWT_SECRET"; exit 1; }
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          TOKEN="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            const enc = value => Buffer.from(JSON.stringify(value)).toString("base64url");
            const now = Math.floor(Date.now()/1000);
            const header = enc({alg:"HS256",typ:"JWT"});
            const payloadObj = {sub:"neo-muse-smoke",iat:now,exp:now+300};
            if (process.env.NEO_PASS_JWT_ISSUER) payloadObj.iss = process.env.NEO_PASS_JWT_ISSUER;
            const payload = enc(payloadObj);
            const sig = createHmac("sha256", process.env.NEO_PASS_JWT_SECRET).update(header+"."+payload).digest("base64url");
            process.stdout.write(header+"."+payload+"."+sig);
          ')"
          cat >/tmp/mission.json <<'JSON'
          {
            "missionId":"MUSE-NEO-006-SMOKE",
            "objective":"Create a concise NEO System readiness statement that distinguishes verified capability from future plans.",
            "capability":"personalization",
            "perspectiveContext":"Use the NEO / Shemsizedek perspective profile, preserve provenance, and keep the statement factual.",
            "maxTokens":2048
          }
          JSON
          CODE="$(curl -sS -o /tmp/mission-response.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/mission.json \
            "$URL/api/ai/execute")"
          test "$CODE" = 200
          node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/mission-response.json","utf8"));
            if(body.status!=="completed") throw new Error("mission_not_completed");
            if(body.route!=="meta-muse") throw new Error("mission_not_routed_to_muse");
            if(!body.result?.responseId) throw new Error("missing_muse_response_id");
            const text=String(body.result?.text||"").trim();
            if(!text) throw new Error("missing_visible_muse_output");
            console.log(JSON.stringify({status:body.status,route:body.route,responseIdPresent:true,textPresent:true}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n### First authenticated NEO personalization mission\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "- Status: completed\n- Route: meta-muse\n- Muse response ID: present\n");
            if(text) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "- Output: "+text.replace(/\n/g," ")+"\n");
          '

      - name: Run session-continuity follow-up mission
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          TOKEN="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            const enc = value => Buffer.from(JSON.stringify(value)).toString("base64url");
            const now = Math.floor(Date.now()/1000);
            const header = enc({alg:"HS256",typ:"JWT"});
            const payloadObj = {sub:"neo-muse-session-smoke",iat:now,exp:now+300};
            if (process.env.NEO_PASS_JWT_ISSUER) payloadObj.iss = process.env.NEO_PASS_JWT_ISSUER;
            const payload = enc(payloadObj);
            const sig = createHmac("sha256", process.env.NEO_PASS_JWT_SECRET).update(header+"."+payload).digest("base64url");
            process.stdout.write(header+"."+payload+"."+sig);
          ')"
          FIRST_ID="$(node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/mission-response.json","utf8"));
            if(!body.result?.responseId) throw new Error("missing_first_response_id");
            process.stdout.write(body.result.responseId);
          ')"
          FIRST_ID="$FIRST_ID" node --input-type=module -e '
            import fs from "node:fs";
            fs.writeFileSync("/tmp/followup.json", JSON.stringify({
              missionId:"MUSE-NEO-007-SESSION",
              objective:"Continue from the prior response and summarize the same readiness statement in one sentence.",
              capability:"personalization",
              perspectiveContext:"Preserve the NEO / Shemsizedek perspective and the prior conversational context.",
              previousResponseId:process.env.FIRST_ID,
              maxTokens:2048
            }));
          '
          CODE="$(curl -sS -o /tmp/followup-response.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/followup.json \
            "$URL/api/ai/execute")"
          test "$CODE" = 200
          FIRST_ID="$FIRST_ID" node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/followup-response.json","utf8"));
            if(body.status!=="completed") throw new Error("followup_not_completed");
            if(body.route!=="meta-muse") throw new Error("followup_not_routed_to_muse");
            if(!body.result?.responseId) throw new Error("missing_followup_response_id");
            if(body.result.responseId===process.env.FIRST_ID) throw new Error("response_id_not_advanced");
            const text=String(body.result?.text||"").trim();
            if(!text) throw new Error("missing_followup_visible_output");
            console.log(JSON.stringify({status:body.status,route:body.route,sessionContinuity:true,textPresent:true}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n### Muse session continuity\n- Turn 2: completed\n- Route: meta-muse\n- Previous response ID: accepted\n- New response ID: present\n- Visible output: present\n");
          '

      - name: Verify persistent NEOsync conversation workspace
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          TOKEN="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            const enc=v=>Buffer.from(JSON.stringify(v)).toString("base64url");
            const now=Math.floor(Date.now()/1000);
            const h=enc({alg:"HS256",typ:"JWT"});
            const p=enc({sub:"neo-muse-thread-smoke",iat:now,exp:now+300});
            const s=createHmac("sha256",process.env.NEO_PASS_JWT_SECRET).update(h+"."+p).digest("base64url");
            process.stdout.write(h+"."+p+"."+s);
          ')"
          CREATE_CODE="$(curl -sS -o /tmp/thread.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"title":"MUSE-NEO-008 Production Thread","capability":"personalization"}' "$URL/api/ai/threads")"
          test "$CREATE_CODE" = 201
          THREAD_ID="$(node --input-type=module -e 'import fs from "node:fs";const b=JSON.parse(fs.readFileSync("/tmp/thread.json","utf8"));if(!b.thread?.id)throw new Error("thread_id_missing");process.stdout.write(b.thread.id)')"
          THREAD_ID="$THREAD_ID" node --input-type=module -e '
            import fs from "node:fs";
            fs.writeFileSync("/tmp/thread-mission.json",JSON.stringify({
              missionId:"MUSE-NEO-008-PERSIST",
              threadId:process.env.THREAD_ID,
              objective:"Record that the NEOsync persistent Muse workspace is operational.",
              capability:"personalization",
              perspectiveContext:"Keep this production verification concise and factual.",
              maxTokens:2048
            }));
          '
          EXEC_CODE="$(curl -sS -o /tmp/thread-exec.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/thread-mission.json "$URL/api/ai/execute")"
          test "$EXEC_CODE" = 200
          GET_CODE="$(curl -sS -o /tmp/thread-loaded.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/api/ai/threads/$THREAD_ID")"
          test "$GET_CODE" = 200
          node --input-type=module -e '
            import fs from "node:fs";
            const body=JSON.parse(fs.readFileSync("/tmp/thread-loaded.json","utf8"));
            const t=body.thread;
            if(!t?.lastResponseId) throw new Error("persistent_response_id_missing");
            if(!Array.isArray(t.messages)||t.messages.length<2) throw new Error("persistent_history_missing");
            if(!t.messages.some(m=>m.role==="user")) throw new Error("persistent_user_turn_missing");
            if(!t.messages.some(m=>m.role==="assistant")) throw new Error("persistent_assistant_turn_missing");
            console.log(JSON.stringify({threadIdPresent:true,historyPersisted:true,lastResponseIdPresent:true,messageCount:t.messages.length}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n### NEOsync persistent conversation workspace\n- Firestore thread: created\n- Muse turn: completed\n- History reload: passed\n- Last Muse response ID: persisted\n");
          '

      - name: Verify NEOsync workspace v2 lifecycle and durable telemetry
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          TOKEN="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            const enc=v=>Buffer.from(JSON.stringify(v)).toString("base64url");
            const now=Math.floor(Date.now()/1000),h=enc({alg:"HS256",typ:"JWT"}),p=enc({sub:"neo-muse-v2-smoke",iat:now,exp:now+300});
            process.stdout.write(h+"."+p+"."+createHmac("sha256",process.env.NEO_PASS_JWT_SECRET).update(h+"."+p).digest("base64url"));
          ')"
          P_CODE="$(curl -sS -o /tmp/providers-v2.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/api/ai/providers")"
          test "$P_CODE" = 200
          node --input-type=module -e '
            import fs from "node:fs";
            const b=JSON.parse(fs.readFileSync("/tmp/providers-v2.json","utf8"));
            if(b.telemetryPersistence!=="firestore") throw new Error("telemetry_not_durable");
            const muse=(b.providers||[]).find(p=>p.id==="meta-muse");
            if(!muse?.durableTelemetry) throw new Error("durable_muse_telemetry_missing");
          '
          C_CODE="$(curl -sS -o /tmp/thread-v2.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"title":"MUSE-NEO-009 Disposable Thread","capability":"personalization"}' "$URL/api/ai/threads")"
          test "$C_CODE" = 201
          THREAD_ID="$(node --input-type=module -e 'import fs from "node:fs";const b=JSON.parse(fs.readFileSync("/tmp/thread-v2.json","utf8"));process.stdout.write(b.thread.id)')"
          PATCH_CODE="$(curl -sS -o /tmp/thread-v2-patched.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"pinned":true,"archived":true}' "$URL/api/ai/threads/$THREAD_ID")"
          test "$PATCH_CODE" = 200
          EXPORT_CODE="$(curl -sS -o /tmp/thread-v2-export.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/api/ai/threads/$THREAD_ID/export")"
          test "$EXPORT_CODE" = 200
          DELETE_CODE="$(curl -sS -o /tmp/thread-v2-delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" "$URL/api/ai/threads/$THREAD_ID")"
          test "$DELETE_CODE" = 200
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("/tmp/thread-v2-patched.json","utf8")).thread;
            const e=JSON.parse(fs.readFileSync("/tmp/thread-v2-export.json","utf8"));
            const d=JSON.parse(fs.readFileSync("/tmp/thread-v2-delete.json","utf8"));
            if(!p?.pinned||!p?.archived) throw new Error("thread_lifecycle_patch_failed");
            if(e.exportVersion!=="neo-conversation-v1") throw new Error("thread_export_failed");
            if(d.deleted!==true) throw new Error("thread_delete_failed");
            console.log(JSON.stringify({durableTelemetry:true,pin:true,archive:true,export:true,delete:true}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n### NEOsync Workspace v2\n- Durable provider telemetry: Firestore\n- Pin/archive: passed\n- Export: passed\n- Delete: passed\n");
          '

      - name: Verify NEOsync knowledge context and provenance
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          TOKEN="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            const enc=v=>Buffer.from(JSON.stringify(v)).toString("base64url");
            const now=Math.floor(Date.now()/1000),h=enc({alg:"HS256",typ:"JWT"}),p=enc({sub:"neo-muse-knowledge-smoke",iat:now,exp:now+300});
            process.stdout.write(h+"."+p+"."+createHmac("sha256",process.env.NEO_PASS_JWT_SECRET).update(h+"."+p).digest("base64url"));
          ')"
          node --input-type=module -e '
            import fs from "node:fs";
            import { authorizedLibraryCatalog } from "./server/holytemples-adapter/adapter.mjs";
            const resource=authorizedLibraryCatalog({accessClass:"PUBLIC_WORLD_LIBRARY"})[0];
            if(!resource?.id) throw new Error("approved_library_resource_missing");
            fs.writeFileSync("/tmp/knowledge-resource.json",JSON.stringify(resource));
            fs.writeFileSync("/tmp/knowledge-thread.json",JSON.stringify({title:"MUSE-NEO-010 Knowledge Thread",capability:"personalization"}));
          '
          C_CODE="$(curl -sS -o /tmp/knowledge-thread-created.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/knowledge-thread.json "$URL/api/ai/threads")"
          test "$C_CODE" = 201
          THREAD_ID="$(node --input-type=module -e 'import fs from "node:fs";process.stdout.write(JSON.parse(fs.readFileSync("/tmp/knowledge-thread-created.json","utf8")).thread.id)')"
          THREAD_ID="$THREAD_ID" node --input-type=module -e '
            import fs from "node:fs";
            const resource=JSON.parse(fs.readFileSync("/tmp/knowledge-resource.json","utf8"));
            fs.writeFileSync("/tmp/knowledge-mission.json",JSON.stringify({
              missionId:"MUSE-NEO-010-KNOWLEDGE",
              threadId:process.env.THREAD_ID,
              objective:"Summarize the attached approved NEO Library record and identify it as internal context.",
              capability:"personalization",
              knowledgeAttachments:[resource.id],
              autoKnowledge:true,
              maxTokens:2048
            }));
          '
          M_CODE="$(curl -sS -o /tmp/knowledge-response.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/knowledge-mission.json "$URL/api/ai/execute")"
          test "$M_CODE" = 200
          node --input-type=module -e '
            import fs from "node:fs";
            const resource=JSON.parse(fs.readFileSync("/tmp/knowledge-resource.json","utf8"));
            const body=JSON.parse(fs.readFileSync("/tmp/knowledge-response.json","utf8"));
            if(body.status!=="completed") throw new Error("knowledge_mission_not_completed");
            if(body.route!=="meta-muse") throw new Error("knowledge_mission_not_muse");
            if(!body.knowledge?.provenance?.some(item=>item.id===resource.id)) throw new Error("attached_resource_provenance_missing");
            if(!body.knowledge?.algo?.provenance?.includes("NEO-ALGO-001")) throw new Error("neo_algo_provenance_missing");
            console.log(JSON.stringify({knowledgeContext:true,provenance:true,neoAlgo:true,sourceId:resource.id}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n### NEOsync Knowledge Context\n- Approved library attachment: passed\n- Provenance returned: passed\n- NEO Algo grounding: passed\n- Muse route: passed\n");
          '
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $TOKEN" "$URL/api/ai/threads/$THREAD_ID"

      - name: Verify Muse app handoff import boundary
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          TOKEN="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            const enc=v=>Buffer.from(JSON.stringify(v)).toString("base64url");
            const now=Math.floor(Date.now()/1000),h=enc({alg:"HS256",typ:"JWT"}),p=enc({sub:"neo-muse-handoff-smoke",iat:now,exp:now+300});
            process.stdout.write(h+"."+p+"."+createHmac("sha256",process.env.NEO_PASS_JWT_SECRET).update(h+"."+p).digest("base64url"));
          ')"
          H_CODE="$(curl -sS -o /tmp/handoff-created.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"title":"MUSE-NEO-012A Production Handoff","sourceType":"muse-app-copy","content":"Muse app handoff production context. Project codename: ORBIT."}' "$URL/api/ai/handoffs")"
          test "$H_CODE" = 201
          THREAD_ID="$(node --input-type=module -e '
            import fs from "node:fs";
            const b=JSON.parse(fs.readFileSync("/tmp/handoff-created.json","utf8"));
            if(!b.thread?.id)throw new Error("handoff_thread_missing");
            if(b.thread.lastResponseId!==null)throw new Error("handoff_incorrectly_linked_to_api_session");
            if(b.provenance?.sessionLinkage!=="content-handoff-only")throw new Error("handoff_linkage_marker_missing");
            if(!String(b.provenance?.contentHash||"").startsWith("sha256:"))throw new Error("handoff_hash_missing");
            process.stdout.write(b.thread.id);
          ')"
          THREAD_ID="$THREAD_ID" node --input-type=module -e '
            import fs from "node:fs";
            fs.writeFileSync("/tmp/handoff-mission.json",JSON.stringify({
              missionId:"MUSE-NEO-012A-HANDOFF",
              threadId:process.env.THREAD_ID,
              objective:"Continue this imported Muse work under NEO governance and acknowledge the imported context.",
              capability:"personalization",
              maxTokens:2048
            }));
          '
          M_CODE="$(curl -sS -o /tmp/handoff-response.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/handoff-mission.json "$URL/api/ai/execute")"
          test "$M_CODE" = 200
          G_CODE="$(curl -sS -o /tmp/handoff-loaded.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/api/ai/threads/$THREAD_ID")"
          test "$G_CODE" = 200
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("/tmp/handoff-response.json","utf8"));
            const t=JSON.parse(fs.readFileSync("/tmp/handoff-loaded.json","utf8")).thread;
            if(r.status!=="completed"||r.route!=="meta-muse")throw new Error("handoff_muse_turn_failed");
            if(!r.result?.responseId)throw new Error("handoff_first_api_response_id_missing");
            if(!t.lastResponseId)throw new Error("handoff_thread_not_promoted_to_api_session");
            if(t.messages?.[0]?.role!=="external")throw new Error("handoff_external_source_missing");
            console.log(JSON.stringify({handoffImported:true,contentOnlyBoundary:true,firstNeoTurn:true,apiContinuityEstablished:true}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n### Muse → NEO Handoff\n- Content import: passed\n- Source provenance hash: passed\n- Consumer/API session boundary: preserved\n- First governed Muse turn: passed\n- NEO API continuity established after import: passed\n");
          '
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $TOKEN" "$URL/api/ai/threads/$THREAD_ID"

      - name: Verify NEO to Muse reverse handoff brief
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          TOKEN="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            const enc=v=>Buffer.from(JSON.stringify(v)).toString("base64url");
            const now=Math.floor(Date.now()/1000),h=enc({alg:"HS256",typ:"JWT"}),p=enc({sub:"neo-muse-reverse-smoke",iat:now,exp:now+300});
            process.stdout.write(h+"."+p+"."+createHmac("sha256",process.env.NEO_PASS_JWT_SECRET).update(h+"."+p).digest("base64url"));
          ')"
          C_CODE="$(curl -sS -o /tmp/reverse-thread.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"title":"MUSE-NEO-012B Reverse Handoff","capability":"personalization"}' "$URL/api/ai/threads")"
          test "$C_CODE" = 201
          THREAD_ID="$(node --input-type=module -e 'import fs from "node:fs";process.stdout.write(JSON.parse(fs.readFileSync("/tmp/reverse-thread.json","utf8")).thread.id)')"
          THREAD_ID="$THREAD_ID" node --input-type=module -e '
            import fs from "node:fs";
            fs.writeFileSync("/tmp/reverse-mission.json",JSON.stringify({threadId:process.env.THREAD_ID,objective:"Develop the next NEO Muse workflow phase.",capability:"personalization",maxTokens:512}));
          '
          M_CODE="$(curl -sS -o /tmp/reverse-mission-response.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/reverse-mission.json "$URL/api/ai/execute")"
          test "$M_CODE" = 200
          B_CODE="$(curl -sS -o /tmp/reverse-brief.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/api/ai/threads/$THREAD_ID/muse-brief")"
          test "$B_CODE" = 200
          node --input-type=module -e '
            import fs from "node:fs";
            const mission=JSON.parse(fs.readFileSync("/tmp/reverse-mission-response.json","utf8"));
            const brief=JSON.parse(fs.readFileSync("/tmp/reverse-brief.json","utf8"));
            if(brief.sessionLinkage!=="new-muse-app-conversation")throw new Error("reverse_handoff_linkage_incorrect");
            if(!brief.brief?.includes("NEO → MUSE HANDOFF BRIEF"))throw new Error("reverse_handoff_header_missing");
            if(!brief.brief?.includes("Develop the next NEO Muse workflow phase."))throw new Error("reverse_handoff_objective_missing");
            if(mission.result?.responseId && brief.brief.includes(mission.result.responseId))throw new Error("api_response_id_leaked_into_muse_brief");
            console.log(JSON.stringify({reverseHandoff:true,newMuseConversation:true,responseIdLeak:false}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n### NEO → Muse Handoff\n- Copy-ready brief: passed\n- New Muse conversation boundary: passed\n- API response ID excluded: passed\n");
          '
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $TOKEN" "$URL/api/ai/threads/$THREAD_ID"

      - name: Verify Muse NEO project transfer lineage
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          TOKEN="$(node --input-type=module -e '
            import { createHmac } from "node:crypto";
            const enc=v=>Buffer.from(JSON.stringify(v)).toString("base64url");
            const now=Math.floor(Date.now()/1000),h=enc({alg:"HS256",typ:"JWT"}),p=enc({sub:"neo-muse-project-smoke",iat:now,exp:now+300});
            process.stdout.write(h+"."+p+"."+createHmac("sha256",process.env.NEO_PASS_JWT_SECRET).update(h+"."+p).digest("base64url"));
          ')"
          P_CODE="$(curl -sS -o /tmp/project.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data '{"name":"MUSE-NEO-012C Production Project"}' "$URL/api/ai/projects")"
          test "$P_CODE" = 201
          PROJECT_ID="$(node --input-type=module -e 'import fs from "node:fs";process.stdout.write(JSON.parse(fs.readFileSync("/tmp/project.json","utf8")).project.id)')"
          for spec in 'muse-to-neo|alpha|Inbound from Muse' 'neo-to-muse|beta|Outbound to Muse'; do
            IFS='|' read -r DIR CONTENT SUMMARY <<< "$spec"
            DIR="$DIR" CONTENT="$CONTENT" SUMMARY="$SUMMARY" node --input-type=module -e '
              import fs from "node:fs";
              fs.writeFileSync("/tmp/project-transfer.json",JSON.stringify({
                direction:process.env.DIR,
                threadId:"smoke-thread",
                content:process.env.CONTENT,
                summary:process.env.SUMMARY,
                source:"smoke"
              }));
            '
            CODE="$(curl -sS -o /tmp/transfer.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/project-transfer.json "$URL/api/ai/projects/$PROJECT_ID/transfers")"
            test "$CODE" = 201
          done
          H_CODE="$(curl -sS -o /tmp/project-history.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/api/ai/projects/$PROJECT_ID/transfers")"
          test "$H_CODE" = 200
          node --input-type=module -e '
            import fs from "node:fs";
            const b=JSON.parse(fs.readFileSync("/tmp/project-history.json","utf8"));
            if(b.transfers?.length!==2)throw new Error("project_transfer_count_mismatch");
            if(!b.transfers[0]?.previousTransferId)throw new Error("project_lineage_missing");
            if(b.comparison?.changed!==true)throw new Error("project_change_detection_failed");
            console.log(JSON.stringify({projectTransfer:true,lineage:true,changed:true}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n### Muse / NEO Project Transfer\n- Named project: passed\n- Round-trip lineage: passed\n- Change detection: passed\n");
          '

      - name: Map ai.holytemples.org
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN_NAME="ai.holytemples.org"
          VERIFIED="$(gcloud domains list-user-verified --format='value(id)' 2>/dev/null || true)"
          if ! printf '%s\n' "$VERIFIED" | grep -Fxq 'holytemples.org'; then
            echo "### AI domain mapping pending ownership verification" >> "$GITHUB_STEP_SUMMARY"
            echo "Cloud Run remains live at its generated service URL." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gcloud beta run domain-mappings describe --domain="$DOMAIN_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null 2>&1; then
            gcloud beta run domain-mappings create \
              --service="$SERVICE_NAME" \
              --domain="$DOMAIN_NAME" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --quiet
          fi
          echo "### DNS records for $DOMAIN_NAME" >> "$GITHUB_STEP_SUMMARY"
          gcloud beta run domain-mappings describe \
            --domain="$DOMAIN_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='yaml(status.resourceRecords)' >> "$GITHUB_STEP_SUMMARY"
