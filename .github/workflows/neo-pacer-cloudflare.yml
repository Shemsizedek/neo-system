name: NEO-PACER MCP Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/neo-pacer/**'
      - 'data/neo-pacer/**'
      - '.github/workflows/neo-pacer-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/neo-pacer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy NEO-PACER MCP
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
