name: Provision NEO Enterprise Production Edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-neo-enterprise-edge.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: neo-enterprise-production-edge
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      HTTPS_PROXY_NAME: neo-edge-https-proxy
      IP_NAME: neo-edge-global-ip
      ENTERPRISE_CERT_NAME: neo-edge-enterprise-cert
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Enterprise managed certificate
        run: |
          set -euo pipefail
          if ! gcloud compute ssl-certificates describe "$ENTERPRISE_CERT_NAME" --global --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute ssl-certificates create "$ENTERPRISE_CERT_NAME" \
              --domains='enterprise.holytemples.org' \
              --global \
              --project="$GCP_PROJECT_ID" \
              --quiet
          fi

      - name: Attach Enterprise certificate without dropping existing certificates
        run: |
          set -euo pipefail
          mapfile -t current < <(gcloud compute target-https-proxies describe "$HTTPS_PROXY_NAME" \
            --project="$GCP_PROJECT_ID" \
            --format='value(sslCertificates)' | tr ';' '\n' | sed '/^$/d')
          certs=()
          seen_enterprise=0
          for cert in "${current[@]}"; do
            name="${cert##*/}"
            certs+=("$name")
            [[ "$name" == "$ENTERPRISE_CERT_NAME" ]] && seen_enterprise=1
          done
          if [[ "$seen_enterprise" -eq 0 ]]; then certs+=("$ENTERPRISE_CERT_NAME"); fi
          joined="$(IFS=,; echo "${certs[*]}")"
          test -n "$joined"
          gcloud compute target-https-proxies update "$HTTPS_PROXY_NAME" \
            --ssl-certificates="$joined" \
            --project="$GCP_PROJECT_ID" \
            --quiet

      - name: Report DNS activation target
        run: |
          set -euo pipefail
          EDGE_IP="$(gcloud compute addresses describe "$IP_NAME" --global --project="$GCP_PROJECT_ID" --format='value(address)')"
          test -n "$EDGE_IP"
          {
            echo '### NEO Enterprise production edge prepared'
            echo
            echo "Runtime host: **enterprise.holytemples.org**"
            echo "DNS A-record target: **$EDGE_IP**"
            echo 'No DNS change is performed by this workflow. Create DNS only after the runtime deployment succeeds.'
          } >> "$GITHUB_STEP_SUMMARY"
