name: NEO-PACER GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/neo-pacer/**'
      - 'data/neo-pacer/**'
      - '.github/workflows/neo-pacer-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neo-pacer-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/neo-pacer
      - name: Deploy NEO-PACER to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
