name: NEO-PACER Pages Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/neo-pacer/**'
      - 'data/neo-pacer/**'
      - '.github/workflows/neo-pacer-pages.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NEO-PACER static bundle
        run: |
          test -f docs/neo-pacer/index.html
          test -f docs/neo-pacer/app.js
          test -f docs/neo-pacer/styles.css
          echo "NEO-PACER validated. Canonical deployment is owned by pages.yml." >> "$GITHUB_STEP_SUMMARY"
