name: CHATGPT-COMMERCE-006 Discover Spreadshop API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-commerce-006-discover-spreadshop-api.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Spreadshop shop client and API references
        shell: bash
        run: |
          set -euo pipefail
          JS='https://Shemsizedek.myspreadshop.com/shopfiles/shopclient/shopclient.nocache.js'
          echo 'SHOPCLIENT:'
          curl -sS -L -D /tmp/js.headers -o /tmp/shopclient.js -w 'code=%{http_code} final=%{url_effective} bytes=%{size_download}\n' "$JS" || true
          head -40 /tmp/js.headers || true

          echo 'API_REFERENCES:'
          grep -Eo 'https?://[^"'"'"'<> )]+' /tmp/shopclient.js | sort -u | grep -Ei 'api|spread|product|article|shop|catalog' | head -200 || true

          echo 'ENDPOINT_MARKERS:'
          grep -Eio '.{0,160}(api\.spreadshirt|sprd|shopId|shopName|product|article|catalog|marketplace|locale|apiKey).{0,300}' /tmp/shopclient.js | head -220 || true

          echo 'BOOTSTRAP_SCRIPTS:'
          grep -Eo '[A-Za-z0-9_./:-]+\.cache\.js' /tmp/shopclient.js | sort -u | head -100 || true

          echo 'CUSTOM_DOMAIN_FEED_CONTENT_TYPES:'
          for path in product-feed.xml product-feed.csv feed.xml products.xml merchant-center.xml meta-feed.xml google-shopping.xml; do
            echo "--- $path"
            curl -sS -L -D /tmp/h -o /tmp/b "https://shop.holytemples.org/$path" || true
            grep -iE '^(HTTP/|content-type:|content-length:|location:)' /tmp/h | tail -10 || true
            head -c 220 /tmp/b | tr '\n' ' ' || true
            echo
          done
