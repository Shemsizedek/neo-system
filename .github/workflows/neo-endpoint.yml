name: NEO Endpoint CI

on:
  pull_request:
    paths:
      - 'server/neo-endpoint-bridge/**'
      - 'apps/neo-guardian/endpoint/**'
      - 'apps/neo-guardian/app/**'
      - 'scripts/neo-endpoint-adb-enroll.sh'
      - '.github/workflows/neo-endpoint.yml'
  push:
    branches: [main]
    paths:
      - 'server/neo-endpoint-bridge/**'
      - 'apps/neo-guardian/endpoint/**'
      - 'apps/neo-guardian/app/**'
      - 'scripts/neo-endpoint-adb-enroll.sh'
      - '.github/workflows/neo-endpoint.yml'

permissions:
  contents: read

jobs:
  endpoint-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run endpoint bridge tests
        run: node --test server/neo-endpoint-bridge/*.test.mjs
      - name: Verify enrollment helper shell syntax
        run: bash -n scripts/neo-endpoint-adb-enroll.sh

  guardian-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Guardian Endpoint debug candidate
        working-directory: apps/neo-guardian
        run: gradle assembleDebug --no-daemon
