name: Diagnose Noogle Cloud Run Private 404
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: holytemples-production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect service and IAM without changing them
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe noogle-connect-staging --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/service.json
          gcloud run services get-iam-policy noogle-connect-staging --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/iam.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('/tmp/service.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/iam.json','utf8'));
          const annotations=s.metadata?.annotations||{};
          console.log('Revision:',s.status?.latestReadyRevisionName);
          console.log('Ingress annotation:',annotations['run.googleapis.com/ingress']||'unspecified');
          console.log('Invoker IAM disabled:',annotations['run.googleapis.com/invoker-iam-disabled']||'false');
          console.log('Default URL:',s.status?.url||'absent');
          console.log('Tagged URL count:',(s.status?.traffic||[]).filter(t=>t.url).length);
          console.log('Invoker binding identities:',(p.bindings||[]).filter(b=>b.role==='roles/run.invoker').flatMap(b=>b.members||[]).map(m=>m==='allUsers'||m==='allAuthenticatedUsers'?m:'[private member]'));
          const list=[s.status?.url,...(s.status?.traffic||[]).map(t=>t.url)].filter(Boolean);
          fs.writeFileSync('/tmp/service-urls', [...new Set(list)].join('\n')+'\n');
          JS
      - name: Probe authenticated and anonymous requests without leaking token
        shell: bash
        run: |
          set -euo pipefail
          audience="$(head -n 1 /tmp/service-urls)"
          test -n "$audience"
          token="$(gcloud auth print-identity-token --audiences="$audience" --impersonate-service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT")"
          test -n "$token"
          while IFS= read -r url; do
            test -n "$url" || continue
            for endpoint in /healthz /api/guardian/capabilities; do
              anonymous="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$url$endpoint" || true)"
              authorized="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" --output /dev/null --write-out '%{http_code}' "$url$endpoint" || true)"
              echo "URL=$url PATH=$endpoint anonymous=$anonymous authorized=$authorized"
              if [ "$anonymous" = 200 ]; then echo "::error::Anonymous access must not succeed"; exit 1; fi
            done
          done < /tmp/service-urls
          echo "Diagnostic only: no IAM, ingress, DNS or revision changes were made."
