name: NEO Property Manager Evidence Gates
on:
  pull_request:
    paths:
      - 'server/neo-property-manager/**'
      - 'tests/neo-property-manager/**'
      - '.github/workflows/neo-property-manager-tests.yml'
  workflow_dispatch:
jobs:
  source-and-authority-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run NCC-015, NCC-016, NCC-017 unit suites (synthetic-only)
        run: node --test tests/neo-property-manager/*.test.mjs
