name: NEO Counter Gateway CI

on:
  pull_request:
    paths:
      - "apps/neo-counter/**"
      - ".github/workflows/neo-counter-gateway-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/neo-counter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:gateway
      - run: npm run typecheck
      - run: npm run build
