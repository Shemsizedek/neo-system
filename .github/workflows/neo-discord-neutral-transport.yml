name: NEO Discord Neutral Transport

on:
  pull_request:
    paths:
      - 'services/neo-discord/**'
      - '.github/workflows/neo-discord-neutral-transport.yml'
  push:
    branches: [main]
    paths:
      - 'services/neo-discord/**'
      - '.github/workflows/neo-discord-neutral-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-neutral-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate canonical core and adapter layout
        run: |
          test -s services/neo-discord/core/relations.js
          test -s services/neo-discord/core/authorization.js
          test -s services/neo-discord/core/asset-display.js
          test -s services/neo-discord/core/counterparty.js
          test -s services/neo-discord/core/treasury.js
          test -s services/neo-discord/core/neo-command.js
          test -s services/neo-discord/commands/relations.json
          test -s services/neo-discord/adapters/cloudflare/worker.js
          test -s services/neo-discord/adapters/node-http/runtime.js
      - name: Ensure provider adapter stays transport-only
        run: |
          ! grep -q "function isTreasuryPrompt" services/neo-discord/adapters/cloudflare/worker.js
          ! grep -q "function isCounterpartyStatusPrompt" services/neo-discord/adapters/cloudflare/worker.js
          ! grep -q "async function githubStatus" services/neo-discord/adapters/cloudflare/worker.js
          ! grep -q "async function askOpenAI" services/neo-discord/adapters/cloudflare/worker.js
          grep -q "../../core/neo-command.js" services/neo-discord/adapters/cloudflare/worker.js
          grep -q "../../core/relations.js" services/neo-discord/adapters/cloudflare/worker.js
      - name: Validate command manifest
        run: node -e "const x=require('./services/neo-discord/commands/relations.json'); if(x.name!=='relations'||!Array.isArray(x.options)) process.exit(1)"
      - name: Install Cloudflare adapter dependencies
        working-directory: services/neo-discord/adapters/cloudflare
        run: npm install
      - name: Validate Cloudflare adapter bundle
        working-directory: services/neo-discord/adapters/cloudflare
        run: npm run dry-run
      - name: Validate portable Node adapter import
        run: node -e "import('./services/neo-discord/adapters/node-http/runtime.js').then(m=>{const x=m.createNodeRuntimeAdapter(); if(x.id!=='node-http') process.exit(1)})"
