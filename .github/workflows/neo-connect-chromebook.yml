name: NEO Connect Chromebook Companion
on:
  pull_request:
    paths:
      - 'apps/neo-connect-chromebook/**'
      - '.github/workflows/neo-connect-chromebook.yml'
  push:
    branches: [main]
    paths:
      - 'apps/neo-connect-chromebook/**'
      - '.github/workflows/neo-connect-chromebook.yml'
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/neo-connect-chromebook/agent.mjs
      - run: node --test apps/neo-connect-chromebook/*.test.mjs
