name: Verify NEO Realty Shared Front Door

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-edge/product-static.mjs'
      - 'apps/neo-realty/web/**'
      - '.github/workflows/verify-neo-realty-shared-path.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify NEO Realty live path
        run: |
          set -euo pipefail
          base='https://neo.holytemples.org/realty'
          code="$(curl -sS -o /tmp/redirect -w '%{http_code}' "$base")"
          test "$code" = 308
          for path in / /health /api /api/health /api/ready /api/properties; do
            code="$(curl --connect-timeout 10 --max-time 30 --retry 4 --retry-delay 5 -sS -o /tmp/realty-response -w '%{http_code}' "$base$path" || true)"
            echo "$base$path -> $code" >> "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
            test -s /tmp/realty-response
          done
          curl -fsS "$base/" -o /tmp/realty-index.html
          grep -q 'NEO Realty' /tmp/realty-index.html
          grep -q 'Verified listings' /tmp/realty-index.html
          grep -q 'property title, occupancy rights and token/contract rights are distinct' /tmp/realty-index.html
          grep -q "window.NEO_REALTY_API='/realty/api'" /tmp/realty-index.html
          curl -fsS "$base/api/ready" -o /tmp/realty-ready.json
          grep -q '"ok":true' /tmp/realty-ready.json
          grep -q '"persistence":"postgres"' /tmp/realty-ready.json
          curl -fsS "$base/api" -o /tmp/realty-api.json
          grep -q '"propertyTitleEstablishedByToken":false' /tmp/realty-api.json
