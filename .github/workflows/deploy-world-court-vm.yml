name: Deploy World Court VM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-world-court-vm.yml'
      - 'deploy/world-court/**'
      - 'server/tribunal-backend/**'
      - 'src/tribunal/**'
      - 'public/efile.html'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: world-court-production-vm
  cancel-in-progress: false

env:
  INSTANCE_NAME: world-court-node-001
  ADDRESS_NAME: world-court-node-001-ip
  FIREWALL_NAME: world-court-web-ingress
  MACHINE_TYPE: e2-small
  DOMAIN: court.holytemples.org
  ROOT_DOMAIN: holytemples.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}
      GCP_ZONE: ${{ vars.GCP_ZONE || secrets.GCP_ZONE || 'us-central1-a' }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate GCP configuration
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_ZONE GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Ensure static address and web firewall
        id: infra
        run: |
          set -euo pipefail
          if ! gcloud compute addresses describe "$ADDRESS_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/dev/null 2>&1; then
            gcloud compute addresses create "$ADDRESS_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION"
          fi
          IP="$(gcloud compute addresses describe "$ADDRESS_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(address)')"
          test -n "$IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

          if ! gcloud compute firewall-rules describe "$FIREWALL_NAME" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud compute firewall-rules create "$FIREWALL_NAME" \
              --project="$GCP_PROJECT_ID" \
              --network=default \
              --direction=INGRESS \
              --priority=1000 \
              --action=ALLOW \
              --rules=tcp:80,tcp:443 \
              --source-ranges=0.0.0.0/0 \
              --target-tags=world-court-web
          fi

      - name: Synchronize authoritative court DNS
        env:
          IP: ${{ steps.infra.outputs.ip }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN; authoritative DNS still points court.holytemples.org at WordPress."; exit 1; }

          cf() {
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$@"
          }

          ZONE_JSON="$(cf "https://api.cloudflare.com/client/v4/zones?name=$ROOT_DOMAIN&status=active")"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONE_JSON")"
          if [[ -z "$ZONE_ID" ]]; then
            echo "::error::Cloudflare token cannot resolve the active $ROOT_DOMAIN zone. Grant Zone:Read and DNS:Edit for this zone."
            jq -c '{success,errors}' <<<"$ZONE_JSON" || true
            exit 1
          fi

          RECORDS_JSON="$(cf "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$DOMAIN&per_page=100")"
          mapfile -t RECORD_IDS < <(jq -r '.result[].id' <<<"$RECORDS_JSON")
          PAYLOAD="$(jq -nc --arg name "$DOMAIN" --arg content "$IP" '{type:"A",name:$name,content:$content,ttl:300,proxied:false}')"

          if (( ${#RECORD_IDS[@]} == 0 )); then
            RESULT="$(cf -X POST --data "$PAYLOAD" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")"
          else
            RESULT="$(cf -X PUT --data "$PAYLOAD" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/${RECORD_IDS[0]}")"
            if (( ${#RECORD_IDS[@]} > 1 )); then
              for record_id in "${RECORD_IDS[@]:1}"; do
                cf -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$record_id" >/dev/null
              done
            fi
          fi

          if [[ "$(jq -r '.success' <<<"$RESULT")" != "true" ]]; then
            echo "::error::Cloudflare rejected the court DNS update."
            jq -c '{success,errors}' <<<"$RESULT" || true
            exit 1
          fi
          echo "Authoritative DNS synchronized: $DOMAIN -> $IP (DNS only, TTL 300)."

      - name: Create or refresh dedicated court host
        run: |
          set -euo pipefail
          IP="${{ steps.infra.outputs.ip }}"
          if ! gcloud compute instances describe "$INSTANCE_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" >/dev/null 2>&1; then
            gcloud compute instances create "$INSTANCE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --zone="$GCP_ZONE" \
              --machine-type="$MACHINE_TYPE" \
              --image-family=debian-12 \
              --image-project=debian-cloud \
              --boot-disk-size=20GB \
              --boot-disk-type=pd-balanced \
              --address="$IP" \
              --tags=world-court-web \
              --metadata=enable-oslogin=TRUE \
              --metadata-from-file=startup-script=deploy/world-court/gcp/bootstrap-world-court.sh \
              --no-service-account \
              --no-scopes
          else
            gcloud compute instances add-metadata "$INSTANCE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --zone="$GCP_ZONE" \
              --metadata-from-file=startup-script=deploy/world-court/gcp/bootstrap-world-court.sh
            gcloud compute instances reset "$INSTANCE_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE"
          fi

      - name: Wait for public court health
        run: |
          set -euo pipefail
          IP="${{ steps.infra.outputs.ip }}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 -H "Host: $DOMAIN" "http://$IP/health" >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              ok=1
              break
            fi
            echo "Waiting for bootstrap ($i/60)..."
            sleep 10
          done
          if [[ "$ok" != 1 ]]; then
            echo "::error::World Court host did not become healthy in time"
            gcloud compute instances get-serial-port-output "$INSTANCE_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --port=1 --start=-20000 || true
            exit 1
          fi

      - name: Verify DNS and HTTPS production endpoint
        run: |
          set -euo pipefail
          IP="${{ steps.infra.outputs.ip }}"
          ok=0
          for i in $(seq 1 60); do
            DNS="$(getent ahostsv4 "$DOMAIN" | awk '{print $1}' | sort -u || true)"
            echo "DNS attempt $i: ${DNS:-unresolved}"
            if grep -qx "$IP" <<<"$DNS"; then
              if curl -fsS --max-time 10 "https://$DOMAIN/health" >/tmp/https-health.json 2>/dev/null; then
                cat /tmp/https-health.json
                ok=1
                break
              fi
            fi
            sleep 10
          done
          if [[ "$ok" != 1 ]]; then
            echo "::error::HTTPS gate failed for https://$DOMAIN/health"
            echo "Expected DNS address: $IP"
            gcloud compute instances get-serial-port-output "$INSTANCE_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --port=1 --start=-30000 || true
            exit 1
          fi

      - name: Publish deployment coordinates
        run: |
          IP="${{ steps.infra.outputs.ip }}"
          {
            echo "## World Court host"
            echo "- Instance: $INSTANCE_NAME"
            echo "- Zone: $GCP_ZONE"
            echo "- Static IPv4: $IP"
            echo "- DNS: $DOMAIN -> $IP"
            echo "- E-File: https://$DOMAIN/efile"
            echo "- HTTPS health: https://$DOMAIN/health"
            echo "- Production transport gate: VERIFIED"
          } >> "$GITHUB_STEP_SUMMARY"
