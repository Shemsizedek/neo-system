name: Verify NEO Miner Live UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-neo-miner-live-ui.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      IP_NAME: neo-edge-global-ip
      MINER_CERT_NAME: neo-edge-miner-cert
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify Miner front door
        run: |
          set -euo pipefail
          EDGE_IP="$(gcloud compute addresses describe "$IP_NAME" --global --project="$GCP_PROJECT_ID" --format='value(address)')"
          CERT_STATUS="$(gcloud compute ssl-certificates describe "$MINER_CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='value(managed.status)')"
          DOMAIN_STATUS="$(gcloud compute ssl-certificates describe "$MINER_CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='json(managed.domainStatus)' || true)"
          echo "Miner edge IPv4: ${EDGE_IP:-missing}"
          echo "Miner certificate: ${CERT_STATUS:-missing}"
          echo "Miner domain status: ${DOMAIN_STATUS:-unknown}"
          test -n "$EDGE_IP"
          test "$CERT_STATUS" = ACTIVE
          echo "NEO_EDGE_GLOBAL_IP=$EDGE_IP" >> "$GITHUB_ENV"

      - name: Verify Miner UI and production contract
        run: |
          set -euo pipefail
          host=miner.holytemples.org
          for path in / /ui /health /api /platform-shell.css /platform-shell.js /neo-system/api/platforms/neo-miner.json; do
            code="$(curl --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -sS -o /tmp/miner-response -w '%{http_code}' "https://$host${path}" || true)"
            echo "miner${path} -> $code" >> "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
            test -s /tmp/miner-response
          done
          curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/" -o /tmp/miner-index.html
          grep -q 'NEO Miner' /tmp/miner-index.html
          grep -q 'Bitcoin Mining Control Plane' /tmp/miner-index.html
          curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/neo-system/api/platforms/neo-miner.json" -o /tmp/miner-platform.json
          grep -q '"status":"ready"' /tmp/miner-platform.json
          grep -q 'AUTHENTICATED SERVICES ONLY' /tmp/miner-platform.json
