name: NEO ARTEX lab gate (safe autopilot)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  pull_request:
    paths:
      - 'server/neo-hacker/artexAdapter*'
      - '.github/workflows/neo-artex-autopilot.yml'
      - 'docs/NEO_ARTEX_002.md'
      - 'deploy/neo-artex-lab/**'
      - 'scripts/neo-artex-lab.sh'
      - 'scripts/neo-artex-lab-smoke.sh'
  push:
    branches: [main]
    paths:
      - 'server/neo-hacker/artexAdapter*'
      - '.github/workflows/neo-artex-autopilot.yml'
      - 'deploy/neo-artex-lab/**'
      - 'scripts/neo-artex-lab.sh'
      - 'scripts/neo-artex-lab-smoke.sh'

permissions:
  contents: read

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify ARTEX adapter syntax
        run: |
          node --check server/neo-hacker/artexAdapter.mjs
          node --check server/neo-hacker/artexAdapter.test.mjs
      - name: NEO Hacker ARTEX safety tests
        run: node --test server/neo-hacker/artexAdapter.test.mjs server/neo-hacker/guardianPipeline.test.mjs
      - name: Validate lab launcher without activating a runtime
        run: |
          bash -n scripts/neo-artex-lab.sh
          bash -n scripts/neo-artex-lab-smoke.sh
          bash scripts/neo-artex-lab.sh help
          if grep -qE '^[[:space:]]*-[[:space:]]*["\x27]?0\\.0\\.0\\.0:' deploy/neo-artex-lab/compose.yaml; then
            echo 'Public ARTEX port binding rejected' >&2
            exit 1
          fi
          grep -q 'internal: true' deploy/neo-artex-lab/compose.yaml
      - name: Offline-only deployment gate
        run: |
          echo "No ARTEX server started; no scans; no cloud secrets; no production endpoints."
          echo "This workflow continuously validates the NEO defensive adapter only."
