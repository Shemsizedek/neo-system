name: Crown Gemini Bridge CI
on:
  pull_request:
    paths:
      - 'deploy/crown-gem-004/**'
      - '.github/workflows/crown-gem-004.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m compileall -q deploy/crown-gem-004 && python -m unittest discover -s deploy/crown-gem-004 -p 'test_*.py' -v
