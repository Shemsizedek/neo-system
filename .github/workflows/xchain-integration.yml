name: XChain integration
on:
  pull_request:
    paths:
      - 'src/explorer/xchainAdapter.ts'
      - 'src/explorer/XChainPanel.tsx'
      - 'src/explorer/NeoExplorer.tsx'
      - 'tests/xchainAdapter.test.mjs'
      - '.github/workflows/xchain-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/xchainAdapter.test.mjs
