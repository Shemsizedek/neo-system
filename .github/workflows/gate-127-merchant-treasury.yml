name: Gate 127 Merchant Settlement Treasury
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['architecture/neo-merchant-treasury-policy.json','architecture/modern-treasury-integration.json','server/neo-merchant-treasury/**','scripts/check-modern-treasury.mjs','docs/integrations/modern-treasury.md','docs/NEO-G127-MERCHANT-TREASURY.md','.env.example','package.json','.github/workflows/gate-127-merchant-treasury.yml']
  pull_request:
    paths: ['architecture/neo-merchant-treasury-policy.json','architecture/modern-treasury-integration.json','server/neo-merchant-treasury/**','scripts/check-modern-treasury.mjs','docs/integrations/modern-treasury.md','docs/NEO-G127-MERCHANT-TREASURY.md','.env.example','package.json','.github/workflows/gate-127-merchant-treasury.yml']
permissions: {contents: read}
jobs:
  treasury:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run neo-merchant-treasury:test
      - run: node --check server/neo-merchant-treasury/server.mjs
      - run: node --check server/neo-merchant-treasury/modern-treasury.mjs
      - run: node --check server/neo-merchant-treasury/modern-treasury-http.mjs
      - run: node --check server/neo-merchant-treasury/modern-treasury-staging.mjs
      - run: node --check scripts/check-modern-treasury.mjs
