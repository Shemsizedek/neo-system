name: Deploy NEO Discord Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/neo-discord/**'
      - '.github/workflows/deploy-neo-discord.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/neo-discord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Deploy isolated Discord API Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify Discord API health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://neo-discord-api.neosystem.workers.dev/health"
          body="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$url")"
          echo "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true || x.service!=="neo-discord") process.exit(1)' "$body"
