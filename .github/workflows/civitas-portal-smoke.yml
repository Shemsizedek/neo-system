name: Civitas Portal Route Certification
on:
  pull_request:
    paths:
      - 'apps/neo-pads/web/civitas/**'
      - 'deploy/neo-pads-frontend/**'
      - '.github/workflows/civitas-portal-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTTP route and preview safety
        run: node --test deploy/neo-pads-frontend/civitas-route.test.mjs
