name: House of Negus Merchant API Probe
on:
  push:
    branches: [main]
    paths:
      - "scripts/google-merchant-datasources-list.mjs"
      - "scripts/google-merchant-register-gcp.mjs"
      - ".github/workflows/house-of-negus-google-merchant-api-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  list-data-sources:
    runs-on: ubuntu-latest
    environment: holytemples-production
    env:
      GOOGLE_MERCHANT_ACCOUNT_ID: "5429352076"
      GOOGLE_MERCHANT_DEVELOPER_EMAIL: "NooneUniversity@gmail.com"
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - id: merchant-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/content

      - uses: google-github-actions/setup-gcloud@v3

      - name: Enable Merchant API
        run: |
          set -euo pipefail
          gcloud services enable merchantapi.googleapis.com --project="$GCP_PROJECT_ID" --quiet
          for i in {1..12}; do
            if gcloud services list --enabled --project="$GCP_PROJECT_ID" --filter='config.name:merchantapi.googleapis.com' --format='value(config.name)' | grep -q '^merchantapi.googleapis.com$'; then
              echo "Merchant API enabled"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Merchant API enablement did not propagate in time"
          exit 1

      - name: Register NEO GCP project with Merchant Center
        env:
          GOOGLE_MERCHANT_ACCESS_TOKEN: ${{ steps.merchant-auth.outputs.access_token }}
        run: node scripts/google-merchant-register-gcp.mjs

      - name: Verify live replacement feed
        run: node scripts/google-merchant-cutover-check.mjs

      - name: Wait for Merchant registration and list data sources
        env:
          GOOGLE_MERCHANT_ACCESS_TOKEN: ${{ steps.merchant-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if node scripts/google-merchant-datasources-list.mjs; then
              exit 0
            fi
            echo "Merchant registration not propagated yet; retrying in 30s..."
            sleep 30
          done
          echo "::error::Merchant registration did not propagate within 5 minutes"
          exit 1
