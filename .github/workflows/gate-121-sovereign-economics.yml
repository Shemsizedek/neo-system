name: Gate 121 Sovereign Resource and Economic Scheduler
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['architecture/neo-economic-scheduler-policy.json','server/neo-economics/**','docs/NEO-G121-GLOBAL-LICENSES-AND-COMMUNITY-CCP.md','package.json','.github/workflows/gate-121-sovereign-economics.yml']
  pull_request:
    paths: ['architecture/neo-economic-scheduler-policy.json','server/neo-economics/**','docs/NEO-G121-GLOBAL-LICENSES-AND-COMMUNITY-CCP.md','package.json','.github/workflows/gate-121-sovereign-economics.yml']
permissions: {contents: read}
jobs:
  economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run neo-economics:test
      - run: node --check server/neo-economics/server.mjs
