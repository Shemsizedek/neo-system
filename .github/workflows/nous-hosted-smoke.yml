name: NEO Nous OS hosted staging smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nous-hosted-smoke.yml'
      - 'core/nous-os/**'
permissions:
  contents: read
  id-token: write
jobs:
  hosted-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check hosted Neon-backed staging health and fail-closed auth
        env:
          BASE_URL: https://neo-nous-os-db-staging.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          code="000"
          for i in $(seq 1 24); do
            code=$(curl --max-time 12 -sS -o /tmp/nous-health.json -w '%{http_code}' "$BASE_URL/health" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"
          grep -q '"mode":"plan-only"' /tmp/nous-health.json
          ready=$(curl --max-time 12 -sS -o /tmp/nous-ready.json -w '%{http_code}' "$BASE_URL/ready")
          test "$ready" = "200"
          grep -q '"identityConfigured":true' /tmp/nous-ready.json
          grep -q '"backend":"postgresql"' /tmp/nous-ready.json
          code=$(curl --max-time 12 -sS -o /tmp/nous-agents.json -w '%{http_code}' "$BASE_URL/v1/agents")
          test "$code" = "401"
          grep -q 'bearer_required' /tmp/nous-agents.json
          code=$(curl --max-time 12 -sS -o /tmp/nous-adapters.json -w '%{http_code}' "$BASE_URL/v1/adapters")
          test "$code" = "401"
          curl --max-time 12 -sS -D /tmp/nous-headers.txt -o /tmp/nous-security.json "$BASE_URL/v1/sources"
          grep -iq '^referrer-policy: no-referrer' /tmp/nous-headers.txt
          grep -iq '^x-frame-options: DENY' /tmp/nous-headers.txt
          grep -iq '^content-security-policy: default-src' /tmp/nous-headers.txt
          grep -q 'bearer_required' /tmp/nous-security.json
          echo 'Hosted health, Neon readiness, security headers, and unauthenticated access denial verified'

      - name: Verify GitHub OIDC signed planning against hosted Neon staging
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 1388
        env:
          BASE_URL: https://neo-nous-os-db-staging.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const runnerToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          assert.ok(requestUrl && runnerToken, 'GitHub OIDC requester unavailable');
          const separator = requestUrl.includes('?') ? '&' : '?';
          const response = await fetch(requestUrl + separator + 'audience=neo-nous-staging-ci', {
            headers: { Authorization: 'Bearer ' + runnerToken },
            signal: AbortSignal.timeout(15000),
          });
          assert.equal(response.status, 200, 'OIDC credential mint refused');
          const { value: jwt } = await response.json();
          assert.ok(typeof jwt === 'string' && jwt.length > 100, 'OIDC JWT unavailable');
          const task = { requestId: 'NOUS-OIDC-PR1388-SMOKE-01', agentId: 'NIA-008', capability: 'project.plan' };
          async function post(body) {
            const res = await fetch(process.env.BASE_URL + '/v1/staging/receipts/plan', {
              method: 'POST',
              headers: { authorization: 'Bearer ' + jwt, 'content-type': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(20000),
            });
            return { status: res.status, body: await res.json() };
          }
          const first = await post(task);
          assert.equal(first.status, 200, 'signed hosted planning failed: ' + JSON.stringify(first.body));
          assert.equal(first.body.execution, 'disabled');
          assert.equal(first.body.status, 'planned');
          const replay = await post(task);
          assert.equal(replay.status, 200);
          assert.deepEqual(replay.body, first.body);
          const collision = await post({ ...task, capability: 'development.plan' });
          assert.equal(collision.status, 409, 'conflicting planning request must be rejected');
          console.log('GitHub OIDC signed hosted planning, receipt idempotency, and conflict: PASS');
          NODE

      - name: Signed ephemeral GitHub OIDC proof and durable Neon receipt replay
        run: node core/nous-os/deploy/hosted-oidc-smoke.mjs
