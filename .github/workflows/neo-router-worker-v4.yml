name: NEO Router Worker v4

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: neo-router-worker-v4
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run NEO Router Worker
        env:
          NEO_ROUTER_STORAGE: github
          NEO_ROUTER_STATE_PATH: data/router/state.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEO_ROUTER_STATE_KEY: ${{ secrets.NEO_ROUTER_STATE_KEY }}
        run: node server/neo-router/worker-v4.mjs

      - name: Persist GitHub-native router state
        if: always()
        run: |
          if [ -f data/router/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/router/state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(router): persist GitHub-native state [skip ci]"
              git push
            fi
          fi
