name: NEO Omarchy Gate 003

on:
  pull_request:
    paths:
      - 'server/neo-omarchy/**'
      - 'docs/NEO-OMARCHY-003.md'
      - '.github/workflows/neo-omarchy-003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check server/neo-omarchy/coordination.mjs
          node --check server/neo-omarchy/outbound-worker.mjs
          node --check server/neo-omarchy/coordination.test.mjs
      - name: Mocked trust/lease/evidence contracts
        run: node --test server/neo-omarchy/coordination.test.mjs
      - name: Previous gate compatibility
        run: |
          node --test server/neo-omarchy/lab-bridge.test.mjs
          node --test scripts/neo-omarchy-preflight.test.mjs
