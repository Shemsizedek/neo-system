name: Verify NEO Enterprise Live UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-neo-enterprise-live-ui.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      IP_NAME: neo-edge-global-ip
      ENTERPRISE_CERT_NAME: neo-edge-enterprise-cert
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify Enterprise front door
        run: |
          set -euo pipefail
          EDGE_IP="$(gcloud compute addresses describe "$IP_NAME" --global --project="$GCP_PROJECT_ID" --format='value(address)')"
          CERT_STATUS="$(gcloud compute ssl-certificates describe "$ENTERPRISE_CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='value(managed.status)')"
          DOMAIN_STATUS="$(gcloud compute ssl-certificates describe "$ENTERPRISE_CERT_NAME" --global --project="$GCP_PROJECT_ID" --format='json(managed.domainStatus)' || true)"
          echo "Enterprise edge IPv4: ${EDGE_IP:-missing}"
          echo "Enterprise certificate: ${CERT_STATUS:-missing}"
          echo "Enterprise domain status: ${DOMAIN_STATUS:-unknown}"
          test -n "$EDGE_IP"
          test "$CERT_STATUS" = ACTIVE
          echo "NEO_EDGE_GLOBAL_IP=$EDGE_IP" >> "$GITHUB_ENV"

      - name: Verify Enterprise UI and public-data boundary
        run: |
          set -euo pipefail
          host=enterprise.holytemples.org
          for path in / /ui /admin/ /health /api /api/enterprise/index.json /api/enterprise/organizations.json /api/enterprise/roles.json; do
            code="$(curl --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -sS -o /tmp/enterprise-response -w '%{http_code}' "https://$host${path}" || true)"
            echo "enterprise${path} -> $code" >> "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
            test -s /tmp/enterprise-response
          done
          curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/" -o /tmp/enterprise-index.html
          grep -q 'NEO ENTERPRISE' /tmp/enterprise-index.html
          grep -q 'Executive Console' /tmp/enterprise-index.html
          curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/admin/" -o /tmp/enterprise-admin.html
          grep -q 'Executive Console' /tmp/enterprise-admin.html
          curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -fsS "https://$host/api/enterprise/organizations.json" -o /tmp/enterprise-organizations.json
          ! grep -q 'principal_id\|membership\|github:Shemsizedek\|PRIVATE_CONTROL_PLANE' /tmp/enterprise-organizations.json
          code="$(curl --resolve "$host:443:${NEO_EDGE_GLOBAL_IP}" -sS -o /tmp/enterprise-private -w '%{http_code}' "https://$host/api/enterprise/memberships.json" || true)"
          test "$code" = 404
