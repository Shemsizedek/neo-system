name: Base ERC-8021 attribution checks
on:
  pull_request:
    paths:
      - 'integrations/base/**'
      - '.github/workflows/base-erc8021-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test integrations/base/builder-code.test.mjs
