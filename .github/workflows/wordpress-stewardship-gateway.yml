name: WordPress Stewardship Gateway CI

on:
  pull_request:
    paths:
      - 'server/wordpress-stewardship/**'
      - '.github/workflows/wordpress-stewardship-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'server/wordpress-stewardship/**'
      - '.github/workflows/wordpress-stewardship-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test WordPress stewardship adapter and gateway
        run: node --test server/wordpress-stewardship/*.test.mjs
