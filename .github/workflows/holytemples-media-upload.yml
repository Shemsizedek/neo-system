name: Upload Approved HolyTemples Media

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Public HTTPS URL of the approved image"
        required: true
        type: string
      filename:
        description: "WordPress filename (.jpg, .png, .webp)"
        required: true
        type: string
      mime_type:
        description: "image/jpeg, image/png, or image/webp"
        required: true
        type: choice
        options:
          - image/jpeg
          - image/png
          - image/webp
      approved:
        description: "Explicit publication approval"
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: holytemples-approved-media-upload
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ inputs.approved }}
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      SERVICE_NAME: holytemples-adapter
    steps:
      - name: Validate request
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FILENAME: ${{ inputs.filename }}
          MIME_TYPE: ${{ inputs.mime_type }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_URL" == https://* ]] || { echo "::error::source_url must use HTTPS"; exit 1; }
          [[ "$FILENAME" =~ \.(jpg|jpeg|png|webp)$ ]] || { echo "::error::Unsupported filename extension"; exit 1; }
          case "$MIME_TYPE" in image/jpeg|image/png|image/webp) ;; *) exit 1 ;; esac

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Upload approved media
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          FILENAME: ${{ inputs.filename }}
          MIME_TYPE: ${{ inputs.mime_type }}
          OPERATOR_TOKEN: ${{ secrets.NEO_TEMPLE_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --location --proto '=https' --max-filesize 5242880 "$SOURCE_URL" -o /tmp/media
          test -s /tmp/media
          RESPONSE="$(curl --fail-with-body --silent --show-error -X POST "$URL/media" \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            -H "Content-Type: $MIME_TYPE" \
            -H "X-Temple-Approved: true" \
            -H "X-Filename: $FILENAME" \
            --data-binary @/tmp/media)"
          echo "$RESPONSE" | tee /tmp/response.json
          echo "Upload completed through protected HolyTemples media adapter." >> "$GITHUB_STEP_SUMMARY"
