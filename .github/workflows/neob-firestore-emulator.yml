name: NEO Bank Firestore Emulator Certification
on:
  pull_request:
    paths:
      - 'server/neo-bank/**'
      - '.github/workflows/neob-firestore-emulator.yml'
  workflow_dispatch:
jobs:
  ces-emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        run: |
          mkdir -p /tmp/neob022-tools
          cd /tmp/neob022-tools
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-tools@latest firebase-admin@latest
      - name: Execute genuine Firestore emulator certification
        env:
          NODE_PATH: /tmp/neob022-tools/node_modules
          GOOGLE_CLOUD_PROJECT: demo-neob022
          GCLOUD_PROJECT: demo-neob022
        run: |
          /tmp/neob022-tools/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-neob022 \
            --config server/neo-bank/firebase-emulator.json \
            "node --test server/neo-bank/firestore-emulator-cert.test.mjs"
