name: NEO VPN Discord Command Registration

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Register commands to a test guild or globally
        required: true
        type: choice
        default: guild
        options:
          - guild
          - global

permissions:
  contents: read

jobs:
  register:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: neo-vpn-discord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Discord activation preflight
        env:
          DISCORD_REGISTRATION_SCOPE: ${{ inputs.scope }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
          DISCORD_INTERACTIONS_ENDPOINT_URL: ${{ vars.DISCORD_INTERACTIONS_ENDPOINT_URL }}
          NEO_VPN_DISCORD_VIEWER_ROLE_IDS: ${{ vars.NEO_VPN_DISCORD_VIEWER_ROLE_IDS }}
          NEO_VPN_DISCORD_OPERATOR_ROLE_IDS: ${{ vars.NEO_VPN_DISCORD_OPERATOR_ROLE_IDS }}
          NEO_VPN_DISCORD_ADMIN_ROLE_IDS: ${{ vars.NEO_VPN_DISCORD_ADMIN_ROLE_IDS }}
        run: node services/neo-vpn/discord/activation-preflight.mjs

      - name: Register commands
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ inputs.scope == 'guild' && secrets.DISCORD_GUILD_ID || '' }}
        run: node services/neo-vpn/discord/register-commands.mjs
