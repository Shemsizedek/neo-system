name: Gate 116 Sovereign Secrets and KMS Fabric
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['architecture/neo-secrets-fabric-policy.json','server/neo-secrets/**','deploy/neo-secrets/**','infra/neo-secrets/**','package.json','.github/workflows/gate-116-sovereign-secrets.yml']
  pull_request:
    paths: ['architecture/neo-secrets-fabric-policy.json','server/neo-secrets/**','deploy/neo-secrets/**','infra/neo-secrets/**','package.json','.github/workflows/gate-116-sovereign-secrets.yml']
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Test secrets fabric
        run: npm run neo-secrets:test
      - name: Syntax-check service
        run: node --check server/neo-secrets/server.mjs
      - name: Validate container
        run: docker build -f deploy/neo-secrets/Dockerfile -t neo-secrets:gate116 .
