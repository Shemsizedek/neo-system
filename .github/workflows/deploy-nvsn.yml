name: Deploy NVSN Home Base

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/nvsn/**'
      - '.github/workflows/deploy-nvsn.yml'

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/nvsn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy NVSN and bind custom domain
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify home base
        working-directory: ${{ github.workspace }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 https://nvsn.holytemples.org/health | tee /tmp/nvsn-health.json; then
              grep -q '"version": "0.3.0"' /tmp/nvsn-health.json && exit 0
            fi
            sleep 10
          done
          echo '::error::NVSN custom domain did not become healthy after deployment.'
          exit 1
