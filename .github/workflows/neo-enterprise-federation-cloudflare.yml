name: Legacy NEO Enterprise Federation Cloudflare Deployment (Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm NEO Services three-plane standard
        run: |
          node - <<'NODE'
          const a=require('./architecture/neo-services-platform.json')
          if(a.planes.backend.primary!=='github') process.exit(1)
          if(a.planes.frontend.primary!=='github-pages') process.exit(1)
          if(a.planes.serverApi.primary!=='discord') process.exit(1)
          NODE
      - name: Legacy deployment notice
        run: |
          echo "Standalone Cloudflare deployment for NEO Enterprise Federation is disabled."
          echo "Backend: GitHub | Frontend: GitHub Pages | Server/API: Discord"
          echo "Cloudflare is permitted only as a thin Discord HTTPS transport bridge."
