name: Neoteric Storefront Verification
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "integrations/minicart/**"
      - "scripts/neoteric/**"
      - ".github/workflows/neoteric-storefront-verify.yml"
      - "ops/neoteric/**"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public Neoteric storefront
        run: node scripts/neoteric/verify-storefront.mjs
