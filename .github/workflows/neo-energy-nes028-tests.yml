name: NEO Energy NES-028 HTTP and DB privilege checks
on:
  pull_request:
    paths:
      - 'neo-energy/NES-027/**'
      - 'neo-energy/NES-028/**'
      - '.github/workflows/neo-energy-nes028-tests.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-fixture
          POSTGRES_DB: energy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d energy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-ci-fixture
      PGDATABASE: energy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pg dependency
        working-directory: neo-energy/NES-027
        run: npm install --no-save --ignore-scripts --no-audit --no-fund pg@8
      - run: node --test neo-energy/NES-028/test-http.mjs
      - run: psql -X -v ON_ERROR_STOP=1 -f neo-energy/NES-027/schema.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f neo-energy/NES-028/privilege-check.sql
