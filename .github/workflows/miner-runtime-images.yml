name: NEO Miner Runtime Images

on:
  push:
    branches: [main]
    paths:
      - 'server/miner-production/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/miner-runtime-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: neo-miner-runtime-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: production
            image: ghcr.io/shemsizedek/neo-system-miner-production
          - target: operator
            image: ghcr.io/shemsizedek/neo-system-miner-operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/miner-production/Dockerfile
          target: ${{ matrix.target }}
          push: true
          build-args: |
            NEO_BUILD_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ matrix.image }}:main
            ${{ matrix.image }}:${{ github.sha }}
          provenance: true
          sbom: true
