name: Verify NEO Hub Public Shell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-edge/product-static.mjs'
      - 'docs/neo-hub/**'
      - '.github/workflows/verify-neo-hub-shell.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify original NEO Hub shell
        run: |
          set -euo pipefail
          base='https://hub.holytemples.org'
          for path in / /health /api /api/identity/founder.json; do
            code="$(curl --connect-timeout 10 --max-time 30 --retry 4 --retry-delay 5 -sS -o /tmp/hub-response -w '%{http_code}' "$base$path" || true)"
            echo "$base$path -> $code" >> "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
            test -s /tmp/hub-response
          done
          curl -fsS "$base/" -o /tmp/hub-index.html
          grep -q 'Public Social Hub' /tmp/hub-index.html
          grep -q 'One network. Your world.' /tmp/hub-index.html
          grep -q 'Founder Account #1' /tmp/hub-index.html
          grep -q 'Noocratic Legal Corpus' /tmp/hub-index.html
          grep -q 'https://neo.holytemples.org/corpus/' /tmp/hub-index.html
          ! grep -qi 'service console' /tmp/hub-index.html
          curl -fsS "$base/api" -o /tmp/hub-api.json
          grep -q '"role":"canonical-public-hub"' /tmp/hub-api.json
          grep -q '"mode":"PUBLIC_PORTAL"' /tmp/hub-api.json
