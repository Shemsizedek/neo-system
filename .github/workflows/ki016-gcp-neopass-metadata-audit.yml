name: KI-016 NEOpass Production Signing Metadata Audit

# Read-only privileged metadata inspection. Manual dispatch ONLY. Never run WIF
# in a PR workflow or on unreviewed branch code; require protected environment.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  giss-issuer-metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: holytemples-production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail if protected production preflight configuration is incomplete
        shell: bash
        run: |
          set -euo pipefail
          for value in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT; do
            test -n "$(printenv "$value")" || { echo "::error::GCP metadata audit configuration missing"; exit 1; }
          done
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject any non-main workflow dispatch before requesting cloud credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::KI-021 audit may run from reviewed main only."
            exit 1
          fi
      - name: Inspect GISS metadata and exact secret-level IAM policy without disclosing identities
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$RUNNER_TEMP"
          if ! gcloud run services describe neo-temple-giss \
              --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
              --format=json > "$RUNNER_TEMP/ki021-giss.json" \
              2> "$RUNNER_TEMP/ki021-run-error.txt"; then
            echo "::error::KI-021 Cloud Run metadata unavailable. Verify protected WIF/IAM, API status, and approved project billing."
            exit 1
          fi
          node scripts/ki021-neopass-secret-iam-audit.mjs extract-ref \
            "$RUNNER_TEMP/ki021-giss.json" "$RUNNER_TEMP/ki021-secret.ref"
          # The secret ID is validated and read only from a private temp file;
          # no secret value, service-account identifier, or IAM policy is echoed.
          if ! gcloud secrets get-iam-policy "$(cat "$RUNNER_TEMP/ki021-secret.ref")" \
              --project="$GCP_PROJECT_ID" --format=json \
              > "$RUNNER_TEMP/ki021-secret-policy.json" \
              2> "$RUNNER_TEMP/ki021-iam-error.txt"; then
            if grep -Eqi '(BILLING_DISABLED|billing.*(disabled|enable|required))' "$RUNNER_TEMP/ki021-iam-error.txt"; then
              echo "::error::KI-021 BLOCKED_GCP_BILLING. Do not change billing without explicit approval."
            elif grep -Eqi '(PERMISSION_DENIED|permission denied|403)' "$RUNNER_TEMP/ki021-iam-error.txt"; then
              echo "::error::KI-021 BLOCKED_IAM_PERMISSION. A protected, read-only IAM reviewer is required."
            else
              echo "::error::KI-021 BLOCKED_POLICY_UNAVAILABLE. Secret-level policy retrieval failed."
            fi
            exit 1
          fi
          node scripts/ki021-neopass-secret-iam-audit.mjs evaluate \
            "$RUNNER_TEMP/ki021-giss.json" "$RUNNER_TEMP/ki021-secret-policy.json"
          echo 'KI-021: direct secret-level IAM binding observed through protected, read-only metadata.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Effective runtime secret access, live NEOpass identities, production backups and knowledge-write authorization are NOT certified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Erase protected Cloud Run metadata, policy and diagnostic files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ki021-giss.json" \
                "$RUNNER_TEMP/ki021-secret.ref" \
                "$RUNNER_TEMP/ki021-secret-policy.json" \
                "$RUNNER_TEMP/ki021-run-error.txt" \
                "$RUNNER_TEMP/ki021-iam-error.txt"
