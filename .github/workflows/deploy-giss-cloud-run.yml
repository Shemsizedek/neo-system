name: Deploy Temple GISS to Cloud Run
# Operations redeploy marker: 2026-10-04 — revalidate eGov/NEOpass production boundary.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/neo-platform-api/**'
      - 'server/neo-prime/**'
      - 'infra/oci/neo-system-services.json'
      - '.github/workflows/deploy-giss-cloud-run.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: temple-giss-cloud-run
  cancel-in-progress: false

env:
  SERVICE_NAME: neo-temple-giss
  NEOPASS_SECRET_NAME: neo-pass-jwt-secret
  GOOGLE_OAUTH_CLIENT_ID: 61704167834-leu32ev71q1oge7hqufqg5cjgfslm7ts.apps.googleusercontent.com
  NEO_EXECUTIVE_ADMIN_EMAIL: NooneUniversity@gmail.com
  NEO_EXECUTIVE_ADMIN_USERNAME: Shemsizedek
  NEOPASS_CROWN_OPERATOR_SECRET: neopass-crown-operator-token
  NEO_PAY_CROWN_OPERATOR_SECRET: neo-pay-crown-operator-token
  NOMNI_TREASURY_CROWN_OPERATOR_SECRET: nomni-treasury-crown-operator-token
  NOUS_OS_CROWN_OPERATOR_SECRET: nous-os-crown-operator-token

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
      NEO_TEMPLE_FIRESTORE_DATABASE: ${{ vars.NEO_TEMPLE_FIRESTORE_DATABASE || '(default)' }}
      NEO_TEMPLE_FIRESTORE_LOCATION: ${{ vars.NEO_TEMPLE_FIRESTORE_LOCATION || 'nam5' }}
      NEO_PASS_JWT_ISSUER: ${{ vars.NEO_PASS_JWT_ISSUER }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate configuration
        env:
          NEO_PASS_JWT_SECRET: ${{ secrets.NEO_PASS_JWT_SECRET }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_RUN_RUNTIME_ACCOUNT GCP_ARTIFACT_REGISTRY NEO_PASS_JWT_SECRET GOOGLE_OAUTH_CLIENT_ID; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
      - name: Test GISS runtime
        run: node --test server/neo-platform-api/*.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Ensure Firestore production database
        run: |
          set -euo pipefail
          if ! gcloud firestore databases describe --project="$GCP_PROJECT_ID" --database="$NEO_TEMPLE_FIRESTORE_DATABASE" >/dev/null 2>&1; then
            gcloud firestore databases create \
              --project="$GCP_PROJECT_ID" \
              --database="$NEO_TEMPLE_FIRESTORE_DATABASE" \
              --location="$NEO_TEMPLE_FIRESTORE_LOCATION" \
              --type=firestore-native \
              --delete-protection \
              --quiet
          fi
      - name: Build and push
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-temple-giss:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f server/neo-platform-api/Dockerfile.giss -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Validate pre-provisioned runtime access
        run: |
          set -euo pipefail
          for secret in "$NEOPASS_SECRET_NAME" "$NEOPASS_CROWN_OPERATOR_SECRET" "$NEO_PAY_CROWN_OPERATOR_SECRET" "$NOMNI_TREASURY_CROWN_OPERATOR_SECRET" "$NOUS_OS_CROWN_OPERATOR_SECRET"; do
            gcloud secrets describe "$secret" --project="$GCP_PROJECT_ID" >/dev/null || {
              echo "::error::Secret $secret is not provisioned. Runtime IAM and secrets are infrastructure prerequisites, not deployment-time mutations."
              exit 1
            }
          done
          for service in neopass-crown-agent neo-pay-crown-agent nomni-treasury-crown-agent nous-os-crown-agent; do
            gcloud run services describe "$service" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)' | grep -q '^https://'
          done
      - name: Deploy
        env:
          IMAGE: ${{ env.GCP_ARTIFACT_REGISTRY }}/neo-temple-giss:${{ github.sha }}
        run: |
          set -euo pipefail
          NEOPASS_AGENT_URL="$(gcloud run services describe neopass-crown-agent --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          NEO_PAY_AGENT_URL="$(gcloud run services describe neo-pay-crown-agent --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          NOMNI_TREASURY_AGENT_URL="$(gcloud run services describe nomni-treasury-crown-agent --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          NOUS_OS_AGENT_URL="$(gcloud run services describe nous-os-crown-agent --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          ENV_VARS="GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,NEO_TEMPLE_FIRESTORE_DATABASE=$NEO_TEMPLE_FIRESTORE_DATABASE,GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID,NEO_EXECUTIVE_ADMIN_EMAIL=$NEO_EXECUTIVE_ADMIN_EMAIL,NEO_EXECUTIVE_ADMIN_USERNAME=$NEO_EXECUTIVE_ADMIN_USERNAME,NEOPASS_CROWN_AGENT_URL=$NEOPASS_AGENT_URL,NEO_PAY_CROWN_AGENT_URL=$NEO_PAY_AGENT_URL,NOMNI_TREASURY_CROWN_AGENT_URL=$NOMNI_TREASURY_AGENT_URL,NOUS_OS_CROWN_AGENT_URL=$NOUS_OS_AGENT_URL,NEOPAY_BROADCAST_ENABLED=false"
          if [ -n "${NEO_PASS_JWT_ISSUER:-}" ]; then ENV_VARS="$ENV_VARS,NEO_PASS_JWT_ISSUER=$NEO_PASS_JWT_ISSUER"; fi
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT" \
            --set-env-vars="$ENV_VARS" \
            --set-secrets="NEO_PASS_JWT_SECRET=$NEOPASS_SECRET_NAME:latest,NEOPASS_CROWN_OPERATOR_TOKEN=$NEOPASS_CROWN_OPERATOR_SECRET:latest,NEO_PAY_CROWN_OPERATOR_TOKEN=$NEO_PAY_CROWN_OPERATOR_SECRET:latest,NOMNI_TREASURY_CROWN_OPERATOR_TOKEN=$NOMNI_TREASURY_CROWN_OPERATOR_SECRET:latest,NOUS_OS_CROWN_OPERATOR_TOKEN=$NOUS_OS_CROWN_OPERATOR_SECRET:latest" \
            --allow-unauthenticated \
            --quiet
      - name: Verify production boundary
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/health")" = 200
          grep -q '"giss":"ready"' /tmp/health.json
          CRM_STATUS=000
          for attempt in {1..12}; do
            CRM_STATUS="$(curl -sS -o /tmp/crm-health.json -w '%{http_code}' "$URL/health/crm")"
            test "$CRM_STATUS" = 200 && break
            sleep 5
          done
          test "$CRM_STATUS" = 200
          grep -q '"status":"ready"' /tmp/crm-health.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/v1/temple/giss/eligibility")" = 401
          test "$(curl -sS -o /tmp/nomni-unauth.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$URL/api/v1/nomni/treasury/proposals")" = 401
          test "$(curl -sS -o /tmp/neopay-unauth.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$URL/api/v1/neopay/broadcast")" = 401
          test "$(curl -sS -o /tmp/nous-unauth.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$URL/api/v1/commands/execute")" = 401

          declare -A agent_services=(
            [neopass-crown-agent]="$NEOPASS_CROWN_OPERATOR_SECRET|neopass.signer.request"
            [neo-pay-crown-agent]="$NEO_PAY_CROWN_OPERATOR_SECRET|neo-pay.payment.request"
            [nomni-treasury-crown-agent]="$NOMNI_TREASURY_CROWN_OPERATOR_SECRET|nomni.treasury.propose"
            [nous-os-crown-agent]="$NOUS_OS_CROWN_OPERATOR_SECRET|crown.workflow.orchestrate"
          )
          for service in "${!agent_services[@]}"; do
            IFS='|' read -r secret scope <<< "${agent_services[$service]}"
            agent_url="$(gcloud run services describe "$service" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
            operator_token="$(gcloud secrets versions access latest --secret="$secret" --project="$GCP_PROJECT_ID" | tr -d '\r\n')"
            payload="$(printf '{"scopes":["%s"]}' "$scope")"
            curl -fsS -X POST -H "Authorization: Bearer $operator_token" -H 'content-type: application/json' --data "$payload" "$agent_url/crown/prove" >/tmp/crown-proof.json
            jq -e --arg scope "$scope" '.verified == true and (.scopes | index($scope) != null) and .private_key_exposed == false' /tmp/crown-proof.json >/dev/null
          done
          echo "CROWN-036 Tier-1 service proofs PASS; NEOpay broadcast remains disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "Temple GISS: $URL" >> "$GITHUB_STEP_SUMMARY"
