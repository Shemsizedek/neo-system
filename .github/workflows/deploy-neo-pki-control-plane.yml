name: Deploy NEO PKI Control Plane
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/neo-pki/**','deploy/neo-pki/**','architecture/neo-sovereign-identity-policy.json','.github/workflows/deploy-neo-pki-control-plane.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: neo-pki-control-plane
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: holytemples-production
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT || secrets.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_RUNTIME_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_ACCOUNT || secrets.GCP_CLOUD_RUN_RUNTIME_ACCOUNT }}
      GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY || secrets.GCP_ARTIFACT_REGISTRY }}
      SERVICE_NAME: neo-pki
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Test PKI fabric
        run: npm run neo-pki:test
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push PKI image
        env: {IMAGE: "${{ env.GCP_ARTIFACT_REGISTRY }}/neo-pki:${{ github.sha }}"}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f deploy/neo-pki/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy PKI control plane
        env: {IMAGE: "${{ env.GCP_ARTIFACT_REGISTRY }}/neo-pki:${{ github.sha }}"}
        run: |
          set -euo pipefail
          for secret in neo-pki-operator-token neo-pki-issuer-private-key-pem neo-pki-issuer-public-key-pem; do
            gcloud secrets describe "$secret" --project="$GCP_PROJECT_ID" >/dev/null
          done
          gcloud run deploy "$SERVICE_NAME"             --project="$GCP_PROJECT_ID"             --region="$GCP_REGION"             --image="$IMAGE"             --service-account="$GCP_CLOUD_RUN_RUNTIME_ACCOUNT"             --port=8080             --allow-unauthenticated             --set-env-vars="NEO_PKI_ISSUER_ID=estate-intermediate-1"             --set-secrets="NEO_PKI_OPERATOR_TOKEN=neo-pki-operator-token:latest,NEO_PKI_ISSUER_PRIVATE_KEY_PEM=neo-pki-issuer-private-key-pem:latest,NEO_PKI_ISSUER_PUBLIC_KEY_PEM=neo-pki-issuer-public-key-pem:latest"             --quiet
      - name: Verify public PKI posture
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          test "$(curl --retry 5 --retry-delay 3 -sS -o /tmp/pki-health.json -w '%{http_code}' "$SERVICE_URL/health")" = 200
          test "$(curl --retry 5 --retry-delay 3 -sS -o /tmp/pki-estate.json -w '%{http_code}' "$SERVICE_URL/v1/estate/identity")" = 200
