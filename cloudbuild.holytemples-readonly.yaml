steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/holytemples-readonly/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/neo-system/neo-system-api:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/neo-system/neo-system-api:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - neo-system-api
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/neo-system/neo-system-api:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if gcloud run domain-mappings describe --domain=neo.holytemples.org --region=us-central1 >/dev/null 2>&1; then
          echo "Cloud Run domain mapping already exists for neo.holytemples.org"
        else
          gcloud run domain-mappings create \
            --service=neo-system-api \
            --domain=neo.holytemples.org \
            --region=us-central1 \
            --quiet
        fi

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/neo-system/neo-system-api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
