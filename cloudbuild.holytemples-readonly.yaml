steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/holytemples-readonly/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/neo-system/holytemples-readonly:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/neo-system/holytemples-readonly:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - holytemples-readonly
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/neo-system/holytemples-readonly:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --quiet

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/neo-system/holytemples-readonly:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
