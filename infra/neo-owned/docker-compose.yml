services:
  neo-edge:
    build:
      context: ../..
      dockerfile: deploy/neo-edge/Dockerfile
    restart: unless-stopped
    ports:
      - "${NEO_EDGE_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-http://neo-ai-gateway:8080}
    depends_on:
      neo-ai-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
  neo-ai-gateway:
    build:
      context: ../..
      dockerfile: server/neo-router/Dockerfile.ai-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  default:
    name: neo-sovereign
