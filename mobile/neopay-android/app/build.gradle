plugins { id 'com.android.application' }

android {
    namespace 'world.neo.neopay'
    compileSdk 35

    defaultConfig {
        applicationId 'world.neo.neopay'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
