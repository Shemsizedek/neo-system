name: Publish NEO Bank Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neo-bank-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bank-only website
        uses: actions/checkout@v4
      - name: Validate NEO Bank static frontend
        run: |
          test -s index.html
          test -s preview.css
          test -s preview.js
          test -s site-status.json
          node --check preview.js
          node --test preview.test.mjs
          ! grep -E 'src="/preview.js"|href="/preview.css"|<form\b' index.html
          node -e "const x=require('./site-status.json'); if(x.accountServices!==false||x.financialWrites!==false)process.exit(1)"
      - name: Assemble isolated website artifact
        run: |
          mkdir -p _site
          cp index.html preview.css preview.js site-status.json _site/
          if [ -f CNAME ]; then
            test "$(cat CNAME)" = 'neobank.holytemples.org'
            cp CNAME _site/CNAME
          fi
          test ! -e _site/.env
          test ! -e _site/.github
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload NEO Bank website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy NEO Bank website
        id: deployment
        uses: actions/deploy-pages@v4
