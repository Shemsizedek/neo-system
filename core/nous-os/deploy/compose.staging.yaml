# Local/private staging only. No public exposure and no automatic production deploy.
services:
  nous-os:
    profiles: ["nous-staging"]
    build:
      context: ../../..
      dockerfile: core/nous-os/Dockerfile
    read_only: true
    volumes: ["nous-receipts:/app/state"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports: ["127.0.0.1:18080:8080"]
    environment:
      NOUS_HOST: 0.0.0.0
      PORT: 8080
      NOUS_STATE_DIR: /app/state
      NOUS_IDENTITY_ISSUER: ${NOUS_IDENTITY_ISSUER:?required}
      NOUS_IDENTITY_AUDIENCE: ${NOUS_IDENTITY_AUDIENCE:?required}
      NOUS_IDENTITY_PUBLIC_KEY_PEM_BASE64: ${NOUS_IDENTITY_PUBLIC_KEY_PEM_BASE64:?required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nous-receipts:
