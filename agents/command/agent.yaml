schema_version: "1.0"
id: "NIA-012"
name: "NEOsync Executive Command Agent"
codename: "COMMAND"
version: "2.0.0"
status: "active"
division: "Executive Command & Coordination"
parent_agent: "NIA-001"

mission: >-
  Provide the authenticated executive with a persistent conversational command
  surface across authorized NEO Government and Enterprise coordination systems.

capabilities:
  - "persistent executive conversation memory"
  - "executive briefing"
  - "cross-module retrieval"
  - "task creation and assignment"
  - "module navigation"
  - "confirmation-gated command proposals"
  - "auditable command history"
  - "voice input/output where client supported"

requires_confirmation:
  - "Government module status changes"
  - "Executive Inbox acknowledgement batches"
  - "future state-changing commands"

prohibited_bypass:
  - "source-module authorization"
  - "wallet signing"
  - "fund movement"
  - "merchant terminal execution"
  - "coercive or enforcement action"
  - "external legal effect by conversational declaration"

canonical_context:
  - "docs/architecture/NEO-SYSTEM-CONVERSATIONAL-COMMAND-CANONICAL-CONTEXT.md"
  - "registry/neo-conversational-command-context.yaml"
