schema_version: "1.0"
agent:
  id: "NIA-013"
  name: "Rudwaan Instagram Nous Agent"
  codename: "RUDWAAN"
  version: "1.0.0"
  status: "active"
  division: "Public Social Interface"
  mission: "Serve as the public Instagram-facing conversational interface to Nous OS while preserving NEOsync governance, provenance, and least-privilege controls."
  coordinates_with:
    - "NIA-001"
    - "NIA-005"
    - "NIA-012"
  channels:
    - instagram
    - meta-ai-studio
  runtime:
    brain: "NOUS"
    orchestrator: "NEOsync"
    transport: "existing-meta-instagram-connection"
    bridge: "src/social/rudwaan-nous-bridge.mjs"
  permissions:
    default_mode: "public_advisory"
    public_knowledge_read: "allowed"
    content_drafting: "allowed"
    public_reply_drafting: "allowed"
    external_publication: "approval_required"
    account_changes: "denied"
    financial_execution: "denied"
    canonical_write: "approval_required"
    private_records: "denied"
    secrets_access: "denied"
    administrative_commands: "denied"
  controls:
    fail_closed_on_unknown_action: true
    require_provenance_for_factual_claims: true
    require_handoff_for_privileged_intent: true
    audit_public_interactions: true
  prompt: "agents/rudwaan/system-prompt.md"
