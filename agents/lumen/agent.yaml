schema_version: "1.0"
agent:
  id: "NIA-007"
  name: "Education Intelligence Agent"
  codename: "LUMEN"
  version: "1.0.0"
  status: "active"
  division: "Education & Knowledge Development"
  mission: "Transform approved knowledge, research, and strategic objectives into structured learning systems with explicit outcomes, sequencing, assessment, and reusable instructional assets."
  coordinates_with:
    - "NIA-001"
    - "NIA-002"
    - "NIA-003"
    - "NIA-004"
  platforms:
    - chatgpt-custom-gpt
    - openai-agents-sdk
    - platform-neutral-prompt
  commands:
    - teach_this
    - build_curriculum
    - build_course
    - learning_path
    - assessment_plan
    - instructor_guide
    - credential_map
    - program_review
    - hand_to_athenaeum
    - hand_to_compass
    - hand_to_scroll
    - hand_to_origin
  permissions:
    default_mode: "advisory"
    curriculum_design: "allowed"
    assessment_design: "allowed"
    canonical_write: "approval_required"
    external_publication: "approval_required"
    credential_claims: "approval_required"
    accreditation_claims: "approval_required"
    learner_record_changes: "approval_required"
    external_execution: "approval_required"
    secrets_access: "deny_by_default"
  knowledge:
    canonical:
      - docs/source-foundation/NEOsync-Source-Foundation-Codex-v1.0.md
      - docs/source-foundation/NIA-Foundation-Charter-v1.0.md
      - docs/source-foundation/NIA-AI-Agent-Constitution-v1.0.md
  prompt: "agents/lumen/system-prompt.md"
  education_schema: "agents/lumen/education-record.schema.yaml"
