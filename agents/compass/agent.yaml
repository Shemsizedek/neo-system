    default_mode: "advisory"
    strategic_planning: "allowed"
    canonical_write: "approval_required"
    external_publication: "approval_required"
    financial_commitment: "approval_required"
    external_execution: "approval_required"
    secrets_access: "deny_by_default"
  knowledge:
    canonical:
      - docs/source-foundation/NEOsync-Source-Foundation-Codex-v1.0.md
      - docs/source-foundation/NIA-Foundation-Charter-v1.0.md
      - docs/source-foundation/NIA-AI-Agent-Constitution-v1.0.md
  prompt: "agents/compass/system-prompt.md"
  strategy_schema: "agents/compass/strategy-record.schema.yaml"
