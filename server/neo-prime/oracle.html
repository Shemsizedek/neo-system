<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEO Oracle</title><meta name="description" content="NEO Oracle — public reasoning surface powered by NEO Prime.">
<style>
:root{--g:#65ff8a;--bg:#010503;--p:#06110b;--line:#17452b;--text:#edfff2;--muted:#8da895;--danger:#ff7b7b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#0b2819,#010503 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:900px;margin:auto;min-height:100dvh;padding:18px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.orb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#d9ffe1,var(--g),#087a39);color:#00200b;font-size:22px;box-shadow:0 0 28px #65ff8a33}.status{font-size:11px;color:var(--muted)}.status.live{color:var(--g)}.tools{display:flex;gap:7px}.icon{border:1px solid var(--line);background:#041009;color:var(--text);border-radius:12px;padding:8px 10px;font-weight:700}.hero{text-align:center;padding:58px 0 24px}.hero h1{font-size:42px;margin:0}.hero p{color:var(--muted);font-size:17px}.ideas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.idea{border:1px solid var(--line);background:var(--p);border-radius:18px;padding:16px;color:#dfffe7;cursor:pointer;text-align:left}.thread{display:flex;flex-direction:column;gap:12px;margin:24px 0}.msg{border:1px solid var(--line);background:var(--p);border-radius:18px;padding:14px 16px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.msg.user{margin-left:12%;border-color:#2d7046}.msg.oracle{margin-right:12%}.msg.error{border-color:#8c3434;color:#ffd8d8}.meta{font-size:10px;color:var(--muted);margin-top:8px}.actions{display:flex;gap:6px;margin-top:9px}.mini{font-size:11px;padding:5px 8px;background:#0a1c11;color:var(--muted);border:1px solid var(--line);border-radius:9px}.composer{margin-top:auto;position:sticky;bottom:0;padding:18px 0 max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#010503 25%)}form{display:flex;gap:8px;align-items:flex-end;border:1px solid #2d7046;background:#041009;padding:8px;border-radius:20px}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:white;padding:9px;font:inherit;min-height:46px;max-height:160px}.send{border:0;border-radius:14px;background:var(--g);color:#00200b;font-weight:900;width:46px;height:46px;cursor:pointer}.send:disabled{opacity:.55;cursor:wait}.mic{border:0;background:transparent;color:var(--muted);font-size:20px;width:40px;height:46px;cursor:pointer}.mic.on{color:var(--g)}.note{text-align:center;color:#587060;font-size:10px;margin-top:8px}.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--g);animation:b 1s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes b{to{opacity:.25;transform:translateY(-3px)}}@media(max-width:560px){.ideas{grid-template-columns:1fr}.hero{padding-top:42px}.hero h1{font-size:34px}.msg.user,.msg.oracle{margin-left:0;margin-right:0}.domain{display:none}}
</style></head><body><main class="app">
<header class="top"><div class="brand"><div class="orb">✦</div><div><strong>NEO ORACLE</strong><div id="status" class="status">CONNECTING TO NEO PRIME…</div></div></div><div class="tools"><button class="icon" id="newChat" title="New conversation">＋</button><button class="icon" id="clearChat" title="Clear conversation">⌫</button><div class="status domain">oracle.holytemples.org</div></div></header>
<section class="hero" id="hero"><h1>What can I help you understand?</h1><p>Ask, research, plan, compare, and navigate the NEO ecosystem through NEO Prime.</p></section>
<section class="ideas" id="ideas"><button class="idea" data-seed="Explain Bitcoin and Counterparty in simple terms">Learn Bitcoin + XCP</button><button class="idea" data-seed="Help me explore the NEO ecosystem">Explore NEO</button><button class="idea" data-seed="Help me plan a project">Plan a project</button><button class="idea" data-seed="Analyze this claim carefully and show uncertainty: ">Analyze a claim</button></section>
<section id="thread" class="thread" aria-live="polite"></section>
<div class="composer"><form id="form"><textarea id="q" rows="1" placeholder="Message NEO Oracle" aria-label="Message NEO Oracle"></textarea><button id="mic" class="mic" type="button" title="Voice input">◉</button><button id="send" class="send" type="submit" aria-label="Send">↑</button></form><div class="note">Enter to send · Shift+Enter for a new line · Public reasoning boundary protected by NEO Guard.</div></div>
</main><script>
const $=id=>document.getElementById(id),q=$('q'),thread=$('thread'),send=$('send'),statusEl=$('status'),ideas=$('ideas'),hero=$('hero'),mic=$('mic');
const KEY='neo-oracle-thread-v2';let busy=false,controller=null;
function escapeText(v){return String(v??'')}
function save(){localStorage.setItem(KEY,JSON.stringify([...thread.querySelectorAll('.msg[data-role]')].map(x=>({role:x.dataset.role,text:x.dataset.text||x.firstChild?.textContent||''}))))}
function setEmpty(){const empty=!thread.children.length;ideas.hidden=!empty;hero.hidden=!empty}
function add(role,text,cls='',persist=true,meta=''){const el=document.createElement('div');el.className=`msg ${role} ${cls}`;el.dataset.role=role;el.dataset.text=escapeText(text);const body=document.createElement('div');body.textContent=escapeText(text);el.appendChild(body);if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;el.appendChild(m)}if(role==='oracle'&&!cls.includes('pending')){const a=document.createElement('div');a.className='actions';const copy=document.createElement('button');copy.className='mini';copy.textContent='Copy';copy.onclick=async()=>{await navigator.clipboard.writeText(el.dataset.text);copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy',900)};const speak=document.createElement('button');speak.className='mini';speak.textContent='Listen';speak.onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(el.dataset.text))};a.append(copy,speak);el.appendChild(a)}thread.appendChild(el);setEmpty();el.scrollIntoView({behavior:'smooth',block:'end'});if(persist)save();return el}
function pending(){const el=document.createElement('div');el.className='msg oracle pending';el.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';thread.appendChild(el);setEmpty();return el}
function restore(){try{const items=JSON.parse(localStorage.getItem(KEY)||'[]');items.forEach(x=>add(x.role,x.text,'',false));}catch{}setEmpty()}
async function health(){try{const r=await fetch('/healthz',{cache:'no-store'}),j=await r.json();if(r.ok&&j.ok){statusEl.textContent=`NEO PRIME LIVE${j.configuredProviders?` · ${j.configuredProviders} PROVIDER${j.configuredProviders===1?'':'S'}`:''}`;statusEl.classList.add('live');return}throw new Error()}catch{statusEl.textContent='NEO PRIME DEGRADED · RETRYING';statusEl.classList.remove('live');setTimeout(health,10000)}}
async function ask(text){if(busy)return;busy=true;add('user',text);send.disabled=true;controller=new AbortController();const wait=pending();try{const r=await fetch('/api/oracle',{method:'POST',headers:{'content-type':'application/json'},signal:controller.signal,body:JSON.stringify({missionId:'oracle-'+crypto.randomUUID(),objective:text,capability:'reasoning',requestedAction:'analyze',preferredProviders:['gemini'],maxTokens:1400})});const j=await r.json();wait.remove();if(r.status===202){add('oracle',j.text||'NEO Guard requires operator approval for that request.','',true,`Guard · ${j.risk||'protected'}`);return}if(!r.ok)throw new Error(j.message||j.error||`Request failed (${r.status})`);add('oracle',j.text||'NEO Oracle completed the request.','',true,[j.route?.provider,j.risk].filter(Boolean).join(' · '))}catch(e){wait.remove();if(e.name!=='AbortError')add('oracle',`Oracle is temporarily unavailable: ${e.message}`,'error')}finally{busy=false;send.disabled=false;controller=null;q.focus();save()}}
function submit(){const text=q.value.trim();if(!text||busy)return;q.value='';resize();ask(text)}function resize(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,160)+'px'}
$('form').addEventListener('submit',e=>{e.preventDefault();submit()});q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});q.addEventListener('input',resize);document.querySelectorAll('[data-seed]').forEach(b=>b.onclick=()=>{q.value=b.dataset.seed;resize();q.focus()});
$('newChat').onclick=()=>{thread.innerHTML='';localStorage.removeItem(KEY);setEmpty();q.focus()};$('clearChat').onclick=$('newChat').onclick;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.onstart=()=>mic.classList.add('on');rec.onend=()=>mic.classList.remove('on');rec.onresult=e=>{q.value=(q.value+' '+e.results[0][0].transcript).trim();resize();q.focus()};mic.onclick=()=>rec.start()}else{mic.hidden=true}
restore();health();
</script></body></html>
