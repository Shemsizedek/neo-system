<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO Lingo</title><link rel="stylesheet" href="../public-workspace/styles.css"></head><body><main class="app"><header class="top"><div class="brand"><div class="mark">∞</div><div><strong>NEO LINGO</strong><div class="muted">Public language & terminology</div></div></div><a href="../neo-hub/">NEO Hub</a></header><section class="hero"><h1>Understand NEO language.</h1><p>Translate specialized NEO terminology into plain language while preserving the original concept and source vocabulary.</p></section><section class="grid"><article class="card" style="grid-column:span 2"><h2>Term Explorer</h2><div class="row"><input id="q" placeholder="Enter a NEO term or phrase"><button class="btn" onclick="lookup()">Explain</button></div><div id="results" class="results"></div></article><article class="card"><h2>Quick Terms</h2><div class="results"><button class="btn ghost" onclick="fill('Noology')">Noology</button><button class="btn ghost" onclick="fill('NOMNI')">NOMNI</button><button class="btn ghost" onclick="fill('NEOsync')">NEOsync</button><button class="btn ghost" onclick="fill('Pa Sarun')">Pa Sarun</button></div></article></section><div class="foot">NEO LINGO · PUBLIC SOCIAL SURFACE</div></main><script>const lex={noology:'The study and disciplined application of understanding, sound reasoning and the operations of mind within the NEO framework.',nomni:'A named NEO ecosystem asset and unit used in NEO financial and market concepts. Market or legal claims should be verified against live records.',neosync:'The private administrative name for the NEO AI role. The public-facing AI experience is NEO Oracle.', 'pa sarun':'The NEO naming framework used for terminology, titles and naming rules within its designated institutional context.'};function fill(x){q.value=x;lookup()}function lookup(){const k=q.value.trim().toLowerCase();const exact=lex[k];results.innerHTML='<div class="result"><strong>'+((q.value||'Term').replace(/[<>]/g,''))+'</strong><p>'+(exact||'No local glossary entry yet. Search Noogle for broader context and source material.')+'</p></div>'+(exact?'':'<a class="btn" style="display:inline-block;text-decoration:none;margin-top:8px" href="../noogle/?q='+encodeURIComponent(q.value)+'">Search Noogle</a>')}</script></body></html>
