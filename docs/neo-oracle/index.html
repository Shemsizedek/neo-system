<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO Oracle</title><style>:root{--g:#65ff8a;--bg:#010503;--p:#06110b;--line:#17452b;--text:#edfff2;--muted:#8da895}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0b2819,#010503 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:850px;margin:auto;min-height:100vh;padding:18px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.orb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#d9ffe1,var(--g),#087a39);color:#00200b;font-size:22px}.top a{color:#caffd5;text-decoration:none}.hero{text-align:center;padding:70px 0 30px}.hero h1{font-size:42px;margin:0}.hero p{color:var(--muted);font-size:17px}.ideas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.idea{border:1px solid var(--line);background:var(--p);border-radius:18px;padding:16px;color:#dfffe7;cursor:pointer}.composer{margin-top:auto;position:sticky;bottom:0;padding:18px 0;background:linear-gradient(transparent,#010503 25%)}form{display:flex;gap:8px;border:1px solid #2d7046;background:#041009;padding:8px;border-radius:20px}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:white;padding:9px;font:inherit;min-height:46px}button{border:0;border-radius:14px;background:var(--g);font-weight:900;padding:0 20px}.note{text-align:center;color:#587060;font-size:10px;margin-top:8px}@media(max-width:560px){.ideas{grid-template-columns:1fr}.hero{padding-top:50px}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="orb">✦</div><div><strong>NEO ORACLE</strong><div style="color:#8da895;font-size:11px">NEO AI</div></div></div><a href="../neo-hub/">NEO Hub</a></header><section class="hero"><h1>What can I help you do?</h1><p>Ask, research, plan, create and navigate the NEO ecosystem.</p></section><section class="ideas"><div class="idea" onclick="ask('Explain Bitcoin and Counterparty in simple terms')">Learn about Bitcoin + XCP</div><div class="idea" onclick="ask('Help me explore the NEO ecosystem')">Explore NEO</div><div class="idea" onclick="ask('Help me plan a project')">Plan a project</div><div class="idea" onclick="ask('Search the web for ') ">Research something</div></section><div class="composer"><form onsubmit="return send()"><textarea id="q" placeholder="Message NEO Oracle"></textarea><button>↑</button></form><div class="note">NEO Oracle is the public AI surface. Administrative NEOsync controls are not exposed here.</div></div></main><script>function ask(t){document.getElementById('q').value=t;document.getElementById('q').focus()}function send(){const q=document.getElementById('q').value.trim();if(!q)return false;location.href='../noogle/?q='+encodeURIComponent(q);return false}</script></body></html>
