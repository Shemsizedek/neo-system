<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO TV</title><style>body{margin:0;background:#050505;color:#fff;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:clamp(42px,8vw,92px);margin:60px 0 12px;line-height:.9}.muted{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:30px}.card{background:#111;border:1px solid #2d2d2d;border-radius:24px;padding:22px}.btn{display:inline-block;background:#fff;color:#000;text-decoration:none;border-radius:999px;padding:12px 17px;font-weight:800;margin:8px 8px 0 0}.ghost{background:#1d1d1d;color:#fff;border:1px solid #444}.badge{font-size:11px;border:1px solid #444;border-radius:999px;padding:5px 9px}.top{display:flex;justify-content:space-between;gap:10px}.apps{margin-top:50px}.brand{font-weight:900;letter-spacing:.12em}</style></head><body><main><header><div class="brand">NEO TV</div><a class="btn ghost" href="./">Entertainment Hub</a></header><section><h1>Watch what is live.</h1><p class="muted">Production gateway for verified public television and official streaming platforms. Provider playback stays with the authorized platform when direct embedding rights are not established.</p></section><section class="apps"><h2>Live Public TV & Platforms</h2><div id="platforms" class="grid"></div></section></main><script>async function boot(){const d=await fetch('./data/platforms.json').then(r=>r.json());document.getElementById('platforms').innerHTML=d.platforms.map(p=>`<article class="card"><div class="top"><strong>${p.name}</strong><span class="badge">${p.access}</span></div><p class="muted">${p.description}</p><a class="btn" href="${p.launchUrl}" target="_blank" rel="noopener">Watch Official</a>${p.liveUrl?`<a class="btn ghost" href="${p.liveUrl}" target="_blank" rel="noopener">Live / Schedule</a>`:''}</article>`).join('')}boot().catch(()=>document.getElementById('platforms').innerHTML='<p class="muted">Platform directory is temporarily unavailable.</p>')</script></body></html>
