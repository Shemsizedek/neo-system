<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO TV Guide</title><style>body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.back{color:#fff;text-decoration:none;border:1px solid #333;border-radius:999px;padding:10px 14px}.guide{display:grid;gap:12px;margin-top:24px}.channel{display:grid;grid-template-columns:180px 1fr;gap:12px}.name,.program{background:#111;border:1px solid #2a2a2a;border-radius:16px;padding:16px}.programs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.program small{color:#999}.badge{display:inline-block;margin-top:8px;border:1px solid #444;border-radius:999px;padding:4px 8px;font-size:11px}@media(max-width:700px){.channel{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div style="letter-spacing:.14em;text-transform:uppercase;color:#aaa;font-size:12px">NEO TV v0.4</div><h1>Guide & Channels</h1></div><a class="back" href="./">← NEO TV</a></div><p style="color:#aaa">Now/Next guide seed for NEO TV channels. Provider-backed EPG data can replace this static seed through the adapter layer.</p><div id="guide" class="guide"></div></div><script>Promise.all([fetch('./data/channels.json').then(r=>r.json()),fetch('./data/epg.json').then(r=>r.json())]).then(([c,e])=>{const root=document.getElementById('guide');root.innerHTML=(c.channels||[]).map(ch=>{const ps=(e.programs||[]).filter(p=>p.channelId===ch.id);return `<section class="channel"><div class="name"><strong>${ch.number} · ${ch.name}</strong><div style="color:#999;margin-top:6px">${ch.description||''}</div></div><div class="programs">${ps.length?ps.map(p=>`<article class="program"><strong>${p.title}</strong><div>${p.subtitle||''}</div><small>${p.start}–${p.end}</small><div class="badge">${p.category||'Program'}</div></article>`).join(''):'<div class="program">No schedule loaded.</div>'}</div></section>`}).join('')}).catch(()=>{document.getElementById('guide').textContent='Guide data unavailable.'})</script></body></html>
