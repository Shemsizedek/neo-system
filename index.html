<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="NEO Ecosystem — integrated digital systems, applications, research, finance, education, governance, and infrastructure." />
    <title>NEO Ecosystem</title>
    <style>
      .neo-launcher{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 28px)}
      .neo-launcher a{font:700 11px/1 system-ui,sans-serif;letter-spacing:.04em;text-decoration:none;color:#111;background:#c0a158;border:1px solid #d2b66f;border-radius:999px;padding:10px 12px;box-shadow:0 8px 24px #0008}
      .neo-launcher a:first-child{color:#f4f3ed;background:#111419;border-color:#353a43}
      @media(max-width:620px){.neo-launcher{left:10px;right:10px;bottom:10px}.neo-launcher a{flex:1;text-align:center;padding:10px 8px}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <nav class="neo-launcher" aria-label="NEO Ecosystem applications">
      <a href="#/">Command Center</a>
      <a href="#/miner">NEO Miner</a>
      <a href="#/wire">NEO Wire</a>
      <a href="#/explorer">NEO Explorer</a>
    </nav>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
