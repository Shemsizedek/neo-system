<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noogle Index Health</title><link rel="stylesheet" href="./styles.css"></head><body><main class="workspace"><section class="hero"><p class="eyebrow">OMNITRIX INDEX HEALTH</p><h1>Noogle source and index status.</h1><p class="hero-copy">Live visibility into the native Noogle index snapshot and allowlisted source registry.</p><p><a href="./">← Back to Noogle</a> · <a href="./submit.html">Submit a source</a></p></section><section class="content-grid"><div class="panel results-panel"><div class="panel-header"><h2>Index</h2><span id="indexBadge" class="badge">LOADING</span></div><div id="indexMetrics"></div></div><aside class="right-rail"><section class="panel intel-panel"><p class="eyebrow">SOURCE HEALTH</p><h3>Registry</h3><div id="sourceHealth" class="knowledge-card">Loading…</div></section></aside></section></main><script>(async()=>{const base='/neo-system/api/noogle/';const get=async p=>{const r=await fetch(base+p,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json()};try{const [idx,health]=await Promise.all([get('index.json'),get('source-health.json')]);document.getElementById('indexBadge').textContent='ONLINE';const docs=Array.isArray(idx.documents)?idx.documents:[];document.getElementById('indexMetrics').innerHTML=`<div class="metric-row"><span>Indexed documents</span><strong>${docs.length}</strong></div><div class="metric-row"><span>Generated</span><strong>${idx.generatedAt||'—'}</strong></div>`;const reachable=(health.sources||[]).filter(s=>s.status==='reachable').length;document.getElementById('sourceHealth').innerHTML=`<dl><dt>Total</dt><dd>${health.total||0}</dd><dt>Reachable</dt><dd>${reachable}</dd><dt>Checked</dt><dd>${health.generatedAt||'—'}</dd></dl>`}catch(e){document.getElementById('indexBadge').textContent='DEGRADED';document.getElementById('sourceHealth').textContent='Health data unavailable: '+e.message}})();</script></body></html>
