<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEO Shop | House of Negus</title>
<meta name="description" content="Shop the House of Negus official collection at NEO Shop.">
<link rel="canonical" href="https://shop.holytemples.org/">
<style>:root{font-family:Inter,system-ui,sans-serif;color:#163628;background:#f8faf7}*{box-sizing:border-box}body{margin:0}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,5vw,70px);background:white;border-bottom:1px solid #dce7df}header strong{font-size:22px;color:#11563b;letter-spacing:.12em}nav{display:flex;gap:22px}nav a{text-decoration:none;font-weight:600}.intro{max-width:1120px;margin:0 auto;padding:45px 22px 20px}.intro h1{font-size:clamp(34px,5vw,58px);margin:0 0 12px}.intro p{margin:0;color:#52675b;line-height:1.6}.shop{max-width:1260px;margin:auto;padding:8px 15px 60px;min-height:450px}#myShop{min-height:360px}#shopStatus{padding:12px 0;color:#566b5b}footer{text-align:center;background:#0a3425;color:#e0f1e7;padding:28px}footer a{margin-left:16px}@media(max-width:550px){nav{gap:12px;font-size:13px}header strong{font-size:17px}}</style>
</head><body><div id="root"></div>
<script type="module">
import React from 'https://esm.sh/react@19.1.0';
import {createRoot} from 'https://esm.sh/react-dom@19.1.0/client';
import {flushSync} from 'https://esm.sh/react-dom@19.1.0';
const h=React.createElement;
function App(){return h(React.Fragment,null,
h('header',null,h('strong',null,'NEO SHOP'),h('nav',null,h('a',{href:'https://holytemples.org'},'World Temple'),h('a',{href:'https://neo.holytemples.org'},'NEO'))),
h('main',null,h('section',{className:'intro'},h('h1',null,'House of Negus'),h('p',null,'Explore our collection. Products, prices, and checkout are provided directly within the store.')),
h('section',{className:'shop','aria-label':'NEO Shop'},h('p',{id:'shopStatus',role:'status','aria-live':'polite'},'Loading store…'),h('div',{id:'myShop'}))),
h('footer',null,'NEO Shop · ',h('a',{href:'https://holytemples.org'},'World Temple')))}
flushSync(()=>createRoot(document.getElementById('root')).render(h(App)));
window.spread_shop_config={shopName:'Shemsizedek',locale:'us_US',prefix:'https://Shemsizedek.myspreadshop.com',baseId:'myShop'};
const status=document.getElementById('shopStatus');
const loader=document.createElement('script');loader.src='https://Shemsizedek.myspreadshop.com/js/shopclient.nocache.js';loader.async=true;
loader.onload=()=>{status.textContent='';};
loader.onerror=()=>{status.textContent='Store content is temporarily unavailable. Please try again shortly.';};
document.body.appendChild(loader);
</script></body></html>
