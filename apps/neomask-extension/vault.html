<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeoMask wallet vault</title><link rel="stylesheet" href="popup.css"></head><body><main><p class="brand">NEOMASK · LOCAL WALLET VAULT</p><h1>Your keys stay here.</h1><p id="status" role="status"></p><button type="button" id="create">Generate a new Bitcoin wallet</button><p id="backup" role="status"></p><form id="import"><label>Import your existing compressed mainnet WIF, or back up a newly generated WIF<textarea id="wif" required rows="4" autocomplete="off" spellcheck="false" style="width:100%"></textarea></label><p>WIF entry happens only in this extension page. Do not paste a wallet secret into a website or chat. A new wallet does not control your existing treasury.</p><label>Vault password (at least 12 characters)<input id="password" type="password" minlength="12" maxlength="1024" required autocomplete="new-password"></label><label>Confirm password<input id="confirm" type="password" minlength="12" maxlength="1024" required autocomplete="new-password"></label><label><input type="checkbox" required>I have a secure recovery backup. Losing the password and backup can make funds inaccessible.</label><button type="submit">Encrypt and save wallet locally</button></form></main><script type="module" src="vault-ui.mjs"></script></body></html>
