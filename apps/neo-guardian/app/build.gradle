plugins {
    id 'com.android.application'
}

android {
    namespace 'org.neosystem.guardian'
    compileSdk 35

    defaultConfig {
        applicationId 'org.neosystem.guardian'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
