plugins {
    id 'com.android.application'
}

android {
    namespace 'org.neosystem.guardian'
    compileSdk 35

    defaultConfig {
        applicationId 'org.neosystem.guardian'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '3.0.0'
    }

    signingConfigs {
        release {
            def releasePath = System.getenv('GUARDIAN_KEYSTORE_PATH')
            if (releasePath) {
                storeFile file(releasePath)
                storePassword System.getenv('GUARDIAN_STORE_PASSWORD')
                keyAlias System.getenv('GUARDIAN_KEY_ALIAS')
                keyPassword System.getenv('GUARDIAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (System.getenv('GUARDIAN_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
