services:
  - type: web
    name: noogle-connect-staging
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: off
    buildCommand: node --check deploy/noogle-render/server.mjs && node --test deploy/noogle-render/server.test.mjs deploy/noogle-render/pairing-preview.test.mjs deploy/noogle-render/chromebook.test.mjs apps/neo-connect-chromebook/*.test.mjs
    startCommand: node deploy/noogle-render/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
