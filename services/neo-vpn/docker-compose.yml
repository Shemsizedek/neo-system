services:
  neo-vpn:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: neo-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - SERVERURL=${NEO_VPN_HOST}
      - SERVERPORT=${NEO_VPN_PORT:-51820}
      - PEERS=1
      - PEERDNS=${NEO_VPN_DNS:-auto}
      - INTERNAL_SUBNET=10.144.0.0
      - ALLOWEDIPS=10.144.0.0/16
      - LOG_CONFS=false
    volumes:
      - ./runtime/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${NEO_VPN_PORT:-51820}:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    security_opt:
      - no-new-privileges:true

# Runtime-generated keys/config are intentionally stored under ./runtime,
# which must remain outside version control.
