<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO Counter · checkout preview</title><link rel="stylesheet" href="../merchant-checkout.css"><style>body{margin:0;padding:24px;background:#eef3ef;font-family:system-ui;color:#172920}.preview{max-width:940px;margin:auto;font-size:14px}.preview h1{font-size:22px}.preview-controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.preview select{padding:10px;border:1px solid #adc0b3;border-radius:8px;background:white;font:inherit}.notice{background:#fff4d8;border:1px solid #dbc995;border-radius:10px;padding:14px;font-size:13px}@media(max-width:500px){body{padding:12px}}</style></head><body><div class="preview"><h1>Simple merchant checkout</h1><div class="notice">Interactive design preview. The example wallet address is intentionally invalid. No payment can be made here; no live order or wallet is connected.</div><div class="preview-controls"><label>Currency <select id="asset"><option>NOMNI</option><option>BTC</option><option>NEOCASH</option></select></label><label>Invoice status <select id="state"><option value="AWAITING_PAYMENT">Awaiting payment (example)</option><option value="LOCKED_NOT_PAYABLE">Not ready</option><option value="PAYMENT_DETECTED">Confirming</option><option value="PAYMENT_CONFIRMED">Paid</option><option value="EXPIRED">Expired</option></select></label></div><section id="checkout"></section></div><script type="module">
